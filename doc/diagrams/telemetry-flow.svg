<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="21" font-weight="700" fill="#0f172a">Observability — Telemetry Flow</text>
  <text x="40" y="68" font-size="12.5" fill="#64748b">Hubs collect · the Tooling Cluster stores and displays</text>

  <!-- ================= Hub ================= -->
  <rect x="40" y="110" width="460" height="380" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="138" font-size="15" font-weight="700" fill="#334155">Hub</text>
  <text x="56" y="156" font-size="11" fill="#64748b">role: env · agents ship data outward</text>

  <!-- Sources (left column), one box per signal path. Logs are read from the
       Kubernetes API, not from pods: pods only write to stdout, the runtime
       captures it, the kubelet serves it — the API is Alloy's actual
       endpoint. Metrics use the API for discovery only; the exporters are
       scraped directly. -->
  <rect x="60" y="180" width="160" height="46" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="140" y="199" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">kube-state-metrics</text>
  <text x="140" y="214" font-size="9" fill="#64748b" text-anchor="middle">exporter</text>

  <rect x="60" y="238" width="160" height="46" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="140" y="257" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">node-exporter</text>
  <text x="140" y="272" font-size="9" fill="#64748b" text-anchor="middle">exporter</text>

  <rect x="60" y="296" width="160" height="46" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="140" y="315" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Kubernetes API</text>
  <text x="140" y="330" font-size="9" fill="#64748b" text-anchor="middle">pod stdout / stderr</text>

  <!-- Trace sources, one box per path. The sets differ: OTLP comes only from
       the annotated transfer-path pods (injected OTel SDK); Event-SDK spans
       come from ALL Mojaloop services and predate the OTel path entirely. -->
  <rect x="60" y="354" width="160" height="46" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="140" y="373" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">transfer-path services</text>
  <text x="140" y="388" font-size="9" fill="#64748b" text-anchor="middle">injected OTel SDK</text>

  <rect x="60" y="412" width="160" height="46" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="140" y="431" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">all Mojaloop services</text>
  <text x="140" y="446" font-size="9" fill="#64748b" text-anchor="middle">Event SDK · TRACE: kafka</text>

  <!-- Alloy -->
  <rect x="300" y="170" width="170" height="140" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="385" y="220" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">Alloy</text>
  <text x="385" y="240" font-size="9.5" fill="#64748b" text-anchor="middle">scrapes exporters ·</text>
  <text x="385" y="253" font-size="9.5" fill="#64748b" text-anchor="middle">reads container logs ·</text>
  <text x="385" y="266" font-size="9.5" fill="#64748b" text-anchor="middle">tail-samples traces</text>

  <!-- trace-bridge (legacy Event-SDK path) -->
  <rect x="300" y="412" width="170" height="46" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="385" y="431" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">trace-bridge</text>
  <text x="385" y="446" font-size="9.5" fill="#64748b" text-anchor="middle">Event-SDK spans → OTLP · legacy</text>

  <!-- pull arrows (inside Hub): Alloy acts on each endpoint -->
  <line x1="300" y1="203" x2="226" y2="203" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="194" font-size="9" fill="#475569" text-anchor="middle">scrapes</text>
  <line x1="300" y1="261" x2="226" y2="261" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="252" font-size="9" fill="#475569" text-anchor="middle">scrapes</text>
  <line x1="300" y1="305" x2="226" y2="305" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <text x="266" y="322" font-size="9" font-weight="600" fill="#10b981" text-anchor="middle">reads logs</text>

  <!-- trace source arrows (inside Hub): services push, agents don't scrape -->
  <polyline points="220,372 320,372 320,314" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="270" y="364" font-size="9" font-weight="600" fill="#f59e0b" text-anchor="middle">OTLP spans</text>
  <line x1="220" y1="435" x2="296" y2="435" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="258" y="427" font-size="9" font-weight="600" fill="#f59e0b" text-anchor="middle">via Kafka</text>

  <!-- ================= Tooling Cluster ================= -->
  <rect x="620" y="110" width="460" height="380" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="636" y="138" font-size="15" font-weight="700" fill="#334155">Tooling Cluster</text>
  <text x="636" y="156" font-size="11" fill="#64748b">role: cc · stores and displays</text>

  <rect x="640" y="170" width="180" height="52" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="730" y="192" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">Thanos</text>
  <text x="730" y="208" font-size="9.5" fill="#64748b" text-anchor="middle">metrics</text>

  <rect x="640" y="250" width="180" height="52" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="730" y="272" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">Loki</text>
  <text x="730" y="288" font-size="9.5" fill="#64748b" text-anchor="middle">logs</text>

  <rect x="640" y="330" width="180" height="52" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="730" y="352" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">Tempo</text>
  <text x="730" y="368" font-size="9.5" fill="#64748b" text-anchor="middle">traces</text>

  <rect x="900" y="240" width="150" height="72" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="975" y="271" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">Grafana</text>
  <text x="975" y="289" font-size="9.5" fill="#64748b" text-anchor="middle">dashboards &amp; alerting</text>

  <!-- Grafana queries arrows -->
  <polyline points="900,260 862,260 862,196 824,196" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="843" y="188" font-size="9" fill="#475569" text-anchor="middle">queries</text>
  <line x1="900" y1="276" x2="825" y2="276" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="868" y="268" font-size="9" fill="#475569" text-anchor="middle">queries</text>
  <polyline points="900,292 862,292 862,356 824,356" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="843" y="350" font-size="9" fill="#475569" text-anchor="middle">queries</text>

  <!-- ================= Cross-cluster pushes ================= -->
  <line x1="470" y1="196" x2="636" y2="196" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>
  <text x="553" y="187" font-size="9.5" font-weight="600" fill="#6366f1" text-anchor="middle">writes metrics</text>

  <line x1="470" y1="276" x2="636" y2="276" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>
  <text x="553" y="267" font-size="9.5" font-weight="600" fill="#10b981" text-anchor="middle">writes logs</text>

  <polyline points="470,300 560,300 560,342 636,342" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="560" y="292" font-size="9.5" font-weight="600" fill="#f59e0b" text-anchor="middle">writes traces</text>

  <polyline points="470,435 580,435 580,368 636,368" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="525" y="449" font-size="9.5" font-weight="600" fill="#f59e0b" text-anchor="middle">writes traces (legacy)</text>

  <!-- Legend -->
  <line x1="40" y1="510" x2="72" y2="510" stroke="#6366f1" stroke-width="2.5"/>
  <text x="80" y="514" font-size="10.5" fill="#64748b">metrics</text>
  <line x1="160" y1="510" x2="192" y2="510" stroke="#10b981" stroke-width="2.5"/>
  <text x="200" y="514" font-size="10.5" fill="#64748b">logs</text>
  <line x1="260" y1="510" x2="292" y2="510" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="300" y="514" font-size="10.5" fill="#64748b">traces</text>
  <text x="400" y="514" font-size="10.5" fill="#64748b">arrows start at the acting component</text>
</svg>
