<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 500" role="img" aria-label="Hub-participant boundary: the participant's Integration Toolkit stack collapsed on the left, the DTK-deployed Hub machinery detailed on the right, with the enrolment, token, and FSPIOP flows crossing the organisation boundary">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <!-- own background so the diagram reads identically on light and dark pages -->
  <rect x="0" y="0" width="1210" height="500" fill="#ffffff"/>

  <!-- organisation boundary -->
  <line x1="425" y1="80" x2="425" y2="470" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="425" y="64" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#64748b">organisation boundary — public internet</text>

  <!-- ===================== Participant side (collapsed) ===================== -->
  <rect x="20" y="70" width="370" height="400" rx="10" fill="#eef4fb" stroke="#7ba2c9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#33506b">Participant infrastructure</text>

  <rect x="50" y="140" width="280" height="74" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="190" y="164" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Integration Toolkit (ITK)</text>
  <text x="190" y="182" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">SDK scheme adapter · MCM Agent · Vault</text>
  <text x="190" y="198" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">documented in its own repository</text>

  <rect x="50" y="330" width="280" height="52" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="190" y="351" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Core banking system</text>
  <text x="190" y="367" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">participant backend</text>

  <line x1="190" y1="214" x2="190" y2="324" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="198" y="274" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">SDK backend API</text>

  <!-- ===================== Hub side (detailed) ===================== -->
  <rect x="460" y="70" width="730" height="400" rx="10" fill="#f6f1fb" stroke="#a58cc5" stroke-width="1.5"/>
  <text x="476" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#5b4a7a">Mojaloop Hub — deployed with DTK (this repository)</text>

  <!-- extapi Envoy -->
  <rect x="490" y="110" width="200" height="56" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="590" y="131" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">FSPIOP extapi Envoy</text>
  <text x="590" y="148" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">inbound mTLS · trust bundle</text>

  <!-- dfsp-egress Envoy -->
  <rect x="490" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="590" y="221" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">dfsp-egress Envoy</text>
  <text x="590" y="238" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">originates outbound mTLS</text>

  <!-- MCM -->
  <rect x="490" y="300" width="200" height="48" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="590" y="320" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">MCM</text>
  <text x="590" y="336" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">Connection Manager</text>

  <!-- Hydra -->
  <rect x="490" y="380" width="200" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="590" y="398" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">IAM — Ory Hydra</text>
  <text x="590" y="414" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">OAuth2 issuer</text>

  <!-- Mojaloop services -->
  <rect x="760" y="140" width="190" height="76" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="855" y="164" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Mojaloop services</text>
  <text x="855" y="182" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">ALS · quoting · ml-api-adapter</text>
  <text x="855" y="198" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">bulk · transaction requests</text>

  <!-- Vault (scheme PKI) -->
  <rect x="1000" y="140" width="170" height="52" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="1085" y="161" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Vault</text>
  <text x="1085" y="177" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">scheme PKI · participant records</text>

  <!-- Vault Agent -->
  <rect x="1000" y="260" width="170" height="64" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="1085" y="282" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Vault Agent</text>
  <text x="1085" y="298" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">renders certs, trust bundle,</text>
  <text x="1085" y="312" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">egress config</text>

  <!-- internal hub arrows -->
  <line x1="690" y1="150" x2="754" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="722" y="146" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">HTTP, by path</text>

  <path d="M 760 205 L 725 205 L 725 222 L 694 222" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="726" y="197" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">callbacks, redirected</text>

  <line x1="1085" y1="260" x2="1085" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1093" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">watches records</text>

  <path d="M 1000 276 L 745 276 L 745 170 L 694 158" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">renders trust bundle</text>

  <path d="M 1000 308 L 730 308 L 730 248 L 694 248" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="326" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">renders client certs + config</text>

  <path d="M 690 340 L 970 340 L 970 180 L 996 174" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850" y="356" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">signs CSRs against client-cert-role</text>

  <!-- cross-boundary arrows -->
  <line x1="334" y1="160" x2="486" y2="132" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="410" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0e7490">FSPIOP requests</text>
  <text x="410" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0e7490">mTLS + JWS</text>

  <line x1="486" y1="232" x2="334" y2="196" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="410" y="250" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0e7490">FSPIOP callbacks</text>
  <text x="410" y="264" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0e7490">mTLS · SNI = participant FQDN</text>

  <path d="M 334 190 L 396 190 L 396 316 L 486 316" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="308" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">enrols, renews — HTTPS</text>

  <path d="M 334 204 L 376 204 L 376 398 L 486 398" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">OAuth2 client_credentials</text>
</svg>
