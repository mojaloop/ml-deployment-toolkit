<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 190" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="190" fill="#ffffff"/>

  <!-- Card 1: Architecture -->
  <rect x="14" y="16" width="232" height="156" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="130" y="44" font-size="11" fill="#334155" text-anchor="middle">Understand the design</text>
  <text x="130" y="60" font-size="11" fill="#334155" text-anchor="middle">or its trade-offs</text>
  <line x1="130" y1="72" x2="130" y2="92" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="60" y="98" width="140" height="32" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="119" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Architecture</text>
  <text x="130" y="152" font-size="9.5" fill="#64748b" text-anchor="middle">Why is it built this way?</text>

  <!-- Card 2: Platform -->
  <rect x="264" y="16" width="232" height="156" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="44" font-size="11" fill="#334155" text-anchor="middle">Contribute to</text>
  <text x="380" y="60" font-size="11" fill="#334155" text-anchor="middle">this codebase</text>
  <line x1="380" y1="72" x2="380" y2="92" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="310" y="98" width="140" height="32" rx="16" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="380" y="119" font-size="13" font-weight="700" fill="#075985" text-anchor="middle">Platform</text>
  <text x="380" y="152" font-size="9.5" fill="#64748b" text-anchor="middle">How do I build and extend the distribution?</text>

  <!-- Card 3: Integrator -->
  <rect x="514" y="16" width="232" height="156" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="630" y="44" font-size="11" fill="#334155" text-anchor="middle">Tailor the distribution</text>
  <text x="630" y="60" font-size="11" fill="#334155" text-anchor="middle">for a client</text>
  <line x1="630" y1="72" x2="630" y2="92" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="560" y="98" width="140" height="32" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="630" y="119" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">Integrator</text>
  <text x="630" y="152" font-size="9.5" fill="#64748b" text-anchor="middle">How do I tailor it and stay on the upstream track?</text>

  <!-- Card 4: Adopter -->
  <rect x="764" y="16" width="232" height="156" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="880" y="52" font-size="11" fill="#334155" text-anchor="middle">Run a Hub</text>
  <line x1="880" y1="72" x2="880" y2="92" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="810" y="98" width="140" height="32" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="880" y="119" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Adopter</text>
  <text x="880" y="152" font-size="9.5" fill="#64748b" text-anchor="middle">How do I run a Hub?</text>

  <!-- Card 5: Participant -->
  <rect x="1014" y="16" width="232" height="156" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1130" y="52" font-size="11" fill="#334155" text-anchor="middle">Connect to a Hub</text>
  <line x1="1130" y1="72" x2="1130" y2="92" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="1060" y="98" width="140" height="32" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="1130" y="119" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Participant</text>
  <text x="1130" y="152" font-size="9.5" fill="#64748b" text-anchor="middle">How do I connect to a Hub?</text>
</svg>
