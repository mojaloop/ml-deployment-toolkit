<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 870" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1450" height="870" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="21" font-weight="700" fill="#0f172a">ML Deployment Toolkit — Deployed System View</text>
  <text x="40" y="68" font-size="12.5" fill="#64748b">Everything `make plan-apply` leaves running · Proxmox / Talos reference infrastructure</text>

  <!-- ================= Hub ================= -->
  <!-- stacked shadow: one Hub per environment -->
  <rect x="294" y="144" width="560" height="640" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="280" y="130" width="560" height="640" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="158" font-size="15" font-weight="700" fill="#334155">DTK — Deployment Toolkit</text>
  <text x="300" y="176" font-size="11" fill="#64748b">role: hub · one per environment</text>

  <!-- Left lane: four entry points -->
  <rect x="295" y="228" width="95" height="85" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="342" y="251" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">intapi</text>
  <text x="342" y="266" font-size="9.5" fill="#4f46e5" text-anchor="middle">admin API edge</text>
  <text x="342" y="281" font-size="9" fill="#4f46e5" text-anchor="middle">OAuth2 · machine</text>
  <text x="342" y="293" font-size="9" fill="#4f46e5" text-anchor="middle">clients</text>

  <rect x="295" y="345" width="95" height="85" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="342" y="368" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">extapi</text>
  <text x="342" y="383" font-size="9.5" fill="#4f46e5" text-anchor="middle">mTLS edge — Envoy</text>
  <text x="342" y="398" font-size="9" fill="#4f46e5" text-anchor="middle">scheme CA · client</text>
  <text x="342" y="410" font-size="9" fill="#4f46e5" text-anchor="middle">certs required</text>

  <rect x="295" y="472" width="95" height="55" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="342" y="494" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">gw-ext</text>
  <text x="342" y="511" font-size="8.5" fill="#64748b" text-anchor="middle">*.ext — external parties</text>

  <rect x="295" y="552" width="95" height="55" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="342" y="574" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">gw-int</text>
  <text x="342" y="591" font-size="8.5" fill="#64748b" text-anchor="middle">*.int — internal ops</text>

  <!-- Mojaloop application -->
  <rect x="410" y="185" width="410" height="145" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="425" y="207" font-size="13" font-weight="700" fill="#3730a3">Mojaloop application</text>

  <rect x="425" y="218" width="380" height="58" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="615" y="238" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">Core services</text>
  <text x="615" y="256" font-size="10.5" fill="#334155" text-anchor="middle">central ledger · account lookup · quoting · settlement</text>
  <text x="615" y="270" font-size="9.5" fill="#64748b" text-anchor="middle">FSPIOP / ISO 20022 · JWS signing</text>

  <rect x="425" y="286" width="185" height="36" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="517" y="301" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">MCM</text>
  <text x="517" y="315" font-size="9" fill="#64748b" text-anchor="middle">participant onboarding &amp; certs</text>

  <rect x="620" y="286" width="185" height="36" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="712" y="301" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">Finance Portal</text>
  <text x="712" y="315" font-size="9" fill="#64748b" text-anchor="middle">positions · funds in/out · settlements</text>

  <!-- Row 2: Data layer -->
  <rect x="410" y="348" width="410" height="80" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="615" y="370" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">Data layer</text>
  <rect x="425" y="382" width="88" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="469" y="397" font-size="10.5" fill="#334155" text-anchor="middle">MySQL (PXC)</text>
  <rect x="522" y="382" width="95" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="569" y="397" font-size="10.5" fill="#334155" text-anchor="middle">Kafka (Strimzi)</text>
  <rect x="626" y="382" width="110" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="681" y="397" font-size="10.5" fill="#334155" text-anchor="middle">MongoDB (PSMDB)</text>
  <rect x="745" y="382" width="60" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="775" y="397" font-size="10.5" fill="#334155" text-anchor="middle">Redis</text>
  <text x="615" y="420" font-size="9.5" fill="#64748b" text-anchor="middle">operator-managed, replicated · backups to S3</text>

  <!-- Row 3: IAM, Observability agent -->
  <rect x="410" y="446" width="195" height="95" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="507" y="470" font-size="12" font-weight="700" fill="#6b21a8" text-anchor="middle">IAM — Ory</text>
  <text x="507" y="494" font-size="10" fill="#334155" text-anchor="middle">Kratos · Hydra · Keto · Oathkeeper</text>
  <text x="507" y="520" font-size="9.5" fill="#64748b" text-anchor="middle">SSO, OAuth2 &amp; access control</text>

  <rect x="625" y="446" width="195" height="95" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="722" y="470" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">Observability agent</text>
  <text x="722" y="494" font-size="10" fill="#334155" text-anchor="middle">Alloy · node-exporter</text>
  <text x="722" y="509" font-size="10" fill="#334155" text-anchor="middle">kube-state-metrics</text>
  <text x="722" y="529" font-size="9.5" fill="#64748b" text-anchor="middle">remote-writes off-cluster</text>

  <!-- Row 4: Vault, Platform services — on the foundation -->
  <rect x="410" y="559" width="195" height="88" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="507" y="583" font-size="12" font-weight="700" fill="#9a3412" text-anchor="middle">Vault</text>
  <text x="507" y="606" font-size="10" fill="#334155" text-anchor="middle">runtime secrets · scheme PKI</text>
  <text x="507" y="630" font-size="9.5" fill="#64748b" text-anchor="middle">3-node Raft</text>

  <rect x="625" y="559" width="195" height="88" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="722" y="583" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Platform services</text>
  <text x="722" y="606" font-size="10" fill="#334155" text-anchor="middle">Flux · cert-manager</text>
  <text x="722" y="621" font-size="10" fill="#334155" text-anchor="middle">external-secrets · external-dns</text>
  <text x="722" y="636" font-size="10" fill="#334155" text-anchor="middle">Gateway API</text>

  <!-- Hub foundation -->
  <rect x="295" y="665" width="525" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="557" y="682" font-size="11" fill="#334155" text-anchor="middle">Kubernetes · Cilium CNI</text>
  <rect x="295" y="695" width="525" height="26" rx="4" fill="#d5dce6" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="557" y="712" font-size="11" fill="#334155" text-anchor="middle">Talos Linux — immutable, API-managed OS</text>
  <rect x="295" y="725" width="525" height="26" rx="4" fill="#c8d2df" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="557" y="742" font-size="11" fill="#334155" text-anchor="middle">Proxmox VE — virtual machines</text>

  <!-- ================= Tooling Cluster ================= -->
  <rect x="900" y="290" width="320" height="390" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="916" y="318" font-size="15" font-weight="700" fill="#334155">Tooling Cluster</text>
  <text x="916" y="336" font-size="11" fill="#64748b">role: tooling · management plane · optional</text>

  <rect x="915" y="353" width="290" height="70" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1060" y="378" font-size="11.5" font-weight="700" fill="#854d0e" text-anchor="middle">MinIO — S3 object storage</text>
  <text x="1060" y="398" font-size="9.5" fill="#64748b" text-anchor="middle">backups · long-term metrics &amp; logs</text>

  <rect x="915" y="459" width="290" height="70" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1060" y="482" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">Observability backend</text>
  <text x="1060" y="500" font-size="10" fill="#334155" text-anchor="middle">Thanos · Loki · Tempo · Grafana</text>
  <text x="1060" y="515" font-size="9.5" fill="#64748b" text-anchor="middle">one view across every environment</text>

  <rect x="915" y="568" width="290" height="70" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="1060" y="591" font-size="12.5" font-weight="700" fill="#075985" text-anchor="middle">Harbor — OCI registry</text>
  <text x="1060" y="609" font-size="10" fill="#334155" text-anchor="middle">hosts the distribution artifact</text>
  <text x="1060" y="624" font-size="10" fill="#334155" text-anchor="middle">pull-through image cache</text>

  <!-- ================= External actors ================= -->
  <rect x="40" y="225" width="190" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="135" y="251" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">External tools</text>
  <text x="135" y="271" font-size="10" fill="#334155" text-anchor="middle">adopter / SI GUIs &amp; automation</text>
  <text x="135" y="289" font-size="9.5" fill="#64748b" text-anchor="middle">can replace FP / MCM workflows</text>

  <rect x="40" y="340" width="190" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="135" y="368" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Participant ITK</text>
  <text x="135" y="387" font-size="10" fill="#334155" text-anchor="middle">banks · wallets · MMOs</text>
  <text x="135" y="406" font-size="9.5" fill="#64748b" text-anchor="middle">SDK scheme adapter or</text>
  <text x="135" y="420" font-size="9.5" fill="#64748b" text-anchor="middle">Integration Toolkit</text>

  <rect x="40" y="470" width="190" height="60" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="135" y="494" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Participant operators</text>
  <text x="135" y="511" font-size="9.5" fill="#64748b" text-anchor="middle">DFSP staff — MCM UI</text>

  <rect x="40" y="550" width="190" height="60" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="135" y="574" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Hub operators</text>
  <text x="135" y="591" font-size="9.5" fill="#64748b" text-anchor="middle">business &amp; platform teams</text>

  <rect x="40" y="660" width="190" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="135" y="692" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Platform operator</text>
  <text x="135" y="714" font-size="9.5" fill="#64748b" text-anchor="middle">Terraform provisions, then</text>
  <text x="135" y="728" font-size="9.5" fill="#64748b" text-anchor="middle">bootstraps Flux</text>

  <!-- External oracles (stacked: can be multiple) -->
  <rect x="1147" y="202" width="190" height="80" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="1135" y="190" width="190" height="80" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1230" y="218" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">External oracles</text>
  <text x="1230" y="238" font-size="10" fill="#334155" text-anchor="middle">ALIAS · IBAN · custom types</text>
  <text x="1230" y="254" font-size="9.5" fill="#64748b" text-anchor="middle">scheme-operated · optional</text>

  <rect x="1260" y="564" width="160" height="78" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1340" y="588" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Upstream registries</text>
  <text x="1340" y="606" font-size="9.5" fill="#334155" text-anchor="middle">Docker Hub · ghcr.io ·</text>
  <text x="1340" y="620" font-size="9.5" fill="#334155" text-anchor="middle">quay.io — charts &amp; images</text>

  <!-- ================= Arrows ================= -->
  <!-- External tools -> intapi -->
  <line x1="234" y1="270" x2="291" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="248" font-size="9" fill="#475569" text-anchor="middle">triggers</text>
  <text x="262" y="259" font-size="9" fill="#475569" text-anchor="middle">operations</text>

  <!-- Participants <-> extapi -->
  <line x1="234" y1="390" x2="291" y2="390" stroke="#6366f1" stroke-width="3" marker-start="url(#arrowIndigo)" marker-end="url(#arrowIndigo)"/>
  <text x="260" y="356" font-size="9" font-weight="600" fill="#4f46e5" text-anchor="middle">mTLS · JWS</text>
  <text x="260" y="368" font-size="8.5" font-weight="600" fill="#4f46e5" text-anchor="middle">FSPIOP / ISO 20022</text>

  <!-- Operators -> gateways -->
  <line x1="234" y1="500" x2="291" y2="500" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="490" font-size="9.5" fill="#475569" text-anchor="middle">SSO</text>
  <line x1="234" y1="580" x2="291" y2="580" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="570" font-size="9.5" fill="#475569" text-anchor="middle">SSO</text>

  <!-- Core services -> external oracles -->
  <line x1="809" y1="230" x2="1131" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="970" y="219" font-size="9" fill="#475569" text-anchor="middle">oracle lookups</text>

  <!-- Data layer -> MinIO -->
  <line x1="824" y1="388" x2="911" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="868" y="376" font-size="9" fill="#475569" text-anchor="middle">backups</text>

  <!-- Observability agent -> observability backend -->
  <line x1="824" y1="494" x2="911" y2="494" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="868" y="482" font-size="9" fill="#475569" text-anchor="middle">remote-write</text>

  <!-- Flux (platform services) -> Harbor -->
  <line x1="824" y1="603" x2="911" y2="603" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="868" y="579" font-size="9" fill="#475569" text-anchor="middle">Flux pulls the</text>
  <text x="868" y="591" font-size="9" fill="#475569" text-anchor="middle">gitops artifact</text>

  <!-- Harbor -> upstream registries -->
  <line x1="1209" y1="603" x2="1256" y2="603" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1232" y="592" font-size="8.5" fill="#475569" text-anchor="middle">proxy pull</text>

  <!-- Platform operator -> Hub foundation -->
  <line x1="234" y1="738" x2="291" y2="738" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="728" font-size="9" fill="#475569" text-anchor="middle">provisions</text>


  <!-- Legend -->
  <rect x="300" y="828" width="14" height="14" rx="3" fill="#ffffff" stroke="#64748b" stroke-dasharray="4 3"/>
  <text x="322" y="839" font-size="10.5" fill="#64748b">dashed — outside the deployed clusters</text>
  <line x1="560" y1="835" x2="600" y2="835" stroke="#6366f1" stroke-width="3"/>
  <text x="610" y="839" font-size="10.5" fill="#64748b">participant payment traffic (mTLS)</text>
  <text x="880" y="839" font-size="10.5" fill="#64748b">arrows start at the acting component</text>
</svg>
