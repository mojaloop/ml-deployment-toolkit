# yaml-language-server: $schema=../../config/schemas/params.schema.json
# -----------------------------------------------------------------------------
# Provider parameters — DigitalOcean (DOKS)
#
# `params` is the provider interface (see proxmox/params.yaml for the model).
# UNVALIDATED: interface validation waits on a real second provider tested
# against real infrastructure; these values are the best current mapping of
# the interface onto DOKS and may change when that validation happens.
#
# `infra` is Terraform-consumed provider configuration (provider-package
# infra facts).
# -----------------------------------------------------------------------------
version: 1
# Contract version implemented — must equal config/definitions/provider-contract.yaml
# (plain equality assert, one contract version per DTK release).
contract_version: 1
description: "DigitalOcean DOKS managed Kubernetes (interface unvalidated)"

# Structural facts consulted by config-loader/flux-config instead of
# hardcoded provider-name lists (see params.schema.json). The in-cluster
# data layer has never been validated on DOKS — hub environments here must
# use external-unmanaged data stores until that validation happens.
capabilities:
  in_cluster_data: false

params:
  P_GATEWAY_CLASS: "cilium"
  # Empty = rely on the cluster default StorageClass (do-block-storage on DOKS).
  P_STORAGE_CLASS: ""
  P_NODE_ROLE_LABEL_KEY: "node-role"
  # L2 announcements do not apply to a cloud LB; empty disables the concept.
  P_L2_INTERFACE_REGEX: ""
  # In-cluster API service endpoint (no KubePrism outside Talos).
  P_KUBE_API_HOST: "kubernetes.default.svc"
  P_KUBE_API_PORT: "443"

infra:
  # VPC defaults
  vpc:
    ip_range: "10.10.0.0/16"
