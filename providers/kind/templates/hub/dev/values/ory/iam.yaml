# Template overlay — asserts this capacity profile's tuning explicitly, so a
# drift in the common defaults can never silently change a deployed profile.
# Merged over the common layer via the <namespace>-<release>-values-template slot; the environment layer wins last.
hydra:
  replicaCount: 1
kratos:
  replicaCount: 1
keto:
  replicaCount: 1
oathkeeper:
  replicaCount: 1
ml-iam-services:
  decision:
    replicaCount: 1

# Mail catcher: the courier's SMTP target, with the invitation and recovery
# mail readable over the internal gateway. Accepts whatever credentials the
# seeded connection URI carries, over plain SMTP.
mailpit:
  enabled: true
  extraEnvVars:
    - name: MP_SMTP_AUTH_ACCEPT_ANY
      value: "1"
    - name: MP_SMTP_AUTH_ALLOW_INSECURE
      value: "1"
