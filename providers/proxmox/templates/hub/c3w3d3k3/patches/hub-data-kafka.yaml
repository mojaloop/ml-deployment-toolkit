# Template patches — placement, not capacity: harden the distribution's soft
# kafka-pool affinity to REQUIRED for this template's tainted kafka pool.
# JSON 6902 to add a sibling key without touching the preferred block.
- target:
    group: kafka.strimzi.io
    version: v1
    kind: KafkaNodePool
    name: dual-role
    namespace: data
  patch:
    - op: add
      path: /spec/template/pod/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution
      value:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role
                operator: In
                values: ["kafka"]
