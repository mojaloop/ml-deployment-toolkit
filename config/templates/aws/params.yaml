# yaml-language-server: $schema=../../schemas/params.schema.json
# -----------------------------------------------------------------------------
# Provider parameters — AWS (EKS)
#
# `params` is the provider interface (see proxmox/params.yaml for the model).
# UNVALIDATED: interface validation waits on a real second provider tested
# against real infrastructure; these values are the best current mapping of
# the interface onto EKS and may change when that validation happens.
#
# `infra` is Terraform-consumed provider configuration (formerly
# config/templates/mappings/aws.yaml).
# -----------------------------------------------------------------------------
version: 1
description: "AWS EKS managed Kubernetes (interface unvalidated)"

# Structural facts consulted by config-loader/flux-config instead of
# hardcoded provider-name lists (see params.schema.json). The in-cluster
# data layer is the DTK's deployed production architecture on AWS; managed
# services remain reachable through external-unmanaged (ADR-024 boundary).
capabilities:
  in_cluster_data: true

params:
  P_GATEWAY_CLASS: "cilium"
  # Empty = rely on the cluster default StorageClass (EBS CSI default on EKS).
  P_STORAGE_CLASS: ""
  P_NODE_ROLE_LABEL_KEY: "node-role"
  # L2 announcements do not apply to a cloud LB; empty disables the concept.
  P_L2_INTERFACE_REGEX: ""
  # In-cluster API service endpoint (no KubePrism outside Talos).
  P_KUBE_API_HOST: "kubernetes.default.svc"
  P_KUBE_API_PORT: "443"

infra:
  # VPC defaults
  vpc:
    cidr: "10.0.0.0/16"

  # Workload class -> EC2 instance type.
  # Sized against the capacity templates (control-plane 4-6 cores / 8 GB,
  # workers 6-8 cores / 12-16 GB, db nodes memory-heavy).
  instance_types:
    control-plane: "m5.xlarge"      # 4 vCPU / 16 GiB
    mixed-plane: "m5.2xlarge"       # 8 vCPU / 32 GiB
    worker-general: "m5.2xlarge"    # 8 vCPU / 32 GiB
    worker-kafka: "m5.2xlarge"      # 8 vCPU / 32 GiB
    worker-db: "r5.xlarge"          # 4 vCPU / 32 GiB (memory-optimized)
    worker-hub: "c5.2xlarge"        # 8 vCPU / 16 GiB (compute-optimized, stateless hub core)
