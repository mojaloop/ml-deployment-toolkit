# yaml-language-server: $schema=../../../../schemas/template-placement.schema.json
# -----------------------------------------------------------------------------
# Template placement — the SHAPE this template deploys: node pools, sizing,
# default topology. The environment owns the INSTANCE: its placement.yaml may
# override pools by name (count, extra pools, enabled: false to drop one).
#
# AWS consumes name, class and count ONLY: each group becomes an EKS managed
# node group whose instance type is params.yaml infra.instance_types[class].
# cores/memory/disks/placement are schema-required cross-provider fields —
# on AWS they document intent (sized to match the instance type) but are not
# rendered; pg-N groups have no meaning on a cloud scheduler.
# -----------------------------------------------------------------------------
version: 1

# --- Infrastructure topology ---
# Each group becomes one EKS managed node group of <count> nodes.
node_groups:
  - name: m
    class: mixed-plane
    count: 1
    cores: 8
    memory: 12288        # MB
    disks: [64, 64]      # GB, rendered as scsi0..scsiN (Proxmox) / root+extra (cloud)
    placement: [pg-2]
