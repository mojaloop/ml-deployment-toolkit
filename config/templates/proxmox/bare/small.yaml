# yaml-language-server: $schema=../../../schemas/template.schema.json
# -----------------------------------------------------------------------------
# Deployment template — base/small (DFSP simulator / lightweight cluster)
# Provider-independent capacity template: node groups only.
# Base clusters deploy platform services only — no app/data/cc sections needed.
# Provider specifics (VM defaults, instance types) live in mappings/<provider>.yaml
# -----------------------------------------------------------------------------
version: 1
description: "Single mixed-plane node lightweight cluster (DFSP simulator)"

# --- Infrastructure topology ---
# Each group expands to <count> nodes named <cluster>-<name>-<index>.
# placement is index-aligned (node i -> placement[i]); shorter lists wrap around.
node_groups:
  - name: m
    class: mixed-plane
    count: 1
    cores: 8
    memory: 4096         # MB
    disks: [64, 64]      # GB
    placement: [pg-2]
