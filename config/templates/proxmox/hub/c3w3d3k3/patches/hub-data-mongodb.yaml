# Template patches — placement, not capacity: harden the distribution's soft
# db-pool affinity to REQUIRED for this template's tainted db pool. JSON 6902
# because replsets is a list (strategic merge would replace the whole list).
- target:
    group: psmdb.percona.com
    version: v1
    kind: PerconaServerMongoDB
    name: bulk-mongodb
    namespace: data
  patch:
    - op: add
      path: /spec/replsets/0/affinity/advanced/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution
      value:
        nodeSelectorTerms:
          - matchExpressions:
              - key: ${P_NODE_ROLE_LABEL_KEY}
                operator: In
                values: ["db"]
