# Template overlay — placement, not capacity: pin the Mojaloop core services
# to this template's dedicated, tainted hub pool. Merged over the common layer
# via the <namespace>-<release>-values-template slot; the environment layer
# wins last. The pool taint (node-role=hub:NoSchedule, see placement.yaml)
# keeps everything else off those nodes; the nodeSelector + toleration here
# keep the core ONLY there. Both sides live in this one template, so templates
# without a hub pool are untouched.
#
# Deliberately NOT pinned to hub (they stay on the general workers):
# ml-testing-toolkit (test tooling, not switch core) and the disabled charts.

x-hub-placement:
  nodeSelector: &hubNodeSelector
    ${P_NODE_ROLE_LABEL_KEY}: hub
  tolerations: &hubTolerations
    - key: ${P_NODE_ROLE_LABEL_KEY}
      operator: Equal
      value: hub
      effect: NoSchedule

centralledger:
  centralledger-service:
    nodeSelector: *hubNodeSelector
    tolerations: *hubTolerations
  centralledger-handler-transfer-prepare:
