# yaml-language-server: $schema=../../schemas/template.schema.json
# -----------------------------------------------------------------------------
# Deployment template — cc/small (Tooling Cluster, 1-2 environments)
# Provider-independent capacity template: node groups + service tuning.
# Provider specifics (VM defaults, instance types) live in mappings/<provider>.yaml
# -----------------------------------------------------------------------------
version: 1
description: "Single mixed-plane node tooling cluster"

# --- Infrastructure topology ---
# Each group expands to <count> nodes named <cluster>-<name>-<index>.
# placement is index-aligned (node i -> placement[i]); shorter lists wrap around.
node_groups:
  - name: m
    class: mixed-plane
    count: 1
    cores: 8
    memory: 10240        # MB
    disks: [64, 64]      # GB, rendered as scsi0..scsiN (Proxmox) / root+extra (cloud)
    placement: [pg-1]

# --- CC services scaling ---
cc:
  vault_replicas: 1
  harbor_registry_storage: "20Gi"
  harbor_db_storage: "2Gi"
  harbor_redis_storage: "1Gi"
  harbor_trivy_storage: "5Gi"
  minio_replicas: 1
  minio_storage: "32Gi"
