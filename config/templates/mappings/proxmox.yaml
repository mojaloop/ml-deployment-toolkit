# yaml-language-server: $schema=../../schemas/mapping.schema.json
# -----------------------------------------------------------------------------
# Provider mapping — Proxmox
# Translates capacity-template node groups into concrete Proxmox VMs.
# Distribution-maintained; adopters do not edit this file.
# -----------------------------------------------------------------------------
version: 1

# Talos image settings
talos:
  platform: "nocloud"
  image:
    content_type: "iso"
    datastore: "local"
    decompression: "gz"

# VM defaults applied to every rendered node
vm_defaults:
  cpu_type: "host"
  scsihw: "virtio-scsi-pci"
  boot_order: "scsi0"
  qemu_agent: true

  network:
    bridge: "vmbr0"
    model: "virtio"
    firewall: false

  disk:
    type: "scsi"
    format: "raw"
    discard: true

# Storage configuration
storage:
  default_pool: "local-lvm"

# Provider-specific Talos patches
talos-patches:
  config-patch-control-plane:
    ../../patches/talos/patch-vip.yaml.tpl
