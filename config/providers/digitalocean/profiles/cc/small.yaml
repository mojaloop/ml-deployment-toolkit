# -----------------------------------------------------------------------------
# CC Profile: small (1-2 environments)
# Provider: DigitalOcean (DOKS)
# Derived from: deployment template micro
# -----------------------------------------------------------------------------

# --- Infrastructure topology ---
infra:
  node_pools:
    - name: default
      size: s-4vcpu-8gb
      count: 1
      tags:
        - ml

# --- CC services scaling ---
cc:
  vault_replicas: 1
  harbor_registry_storage: "20Gi"
  harbor_db_storage: "2Gi"
  harbor_redis_storage: "1Gi"
  harbor_trivy_storage: "5Gi"
  minio_replicas: 1
  minio_storage: "20Gi"
