# Proxmox Infrastructure Configuration
# Provider-specific settings for Proxmox Virtual Environment

# Talos image settings
talos:
  platform: "nocloud"
  image:
    content_type: "iso"
    datastore: "local"
    decompression: "gz"

# VM Defaults
vm_defaults:
  cpu_type: "host"
  scsihw: "virtio-scsi-pci"
  boot_order: "scsi0"
  qemu_agent: true

  network:
    bridge: "vmbr0"
    model: "virtio"
    firewall: false

  disk:
    type: "scsi"
    format: "raw"
    discard: true

# Storage Configuration
storage:
  default_pool: "local-lvm"

# Provider-specific Talos patches
talos-patches:
  config-patch-control-plane:
    ../../patches/talos/patch-vip.yaml.tpl
