# Workload classes — class IDENTITY only (platform-owned, provider-neutral).
# Global versions are the single source of truth for Talos/Kubernetes/Flux versions.
#
# A class here is a name + intent + role identity (talos_type). Its
# MATERIALIZATION — how the class manifests on a provider: Talos config
# fragments, VM shape, instance type, node OS config — lives in the provider
# package's per-class seat (providers/<provider>/classes.yaml), which must
# cover every class named here. Anything provider-shaped in this file is the
# old drift-prone pattern reintroduced and is rejected at plan time.

# Global Talos/Kubernetes/Flux versions
talos_version: "v1.13.7"
kubernetes_version: "1.36.3"
# Flux distribution version — a platform definition, not adopter config.
# Moved here from the old cluster.flux.version silent default in config.yaml:
# versions are single-sourced in this file ("stated, never derived").
flux_version: "2.9.3"

# Talos image factory schematic (extensions baked into the image)
talos_image:
  schematic: "88d1f7a5c4f1d3aba7df787c448c1d3d008ed29cfb34af53fa0df4336a56040b"
  arch: "amd64"

# --- Workload classes ---
# Node labels are NOT declared here: they derive mechanically from the pool
# name (<P_NODE_ROLE_LABEL_KEY>=<pool>). Taints are declared by the pool
# itself in the template's placement.yaml. A pool meant for Kafka is simply
# NAMED kafka — that name becomes its label, and gitops selects on it.
classes:
  control-plane:
    talos_type: "controlplane"

  worker-general:
    talos_type: "worker"

  mixed-plane:
    talos_type: "controlplane"

  worker-kafka:
    talos_type: "worker"

  worker-db:
    talos_type: "worker"

  # Mojaloop core services (central-ledger, quoting, ALS, ml-api-adapter,
  # settlement, bulk): stateless and CPU-bound.
  worker-hub:
    talos_type: "worker"
