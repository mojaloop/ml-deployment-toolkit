# MCM routing — kratos proxy + oathkeeper API + UI catch-all
# Matches legacy/test/httproute-mcm.yaml pattern
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcm
  namespace: mcm
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "mcm.int.${domain}"
  rules:
    # Kratos proxy (no auth) — whoami + logout
    - matches:
        - path:
            type: PathPrefix
            value: /kratos
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: kratos-public
          namespace: ory
          port: 80
    # API routes through Oathkeeper (auth required)
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
    # UI catch-all
    - backendRefs:
        - name: mcm-connection-manager-ui
          port: 8080
