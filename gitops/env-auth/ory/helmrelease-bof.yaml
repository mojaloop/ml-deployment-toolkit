apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mojaloop-charts
  namespace: flux-system
spec:
  interval: 24h
  url: https://mojaloop.github.io/charts/repo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bof
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: bof
      version: "5.1.6"
      sourceRef:
        kind: HelmRepository
        name: mojaloop-charts
      interval: 12h
  targetNamespace: ory
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  values:
    global:
      keto:
        readURL: "http://keto-read:80"
        writeURL: "http://keto-write:80"
      rolePermOperator:
        mojaloopRole: {}
        mojaloopPermissionExclusion: {}
        apiSvc: {}

    security-role-perm-operator-svc:
      enabled: true
      ingress:
        enabled: false

    security-hub-bop-api-svc:
      enabled: false
    security-hub-bop-kratos-svc:
      enabled: false
    security-hub-bop-shell-svc:
      enabled: false
