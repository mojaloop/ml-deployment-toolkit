# Additional Oathkeeper access rules deployed as ConfigMap
# The main rules are embedded in the HelmRelease values.
# This ConfigMap provides supplementary rules that can be updated independently.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oathkeeper-extra-rules
  namespace: ory
data:
  extra-rules.json: |
    [
      {
        "id": "health-check",
        "upstream": {
          "url": "http://localhost:4456"
        },
        "match": {
          "url": "<https|http>://<finance-portal|mcm>.${domain}/health",
          "methods": ["GET"]
        },
        "authenticators": [{"handler": "anonymous"}],
        "authorizer": {"handler": "allow"},
        "mutators": [{"handler": "noop"}]
      }
    ]
