apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-email-templates
  namespace: ory
data:
  recovery-subject.gotmpl: |
    Set your password for {{ index (index .Identity "traits") "email" }}
  recovery-body.txt.gotmpl: |
    Hello,

    The ${hub_participant_name} hub administrator has requested that a password be set for your account.

    Click the link below to set your password:
    {{ .RecoveryURL }}

    This link expires in {{ .ExpiresInMinutes }} minutes.

    If you did not request this, you can safely ignore this email.
  recovery-body.html.gotmpl: |
    <html>
    <body style="font-family:sans-serif;color:#222;max-width:600px;margin:0 auto;padding:32px 16px;">
      <h2 style="color:#1a73e8;">Set your account password</h2>
      <p>
        The <strong>${hub_participant_name}</strong> hub administrator has requested that a
        password be set for your account (<strong>{{ index (index .Identity "traits") "email" }}</strong>).
      </p>
      <p style="margin:32px 0;">
        <a href="{{ .RecoveryURL }}"
           style="background:#1a73e8;color:#fff;padding:12px 28px;border-radius:4px;text-decoration:none;font-weight:bold;display:inline-block;">
          Set my password
        </a>
      </p>
      <p style="color:#555;font-size:14px;">
        Or copy this link into your browser:<br>
        <span style="word-break:break-all;">{{ .RecoveryURL }}</span>
      </p>
      <p style="color:#555;font-size:14px;">This link expires in {{ .ExpiresInMinutes }} minutes.</p>
      <hr style="border:none;border-top:1px solid #eee;margin:32px 0;">
      <p style="color:#aaa;font-size:12px;">
        If you did not request this, you can safely ignore this email.
      </p>
    </body>
    </html>
