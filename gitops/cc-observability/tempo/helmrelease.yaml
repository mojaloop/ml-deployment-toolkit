apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 12h
  releaseName: tempo
  targetNamespace: observability
  install:
    createNamespace: false
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
    - name: minio
  valuesFrom:
    - kind: Secret
      name: tempo-s3-credentials
      targetPath: tempo.storage.trace.s3.access_key
      valuesKey: accessKey
    - kind: Secret
      name: tempo-s3-credentials
      targetPath: tempo.storage.trace.s3.secret_key
      valuesKey: secretKey
    - kind: ConfigMap
      name: tempo-values-override
      valuesKey: values.yaml
      optional: true
  values:
    tempo:
      multitenancyEnabled: false

      # Receivers for different trace formats
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
            grpc:
              endpoint: 0.0.0.0:4317
        jaeger:
          protocols:
            thrift_http:
              endpoint: 0.0.0.0:14268
            grpc:
              endpoint: 0.0.0.0:14250
        zipkin:
          endpoint: 0.0.0.0:9411

      # S3 storage configuration
      storage:
        trace:
          backend: s3
          s3:
            bucket: tempo
            endpoint: minio.minio:9000
            insecure: true
            forcepathstyle: true
            # Credentials injected via valuesFrom above

      # Retention (7 days)
      retention: 168h

      # Memory ballast for stability
      memBallastSizeMbs: 128

      # Global overrides
      global_overrides:
        max_bytes_per_trace: 5000000

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    # Persistence
    persistence:
      enabled: true
      size: 2Gi

    # Service configuration
    service:
      type: ClusterIP

    # Monitoring
    serviceMonitor:
      enabled: false
