apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules-platform
  namespace: observability
  labels:
    grafana_alert: "1"
data:
  rules-platform.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: platform
        folder: Alerts
        interval: 1m
        rules:
          - uid: vault-sealed
            title: Vault sealed
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: thanos
                model:
                  expr: max by (cluster_name) ({__name__=~"vault_vault_.*_core_unsealed_.*"})
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  refId: C
                  conditions:
                    - evaluator: { type: lt, params: [1] }
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Vault is sealed in {{ $labels.cluster_name }} — secrets unavailable, dependent services will fail.'
          - uid: cert-expiring-soon
            title: Certificate expiring within 14 days
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: thanos
                model:
                  expr: min by (cluster_name, name) ((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  refId: C
                  conditions:
                    - evaluator: { type: lt, params: [14] }
            noDataState: OK
            execErrState: Error
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: 'Certificate {{ $labels.name }} in {{ $labels.cluster_name }} expires in under 14 days.'
          - uid: cert-not-ready
            title: Certificate not ready
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: thanos
                model:
                  expr: count by (cluster_name) (certmanager_certificate_ready_status{condition!="True"} == 1)
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  refId: C
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: '{{ $values.A }} certificate(s) not ready in {{ $labels.cluster_name }} for 30m — renewal may be stuck.'
          - uid: flux-not-ready
            title: Flux resource not ready
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: thanos
                model:
                  expr: count by (cluster_name) (gotk_resource_info{ready="False"})
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  refId: C
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: '{{ $values.A }} Flux resource(s) not ready in {{ $labels.cluster_name }} for 15m — cluster has drifted from git.'
          - uid: ory-5xx
            title: Hydra/Kratos server errors
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: thanos
                model:
                  expr: sum by (cluster_name) (rate(http_requests_statuses_total{service=~"hydra-admin|kratos-admin", status_bucket="5xx"}[5m]))
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  refId: C
                  conditions:
                    - evaluator: { type: gt, params: [0.1] }
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Hydra/Kratos 5xx above 0.1/s in {{ $labels.cluster_name }} — auth is degraded.'
          - uid: oathkeeper-5xx
            title: Oathkeeper server errors
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: thanos
                model:
                  expr: sum by (cluster_name) (rate(ory_oathkeeper_requests_total{status_code=~"5.."}[5m]))
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  refId: C
                  conditions:
                    - evaluator: { type: gt, params: [0.1] }
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Oathkeeper 5xx above 0.1/s in {{ $labels.cluster_name }} — the auth gateway is degraded.'
