apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cert-manager
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  cert-manager.json: |
    {
      "uid": "platform-cert-manager",
      "title": "cert-manager",
      "description": "cert-manager: certificate readiness, expiry, ACME requests, controller sync health",
      "tags": ["platform", "cert-manager", "tls"],
      "timezone": "utc",
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "cluster_name",
            "type": "query",
            "datasource": { "uid": "thanos" },
            "query": "label_values(certmanager_certificate_ready_status, cluster_name)",
            "refresh": 2,
            "includeAll": false,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "title": "Certificates Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "count(certmanager_certificate_ready_status{cluster_name=\"$cluster_name\",condition=\"True\"})",
              "legendFormat": "ready"
            }
          ],
          "options": { "colorMode": "none", "graphMode": "area" }
        },
        {
          "title": "Not Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(certmanager_certificate_ready_status{cluster_name=\"$cluster_name\",condition!=\"True\"}) or vector(0)",
              "legendFormat": "not ready"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Issuer Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "count(certmanager_issuer_ready_status{cluster_name=\"$cluster_name\",condition=\"True\"})",
              "legendFormat": "ready"
            }
          ],
          "options": { "colorMode": "none", "graphMode": "area" }
        },
        {
          "title": "ClusterIssuer Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "count(certmanager_clusterissuer_ready_status{cluster_name=\"$cluster_name\",condition=\"True\"})",
              "legendFormat": "ready"
            }
          ],
          "options": { "colorMode": "none", "graphMode": "area" }
        },
        {
          "title": "ACME Requests/s",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 1 } },
          "targets": [
            {
              "expr": "sum(rate(certmanager_http_acme_client_request_count{cluster_name=\"$cluster_name\"}[$__rate_interval]))",
              "legendFormat": "req/s"
            }
          ],
          "options": { "colorMode": "none", "graphMode": "area" }
        },
        {
          "title": "Controller Sync Errors/s",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(certmanager_controller_sync_error_count{cluster_name=\"$cluster_name\"}[$__rate_interval]))",
              "legendFormat": "errors/s"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Days to Certificate Expiry",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 14 },
                  { "color": "green", "value": 30 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(certmanager_certificate_expiration_timestamp_seconds{cluster_name=\"$cluster_name\"} - time()) / 86400",
              "legendFormat": "{{namespace}}/{{name}}"
            }
          ],
          "options": { "orientation": "horizontal", "displayMode": "gradient" }
        },
        {
          "title": "Days to Next Renewal",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 14 },
                  { "color": "green", "value": 30 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(certmanager_certificate_renewal_timestamp_seconds{cluster_name=\"$cluster_name\"} - time()) / 86400",
              "legendFormat": "{{namespace}}/{{name}}"
            }
          ],
          "options": { "orientation": "horizontal", "displayMode": "gradient" }
        },
        {
          "title": "ACME Request Rate by Status",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "fillOpacity": 20, "stacking": { "mode": "normal" } } } },
          "targets": [
            {
              "expr": "sum by (status) (rate(certmanager_http_acme_client_request_count{cluster_name=\"$cluster_name\"}[$__rate_interval]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "title": "ACME Request Latency (lifetime avg)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "uid": "thanos" },
          "description": "Average since pod start, per endpoint — ACME calls only happen at issuance/renewal, so a rate-based average would be blank (0/0) almost all the time",
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "certmanager_http_acme_client_request_duration_seconds_sum{cluster_name=\"$cluster_name\"} / certmanager_http_acme_client_request_duration_seconds_count{cluster_name=\"$cluster_name\"}",
              "legendFormat": "{{path}} ({{status}})"
            }
          ]
        },
        {
          "title": "Controller Sync Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "fillOpacity": 20 } } },
          "targets": [
            {
              "expr": "sum by (controller) (rate(certmanager_controller_sync_call_count{cluster_name=\"$cluster_name\"}[$__rate_interval]))",
              "legendFormat": "{{controller}}"
            }
          ]
        },
        {
          "title": "Controller Sync Errors",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "fillOpacity": 20 } } },
          "targets": [
            {
              "expr": "sum by (controller) (rate(certmanager_controller_sync_error_count{cluster_name=\"$cluster_name\"}[$__rate_interval]))",
              "legendFormat": "{{controller}}"
            }
          ]
        },
        {
          "title": "Certificates Not Ready",
          "type": "table",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 28 },
          "datasource": { "uid": "thanos" },
          "description": "Empty table = every certificate is Ready",
          "targets": [
            {
              "expr": "certmanager_certificate_ready_status{cluster_name=\"$cluster_name\", condition!=\"True\"} == 1",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": { "names": ["namespace", "exported_namespace", "name", "condition", "issuer_name"] }
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "namespace": "Namespace",
                  "exported_namespace": "Namespace ",
                  "name": "Certificate",
                  "condition": "Condition",
                  "issuer_name": "Issuer"
                }
              }
            }
          ]
        }
      ],
      "schemaVersion": 39
    }
