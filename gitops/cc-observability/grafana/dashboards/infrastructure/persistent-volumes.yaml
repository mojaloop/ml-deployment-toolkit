apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-persistent-volumes
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Infrastructure"
data:
  persistent-volumes.json: |
    {
      "uid": "infra-persistent-volumes",
      "title": "Persistent Volumes",
      "description": "PVC space and inode usage for stateful services (MySQL, Kafka, MongoDB, Vault)",
      "tags": ["infrastructure", "kubernetes", "storage"],
      "timezone": "utc",
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "cluster_name",
            "type": "query",
            "datasource": { "uid": "thanos" },
            "query": "label_values(kubelet_volume_stats_capacity_bytes, cluster_name)",
            "refresh": 2,
            "includeAll": false,
            "current": {}
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "uid": "thanos" },
            "query": "label_values(kubelet_volume_stats_capacity_bytes{cluster_name=\"$cluster_name\"}, namespace)",
            "refresh": 2,
            "includeAll": true,
            "current": {}
          }
        ]
      },
      "panels": [

        {
          "title": "Space Usage",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "title": "PVC Space Usage (%)",
          "type": "table",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 1 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "decimals": 1 },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Capacity" }, "properties": [{ "id": "unit", "value": "bytes" }] },
              { "matcher": { "id": "byName", "options": "Used" }, "properties": [{ "id": "unit", "value": "bytes" }] },
              { "matcher": { "id": "byName", "options": "Available" }, "properties": [{ "id": "unit", "value": "bytes" }] },
              {
                "matcher": { "id": "byName", "options": "Usage %" },
                "properties": [
                  { "id": "unit", "value": "percentunit" },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.75 }, { "color": "red", "value": 0.90 }] } },
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "kubelet_volume_stats_capacity_bytes{cluster_name=\"$cluster_name\", namespace=~\"$namespace\"}",
              "legendFormat": "{{ namespace }}/{{ persistentvolumeclaim }}",
              "format": "table",
              "instant": true,
              "refId": "capacity"
            },
            {
              "expr": "kubelet_volume_stats_used_bytes{cluster_name=\"$cluster_name\", namespace=~\"$namespace\"}",
              "legendFormat": "{{ namespace }}/{{ persistentvolumeclaim }}",
              "format": "table",
              "instant": true,
              "refId": "used"
            },
            {
              "expr": "kubelet_volume_stats_available_bytes{cluster_name=\"$cluster_name\", namespace=~\"$namespace\"}",
              "legendFormat": "{{ namespace }}/{{ persistentvolumeclaim }}",
              "format": "table",
              "instant": true,
              "refId": "available"
            }
          ],
          "transformations": [
            { "id": "seriesToColumns", "options": { "byField": "persistentvolumeclaim" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time 1": true, "Time 2": true, "Time 3": true, "__name__ 1": true, "__name__ 2": true, "__name__ 3": true, "cluster_name 1": true, "cluster_name 2": true, "cluster_name 3": true, "endpoint 1": true, "endpoint 2": true, "endpoint 3": true, "instance 1": true, "instance 2": true, "instance 3": true, "job 1": true, "job 2": true, "job 3": true, "metrics_path 1": true, "metrics_path 2": true, "metrics_path 3": true, "node 1": true, "node 2": true, "node 3": true, "namespace 2": true, "namespace 3": true },
                "renameByName": { "namespace 1": "Namespace", "persistentvolumeclaim": "PVC", "Value #capacity": "Capacity", "Value #used": "Used", "Value #available": "Available" }
              }
            },
            {
              "id": "calculateField",
              "options": { "alias": "Usage %", "mode": "binary", "binary": { "left": "Used", "operator": "/", "right": "Capacity" }, "reduce": { "reducer": "sum" } }
            }
          ],
          "options": { "sortBy": [{ "displayName": "Usage %", "desc": true }] }
        },

        {
          "title": "Space Usage Over Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 11 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "fillOpacity": 10 }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.75 }, { "color": "red", "value": 0.90 }] } } },
          "targets": [
            {
              "expr": "kubelet_volume_stats_used_bytes{cluster_name=\"$cluster_name\", namespace=~\"$namespace\"} / kubelet_volume_stats_capacity_bytes{cluster_name=\"$cluster_name\", namespace=~\"$namespace\"}",
              "legendFormat": "{{ namespace }}/{{ persistentvolumeclaim }}"
            }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"] } }
        },

        {
          "title": "Inode Usage",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 19 },
          "collapsed": false
        },
        {
          "title": "Inode Usage (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "fillOpacity": 10 }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.75 }, { "color": "red", "value": 0.90 }] } } },
          "targets": [
            {
              "expr": "kubelet_volume_stats_inodes_used{cluster_name=\"$cluster_name\", namespace=~\"$namespace\"} / kubelet_volume_stats_inodes{cluster_name=\"$cluster_name\", namespace=~\"$namespace\"}",
              "legendFormat": "{{ namespace }}/{{ persistentvolumeclaim }}"
            }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"] } }
        }
      ],
      "schemaVersion": 39
    }
