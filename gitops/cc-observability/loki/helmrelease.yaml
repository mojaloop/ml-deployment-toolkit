apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "6.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 12h
  releaseName: loki
  targetNamespace: observability
  install:
    createNamespace: false
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
    - name: minio
  valuesFrom:
    - kind: Secret
      name: loki-s3-credentials
      targetPath: loki.storage.s3.accessKeyId
      valuesKey: accessKey
    - kind: Secret
      name: loki-s3-credentials
      targetPath: loki.storage.s3.secretAccessKey
      valuesKey: secretKey
    # Also inject for storage config (redundant but ensures coverage)
    - kind: Secret
      name: loki-s3-credentials
      targetPath: loki.structuredConfig.storage_config.aws.access_key_id
      valuesKey: accessKey
    - kind: Secret
      name: loki-s3-credentials
      targetPath: loki.structuredConfig.storage_config.aws.secret_access_key
      valuesKey: secretKey
    - kind: ConfigMap
      name: loki-values-override
      valuesKey: values.yaml
      optional: true
  values:
    # Deployment mode: single binary (simpler for small scale)
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      # S3 storage configuration
      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki
        s3:
          endpoint: minio.minio:9000
          insecure: true
          s3ForcePathStyle: true

      # Schema configuration
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      # Limits and retention
      limits_config:
        retention_period: 168h  # 7 days
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        per_stream_rate_limit: 5MB
        per_stream_rate_limit_burst: 10MB

      # Compactor for retention enforcement
      compactor:
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        # Use S3 for delete request durability (survives pod restarts)
        delete_request_store: s3

    # Single binary deployment
    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 163m
          memory: 588Mi
        limits:
          memory: 588Mi
      persistence:
        enabled: true
        size: 5Gi

    # Disable all individual components (using SingleBinary instead)
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    ingester:
      replicas: 0
    distributor:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    ruler:
      enabled: false

    # Gateway for query access
    gateway:
      enabled: true
      replicas: 1
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

    # Results cache - reduce memory footprint for small deployment
    resultsCache:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 128Mi

    # Chunks cache - disable for minimal footprint (using S3 direct)
    chunksCache:
      enabled: false

    # Monitoring
    monitoring:
      serviceMonitor:
        enabled: false
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    # Test pod
    test:
      enabled: false
