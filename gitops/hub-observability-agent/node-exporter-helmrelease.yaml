apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.56.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  releaseName: node-exporter
  targetNamespace: observability
  install:
    createNamespace: false
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: node-exporter-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: observability-node-exporter-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: observability-node-exporter-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: observability-node-exporter-values-override
      valuesKey: values.yaml
      optional: true
