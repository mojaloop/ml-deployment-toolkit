apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NO kustomization-wide namespace here: it would rewrite EVERY resource's
# namespace, including obs-push-credentials, which must live in
# observability beside the Alloy pod that env-mounts it (a secretKeyRef
# cannot cross namespaces). Every flux-system resource in this layer
# declares its namespace explicitly instead.
resources:
  - grafana-helmrepo.yaml
  - kube-state-metrics-helmrelease.yaml
  - node-exporter-helmrelease.yaml
  - alloy-helmrelease.yaml
  - obs-push-credentials-secret.yaml

# Distribution values for each HelmRelease in this kustomization.
# Rendered into ConfigMaps that the HelmRelease references first in valuesFrom;
# the adopter's <release>-values-override is merged after them and wins.
configMapGenerator:
  - name: alloy-values
    namespace: flux-system
    files:
      - values.yaml=values/observability/alloy.yaml
  - name: kube-state-metrics-values
    namespace: flux-system
    files:
      - values.yaml=values/observability/kube-state-metrics.yaml
  - name: node-exporter-values
    namespace: flux-system
    files:
      - values.yaml=values/observability/node-exporter.yaml
generatorOptions:
  disableNameSuffixHash: true
