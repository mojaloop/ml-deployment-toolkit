# Distribution values for the kube-state-metrics HelmRelease.
# Adopter overrides go in environments/<env>/values/kube-state-metrics.yaml,
# which is merged after this file and therefore wins.
# Ensure cluster-wide access (not restricted to release namespace)
releaseNamespace: false
namespaces: ""

# Resource limits.
# No CPU limit: KSM bursts hard on cold start (full LIST of every resource
# below plus CRD discovery), and a CFS quota stalls it mid-probe, so the
# kubelet kills it for a failed liveness check and it never converges. The
# request still reserves capacity and sets the cgroup weight.
# Memory sized off the Goldilocks/VPA recommendation (target 156Mi,
# upperBound 235Mi) with headroom, since KSM's footprint scales with the
# number of objects watched and adopter clusters are larger than the lab.
resources:
  limits:
    memory: 384Mi
  requests:
    cpu: 100m
    memory: 160Mi

# Cold start LISTs every resource below across all namespaces; give the
# probes room to ride that out instead of killing the pod mid-sync.
livenessProbe:
  initialDelaySeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 10
  failureThreshold: 5

# Enable all default collectors
collectors:
  - certificatesigningrequests
  - configmaps
  - cronjobs
  - daemonsets
  - deployments
  - endpoints
  - horizontalpodautoscalers
  - ingresses
  - jobs
  - limitranges
  - mutatingwebhookconfigurations
  - namespaces
  - networkpolicies
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - poddisruptionbudgets
  - pods
  - replicasets
  - replicationcontrollers
  - resourcequotas
  - secrets
  - services
  - statefulsets
  - storageclasses
  - validatingwebhookconfigurations
  - volumeattachments

# Disable ServiceMonitor (we use prometheus.io annotations instead)
prometheus:
  monitor:
    enabled: false

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

# RBAC to list/watch Flux CRs for customResourceState metrics below
rbac:
  extraRules:
    - apiGroups:
        - source.toolkit.fluxcd.io
        - kustomize.toolkit.fluxcd.io
        - helm.toolkit.fluxcd.io
      resources:
        - gitrepositories
        - ocirepositories
        - helmrepositories
        - helmcharts
        - kustomizations
        - helmreleases
      verbs: ["list", "watch"]

# Flux resource state metrics (gotk_resource_info) — official Flux
# monitoring pattern (fluxcd/flux2-monitoring-example), trimmed to the
# kinds used in this repo. Standard collectors above stay enabled, so
# --custom-resource-state-only is deliberately NOT set.
customResourceState:
  enabled: true
  config:
    spec:
      resources:
        - groupVersionKind:
            group: kustomize.toolkit.fluxcd.io
            version: v1
            kind: Kustomization
          metricNamePrefix: gotk
          metrics:
            - name: "resource_info"
              help: "The current state of a Flux Kustomization resource."
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
              labelsFromPath:
                exported_namespace: [metadata, namespace]
                ready: [status, conditions, "[type=Ready]", status]
                suspended: [spec, suspend]
                revision: [status, lastAppliedRevision]
                source_name: [spec, sourceRef, name]
        - groupVersionKind:
            group: helm.toolkit.fluxcd.io
            version: v2
            kind: HelmRelease
          metricNamePrefix: gotk
          metrics:
            - name: "resource_info"
              help: "The current state of a Flux HelmRelease resource."
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
              labelsFromPath:
                exported_namespace: [metadata, namespace]
                ready: [status, conditions, "[type=Ready]", status]
                suspended: [spec, suspend]
                revision: [status, history, "0", chartVersion]
                chart_name: [status, history, "0", chartName]
        - groupVersionKind:
            group: source.toolkit.fluxcd.io
            version: v1
            kind: GitRepository
          metricNamePrefix: gotk
          metrics:
            - name: "resource_info"
              help: "The current state of a Flux GitRepository resource."
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
              labelsFromPath:
                exported_namespace: [metadata, namespace]
                ready: [status, conditions, "[type=Ready]", status]
                suspended: [spec, suspend]
                revision: [status, artifact, revision]
                url: [spec, url]
        - groupVersionKind:
            group: source.toolkit.fluxcd.io
            version: v1
            kind: OCIRepository
          metricNamePrefix: gotk
          metrics:
            - name: "resource_info"
              help: "The current state of a Flux OCIRepository resource."
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
              labelsFromPath:
                exported_namespace: [metadata, namespace]
                ready: [status, conditions, "[type=Ready]", status]
                suspended: [spec, suspend]
                revision: [status, artifact, revision]
                url: [spec, url]
        - groupVersionKind:
            group: source.toolkit.fluxcd.io
            version: v1
            kind: HelmRepository
          metricNamePrefix: gotk
          metrics:
            - name: "resource_info"
              help: "The current state of a Flux HelmRepository resource."
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
              labelsFromPath:
                exported_namespace: [metadata, namespace]
                ready: [status, conditions, "[type=Ready]", status]
                suspended: [spec, suspend]
                revision: [status, artifact, revision]
                url: [spec, url]
        - groupVersionKind:
            group: source.toolkit.fluxcd.io
            version: v1
            kind: HelmChart
          metricNamePrefix: gotk
          metrics:
            - name: "resource_info"
              help: "The current state of a Flux HelmChart resource."
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
              labelsFromPath:
                exported_namespace: [metadata, namespace]
                ready: [status, conditions, "[type=Ready]", status]
                suspended: [spec, suspend]
                revision: [status, artifact, revision]
                chart_name: [spec, chart]
