# Basic-auth credentials for the telemetry push to the Tooling Cluster's
# obs-ingest front (the account declared for this hub under
# observability.ingest_users there). Substituted from cluster-secrets;
# consumed by Alloy via env vars (alloy.extraEnv + sys.env in the river
# config) — never inlined into the alloy-values ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: obs-push-credentials
  namespace: t7y-agents
type: Opaque
stringData:
  username: "${OBS_INGEST_USERNAME}"
  password: "${OBS_INGEST_PASSWORD}"
