apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  releaseName: alloy
  targetNamespace: observability
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: alloy-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: observability-alloy-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: observability-alloy-values-override
      valuesKey: values.yaml
      optional: true
