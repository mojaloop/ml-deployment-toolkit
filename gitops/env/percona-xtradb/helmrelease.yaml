apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: percona
  namespace: flux-system
spec:
  interval: 24h
  url: https://percona.github.io/percona-helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pxc-operator
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: pxc-operator
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: percona
      interval: 12h
  targetNamespace: env-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: pxc-operator-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: pxc-operator-values-override
      valuesKey: values.yaml
      optional: true
