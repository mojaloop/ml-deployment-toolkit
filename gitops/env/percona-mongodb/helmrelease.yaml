apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: percona-mongodb
  namespace: flux-system
spec:
  interval: 24h
  url: https://percona.github.io/percona-helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: psmdb-operator
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: psmdb-operator
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: percona-mongodb
      interval: 12h
  targetNamespace: env-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: psmdb-operator-values-override
      valuesKey: values.yaml
      optional: true
  values:
    watchNamespace: "data"
