# ============================================================================
# SUPERSEDED but still deployed, as of 2026-07-30. Retire once (2) below is done.
#
# The native OTel path now does end-to-end cross-service tracing, verified:
# a single trace of 24 spans across TWO services, joined over Kafka via the
# traceparent header —
#   moja-quoting-service          SPAN_KIND_PRODUCER  SEND:topic-quotes-post
#   moja-quoting-service-handler  SPAN_KIND_CONSUMER  RECEIVE:topic-quotes-post
# (OpenTelemetry Operator injects an SDK into annotated pods, activating the
# instrumentation already in @mojaloop/central-services-stream — see
# observability/instrumentation.yaml.)
#
# WHY IT IS STILL HERE: only one reason now — Event-SDK spans carry
# business-level names (e.g. qs_quote_handleQuoteRequest) that existing Tempo
# queries and Grafana dashboards are keyed on. The OTel path names spans by
# infrastructure operation (SEND:/RECEIVE:, hapi routes, SQL) instead, so those
# saved queries and panels break the moment this is switched off.
#
# RETIREMENT PRECONDITIONS:
#   1. DONE — cross-service trace joining demonstrated (see above)
#   2. TODO — migrate dashboards/queries off Event-SDK business span names
#   3. Then: set EVENT_SDKrc TRACE: off in mojaloop/mojaloop-values.yaml
#      (recovers ~54 Kafka msg/s at 2 TPS)
#   4. Then: delete this file + tools/trace-bridge/ + the ghcr package
#
# NOTE for whoever touches Alloy: tail_sampling decision_wait is LOAD-BEARING at
# 30s. At the 5s default the sampling decision flushed before the consumer's
# RECEIVE span arrived, truncating every trace at the Kafka produce — which
# looks exactly like consumer instrumentation being broken.
# ============================================================================
#
# moja-trace-bridge: Event-SDK trace events (Kafka topic-event-trace) → Tempo OTLP.
# Source: tools/trace-bridge/ in this repo.
# Produces traces only when Mojaloop services run with EVENT_SDK TRACE: kafka
# (gitops/env-app/mojaloop/helmrelease.yaml eventSdkConfig) — idle otherwise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-bridge
  namespace: mojaloop
  labels:
    app.kubernetes.io/name: trace-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-bridge
    spec:
      containers:
        - name: trace-bridge
          image: ghcr.io/kiswend/moja-trace-bridge:0.1.1
          env:
            - name: KAFKA_BROKERS
              value: "${kafka_host}:${kafka_port}"
            - name: TRACE_TOPIC
              value: topic-event-trace
            - name: OTLP_URL
              value: "${tempo_url}"
            - name: TLS_SKIP
              value: "true"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
