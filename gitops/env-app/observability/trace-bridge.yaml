# ============================================================================
# STILL THE PRIMARY END-TO-END TRACING PATH as of 2026-07-30. Do not remove.
#
# A native OTel path now runs IN PARALLEL (OpenTelemetry Operator injects an SDK
# into annotated pods, activating the instrumentation already present in
# @mojaloop/central-services-stream — see observability/instrumentation.yaml).
# It is NOT yet a replacement.
#
# WHY NOT: the OTel path currently produces PRODUCER spans only. A Tempo query
# for {span.messaging.operation.name="receive"} returns ZERO traces across all
# 12 annotated services — nothing emits consumer-side spans, so an OTel trace
# STOPS at the Kafka produce and never continues into the consuming service.
# The result is per-service trace islands, not end-to-end transfers.
# Cause appears upstream: producer tracing is automatic inside producer.js,
# whereas consumer tracing requires the application to call
# startConsumerTracingSpan() from central-services-stream's kafka/otel.js.
#
# This bridge does what the OTel path cannot yet: the Event SDK propagates trace
# context through the message body, so its spans form a connected cross-service
# trace — the view that identified the quote phase as ~half the latency budget.
# It also carries business-level span names (qs_quote_handleQuoteRequest) that
# existing Tempo queries and Grafana dashboards are keyed on.
#
# RETIREMENT PRECONDITIONS (none met yet):
#   1. Consumer-side spans emitted, and cross-topic trace joining demonstrated
#   2. Dashboards/queries migrated off Event-SDK business span names
#   3. Then: set EVENT_SDKrc TRACE: off in mojaloop/mojaloop-values.yaml
#      (recovers ~54 Kafka msg/s at 2 TPS)
#   4. Then: delete this file + tools/trace-bridge/ + the ghcr package
# ============================================================================
#
# moja-trace-bridge: Event-SDK trace events (Kafka topic-event-trace) → Tempo OTLP.
# Source: tools/trace-bridge/ in this repo.
# Produces traces only when Mojaloop services run with EVENT_SDK TRACE: kafka
# (gitops/env-app/mojaloop/helmrelease.yaml eventSdkConfig) — idle otherwise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-bridge
  namespace: mojaloop
  labels:
    app.kubernetes.io/name: trace-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-bridge
    spec:
      containers:
        - name: trace-bridge
          image: ghcr.io/kiswend/moja-trace-bridge:0.1.1
          env:
            - name: KAFKA_BROKERS
              value: "${kafka_host}:${kafka_port}"
            - name: TRACE_TOPIC
              value: topic-event-trace
            - name: OTLP_URL
              value: "${tempo_url}"
            - name: TLS_SKIP
              value: "true"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
