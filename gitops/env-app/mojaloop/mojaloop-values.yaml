# --- ML API Adapter ---
# Event SDK: produces audit events to Kafka for Finance Portal reporting
ml-api-adapter:
  ml-api-adapter-service:
    replicaCount: ${ml_adapter_service_replicas}
    config:
      api_type: ${api_type}
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig
  ml-api-adapter-handler-notification:
    replicaCount: ${ml_adapter_handler_notification_replicas}
    commonAnnotations: *switchJwsReloader
    config:
      api_type: ${api_type}
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      endpointSecurity:
        jwsSigningKeySecret: *switchJwsSigningKey
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig

# --- Bulk ---
mojaloop-bulk:
  enabled: true
  config:
    mongo_host: "${mongodb_host}"
    mongo_port: ${mongodb_port}
    mongo_database: mlos
    mongo_user: mlos
    mongo_password: "${mongodb_app_password}"
  bulk-api-adapter:
    bulk-api-adapter-service:
      config: &bulkApiConfig
        kafka_host: "${kafka_host}"
        kafka_port: ${kafka_port}
        mongo_host: "${mongodb_host}"
        mongo_port: ${mongodb_port}
        mongo_user: mlos
        mongo_password: "${mongodb_app_password}"
        mongo_secret:
          name: bulk-mongodb-app-secrets
          key: MONGODB_APP_PASSWORD
        mongo_database: mlos
        # Nested mongodb config for the TLS init container (waitForMongodbTlsInitContainer).
        # The umbrella chart overrides initContainers for bulk-api-adapter services
        # to use the TLS variant, which reads config.mongodb.* instead of config.mongo_*.
        mongodb:
          host: "${mongodb_host}"
          port: "${mongodb_port}"
          user: mlos
          password: "${mongodb_app_password}"
          secret:
            name: bulk-mongodb-app-secrets
            key: MONGODB_APP_PASSWORD
          database: mlos
          ssl:
            enabled: false
            verify: false
            caSecret: {}
            clientCert: {}
        central_services_host: "moja-centralledger-service"
        central_services_port: 80
    bulk-api-adapter-handler-notification:
      config: *bulkApiConfig
  bulk-centralledger:
    cl-handler-bulk-transfer-prepare:
      config: &bulkClConfig
        kafka_host: "${kafka_host}"
        kafka_port: ${kafka_port}
        mongo_host: "${mongodb_host}"
        mongo_port: ${mongodb_port}
        mongo_user: mlos
        mongo_password: "${mongodb_app_password}"
        mongo_secret:
          name: bulk-mongodb-app-secrets
          key: MONGODB_APP_PASSWORD
        mongo_database: mlos
        db_host: "${mysql_host}"
        db_port: ${mysql_port}
        db_user: central_ledger
        db_password: "${mysql_central_ledger_password}"
        db_database: central_ledger
    cl-handler-bulk-transfer-fulfil:
      config: *bulkClConfig
    cl-handler-bulk-transfer-processing:
      config: *bulkClConfig
    cl-handler-bulk-transfer-get:
      config: *bulkClConfig

# --- TTK (Testing Toolkit) ---
ml-testing-toolkit:
  enabled: true
  config:
    mongodb:
      host: "${mongodb_host}"
      port: "${mongodb_port}"
      user: ttk
      password: "${mongodb_app_password}"
      database: ttk
      secret: null
      connectionString: null
      connectionStringSecret:
        name: null
        key: null
      params: {}
      ssl:
        enabled: false
        verify: false
        caSecret: {}
        clientCert: {}
  ml-testing-toolkit-backend:
    initContainers: |
      - name: wait-for-mongodb
        image: bitnamilegacy/mongodb:6.0.1
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - |
            MONGO_TLS_ARGS="";
            if [ "$DB_SSL_ENABLED" = "true" ]; then
              MONGO_TLS_ARGS="--tls=true";
              if [ "$DB_SSL_VERIFY" = "false" ]; then
                MONGO_TLS_ARGS="$MONGO_TLS_ARGS --tlsAllowInvalidHostnames=true";
              fi;
              if [ -n "$DB_SSL_CA" ]; then
                echo "$DB_SSL_CA" > /tmp/ca.pem
                MONGO_TLS_ARGS="$MONGO_TLS_ARGS --tlsCAFile /tmp/ca.pem"
              fi
              if [ -n "$DB_SSL_CLIENT_CERT" ]; then
                echo "$DB_SSL_CLIENT_CERT" > /tmp/client-cert.pem
                MONGO_TLS_ARGS="$MONGO_TLS_ARGS --tlsCertificateKeyFile /tmp/client-cert.pem"
              fi
            fi;
            PARAMS="";
            if [ -n "$DB_PARAMS" ]; then
              PARAMS=$(echo "$DB_PARAMS" | jq -r 'to_entries | map("\(.key)=\(.value|tostring)") | join("&")');
              PARAMS="?$PARAMS";
            fi;
            until mongosh "mongodb://$DB_HOST:$DB_PORT/$DB_DATABASE$PARAMS" --authenticationDatabase "$DB_DATABASE" --username "$DB_USER" --password "$DB_PASS" $MONGO_TLS_ARGS --eval "disableTelemetry();db.adminCommand('ping')" ;
            do
              echo --------------------;
              echo Waiting for MongoDB...;
              sleep 2;
            done;
            echo ====================;
            echo MongoDB ok!;
        env:
          - name: DB_HOST
            value: '{{ .Values.config.mongodb.host }}'
          - name: DB_PORT
            value: '{{ .Values.config.mongodb.port }}'
          - name: DB_USER
            value: '{{ .Values.config.mongodb.user }}'
          - name: DB_PASS
          {{- if .Values.config.mongodb.secret }}
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.config.mongodb.secret.name }}'
                key: '{{ .Values.config.mongodb.secret.key }}'
          {{- else }}
            value: {{ .Values.config.mongodb.password }}
          {{- end }}
          - name: DB_DATABASE
            value: '{{ .Values.config.mongodb.database }}'
          - name: DB_SSL_ENABLED
            value: '{{ .Values.config.mongodb.ssl.enabled }}'
          - name: DB_SSL_VERIFY
            value: '{{ .Values.config.mongodb.ssl.verify }}'
          {{- if .Values.config.mongodb.ssl.caSecret.name }}
          - name: DB_SSL_CA
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.config.mongodb.ssl.caSecret.name }}'
                key: '{{ .Values.config.mongodb.ssl.caSecret.key }}'
          {{- end }}
          {{- if .Values.config.mongodb.ssl.clientCert.name }}
          - name: DB_SSL_CLIENT_CERT
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.config.mongodb.ssl.clientCert.name }}'
                key: '{{ .Values.config.mongodb.ssl.clientCert.key }}'
          {{- end }}
          {{- if .Values.config.mongodb.params }}
          - name: DB_PARAMS
            value: {{ .Values.config.mongodb.params | toJson | quote }}
          {{- end }}
    config:
      mongodb:
        host: "${mongodb_host}"
        port: "${mongodb_port}"
        user: ttk
        password: "${mongodb_app_password}"
        database: ttk
        secret:
          name: bulk-mongodb-app-secrets
          key: MONGODB_APP_PASSWORD
        connectionString: null
        connectionStringSecret:
          name: null
          key: null
        params: {}
        ssl:
          enabled: false
          verify: false
          caSecret: {}
          clientCert: {}

  ml-testing-toolkit-frontend:
    config:
      API_BASE_URL: https://ttk-backend.int.${domain}

  ml-testing-toolkit-cli:
    enabled: false

# --- Simulators ---
simulator:
  enabled: false

# --- Third Party (deferred) ---
thirdparty:
  enabled: false

# --- Mojaloop Simulator ---
mojaloop-simulator:
