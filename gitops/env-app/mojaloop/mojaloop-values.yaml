# Distribution values for the mojaloop HelmRelease.
# Adopter overrides go in environments/<env>/values/mojaloop.yaml,
# which is merged after this file and therefore wins.
global:
  kafka:
    host: "${kafka_host}"
    port: ${kafka_port}

# --- Central Ledger ---
# Event SDK (configOverride.EVENT_SDKrc) enables audit event production to
# Kafka topic-event-audit. The reporting-events-processor-svc consumes these
# events and writes them to MongoDB, which the Finance Portal Transfers UI
# queries. Without this config, no audit events are produced and the
# Transfers page shows empty results.
centralledger:
  centralledger-service:
    replicaCount: ${cl_service_replicas}
    config:
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
    init:
      enabled: true
    configOverride:
      .EVENT_SDKrc: &eventSdkConfig
        AUDIT: kafka
        KAFKA:
          PRODUCER:
            EVENT:
              AUDIT:
                config:
                  options:
                    messageCharset: utf8
                    sync: true
                  rdkafkaConf:
                    client.id: producer-event-audit
                    compression.type: lz4
                    dr_cb: false
                    event_cb: true
                    metadata.broker.list: "${kafka_host}:${kafka_port}"
                    queue.buffering.max.messages: 10000000
                    socket.keepalive.enable: true
                  topicConf:
                    partitioner: murmur2_random
                    request.required.acks: all
              LOG:
                config:
                  options:
                    messageCharset: utf8
                    sync: true
                  rdkafkaConf:
                    client.id: producer-event-log
                    compression.type: lz4
                    dr_cb: false
                    event_cb: true
                    metadata.broker.list: "${kafka_host}:${kafka_port}"
                    queue.buffering.max.messages: 10000000
                    socket.keepalive.enable: true
                  topicConf:
                    partitioner: murmur2_random
                    request.required.acks: all
              TRACE:
                config:
                  options:
                    messageCharset: utf8
                    # async: ~27 spans/transfer; a sync acked produce per
                    # span measurably inflated latency (observer effect,
                    # see perf/RESULTS.md soak-traced). Span loss on crash
                    # is acceptable for perf tracing.
                    sync: false
                  rdkafkaConf:
                    client.id: producer-event-trace
                    compression.type: lz4
                    dr_cb: false
                    event_cb: true
                    metadata.broker.list: "${kafka_host}:${kafka_port}"
                    queue.buffering.max.messages: 10000000
                    socket.keepalive.enable: true
                  topicConf:
                    partitioner: murmur2_random
                    request.required.acks: "1"
        LOG: 'off'
        # TRACE: kafka → spans flow to topic-event-trace, converted to
        # OTLP/Tempo by trace-bridge (tools/trace-bridge). Toggleable per
        # perf campaign; producer config for TRACE is defined above.
        TRACE: kafka
  centralledger-handler-transfer-prepare:
    replicaCount: ${cl_handler_prepare_replicas}
    config:
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig
  centralledger-handler-transfer-position:
    config:
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig
  centralledger-handler-transfer-position-batch:
    replicaCount: ${cl_handler_position_batch_replicas}
    config:
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig
  centralledger-handler-transfer-get:
    replicaCount: ${cl_handler_get_replicas}
    metrics:
      enabled: true
    config:
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig
  centralledger-handler-transfer-fulfil:
    replicaCount: ${cl_handler_fulfil_replicas}
    config:
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig
  centralledger-handler-timeout:
    replicaCount: ${cl_handler_timeout_replicas}
    metrics:
      enabled: true
    config:
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig
  centralledger-handler-admin-transfer:
    replicaCount: ${cl_handler_admin_replicas}
    metrics:
      enabled: true
    config:
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig

# --- Quoting Service (shares central_ledger DB) ---
# Event SDK: produces audit events to Kafka for Finance Portal reporting
quoting-service:
  quoting-service:
    replicaCount: ${qs_service_replicas}
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3002"
    metrics:
      enabled: true
    config:
      api_type: ${api_type}
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
      simple_routing_mode_enabled: false
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig
  quoting-service-handler:
    replicaCount: ${qs_handler_replicas}
    commonAnnotations: &switchJwsReloader
      secret.reloader.stakater.com/reload: switch-jws
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3003"
    metrics:
      enabled: true
    config:
      kafka_host: "${kafka_host}"
      kafka_port: ${kafka_port}
      db_host: "${mysql_host}"
      db_port: ${mysql_port}
      db_user: central_ledger
      db_password: "${mysql_central_ledger_password}"
      db_database: central_ledger
      # Must be false so the handler persists quotes to MySQL.
      # Without this, the aggregator's INNER JOIN on the quote table
      # returns zero rows, and the Finance Portal Transfers UI is empty.
      simple_routing_mode_enabled: false
      # Shared Hub JWS signing key (see gitops/env-app/mojaloop/switch-jws-cert.yaml).
      # All switch signing services use the same keypair so DFSPs validate with one pub key.
      endpointSecurity:
        jwsSigningKeySecret: &switchJwsSigningKey
          name: switch-jws
          key: tls.key
    configOverride:
      .EVENT_SDKrc: *eventSdkConfig

