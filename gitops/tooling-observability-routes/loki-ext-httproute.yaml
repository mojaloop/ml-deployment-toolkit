# Authenticated log ingest on the external gateway — the additive half of the
# obs-ingest migration. Push path only, through the obs-ingest basic-auth
# front; read APIs have no external route. The open gw-int route
# (loki-httproute.yaml) stays until every client pushes here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki-ext
  namespace: observability
spec:
  parentRefs:
    - name: gw-ext
      namespace: platform-system
  hostnames:
    - "loki.ext.${DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /loki/api/v1/push
      backendRefs:
        - name: obs-ingest
          port: 8080
