# Authenticated log ingest on the external gateway. Push path only, through
# the obs-ingest basic-auth front; read APIs have no external route (grafana
# queries loki-gateway in-cluster).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki-ext
  namespace: t7y-backend
spec:
  parentRefs:
    - name: gw-ext
      namespace: platform-system
  hostnames:
    - "loki.ext.${DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /loki/api/v1/push
      backendRefs:
        - name: obs-ingest
          port: 8080
