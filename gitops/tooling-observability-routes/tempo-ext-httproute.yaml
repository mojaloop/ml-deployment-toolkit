# Authenticated trace ingest on the external gateway. OTLP/HTTP push only,
# through the obs-ingest basic-auth front; the query API (:3200) has no
# external route (grafana queries tempo in-cluster).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo-ext
  namespace: t7y-backend
spec:
  parentRefs:
    - name: gw-ext
      namespace: platform-system
  hostnames:
    - "tempo.ext.${DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/traces
      backendRefs:
        - name: obs-ingest
          port: 8080
