# Authenticated trace ingest on the external gateway — the additive half of
# the obs-ingest migration. OTLP/HTTP push only, through the obs-ingest
# basic-auth front; the query API (:3200) has no external route. The open
# gw-int route (tempo-httproute.yaml) stays until every client pushes here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo-ext
  namespace: observability
spec:
  parentRefs:
    - name: gw-ext
      namespace: platform-system
  hostnames:
    - "tempo.ext.${DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/traces
      backendRefs:
        - name: obs-ingest
          port: 8080
