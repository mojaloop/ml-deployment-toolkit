# Authenticated metric ingest on the external gateway. Only the push paths
# are routed, through the obs-ingest basic-auth front; the query API has no
# external route (grafana queries thanos-query in-cluster).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thanos-ext
  namespace: observability
spec:
  parentRefs:
    - name: gw-ext
      namespace: platform-system
  hostnames:
    - "thanos.ext.${DOMAIN}"
  rules:
    # Remote write (Alloy, k6) and OTLP/HTTP push (host metric pushers)
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/receive
        - path:
            type: PathPrefix
            value: /api/v1/otlp
      backendRefs:
        - name: obs-ingest
          port: 8080
