# Distribution values for the strimzi-kafka-operator HelmRelease.
# Adopter overrides go in environments/<env>/values/strimzi-kafka-operator.yaml,
# which is merged after this file and therefore wins.
watchNamespaces:
  - data
# Pod annotations for Alloy metrics scraping
annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
