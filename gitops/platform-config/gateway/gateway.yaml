apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-int
  namespace: platform-system
  annotations:
    cert-manager.io/cluster-issuer: acme-prod
    # What external-dns publishes for every attached route: the wan side of the
    # border DNAT when cluster.lb_ipam.pools.gw-int.wan is set, the lan IP otherwise.
    external-dns.alpha.kubernetes.io/target: "${gw_int_dns_target}"
spec:
  gatewayClassName: ${gateway_class_name}
  # Propagated to the generated LoadBalancer Service; the gw-int
  # CiliumLoadBalancerIPPool selects on it.
  infrastructure:
    labels:
      lb-pool: gw-int
  listeners:
    - name: https
      hostname: "*.int.${domain}"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-int-tls
      allowedRoutes:
        namespaces:
          from: All
