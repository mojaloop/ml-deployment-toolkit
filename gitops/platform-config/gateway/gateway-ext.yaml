# External Gateway for DFSP-facing services (MCM, Keycloak)
# SIMPLE TLS termination — mTLS for FSPIOP APIs is handled by CiliumEnvoyConfig
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-ext
  namespace: platform-system
  annotations:
    cert-manager.io/cluster-issuer: acme-prod
    # What external-dns publishes for every attached route: the wan side of the
    # border DNAT when cluster.lb_ipam.pools.gw-ext.wan is set, the lan IP otherwise.
    external-dns.alpha.kubernetes.io/target: "${GW_EXT_DNS_TARGET}"
spec:
  gatewayClassName: ${P_GATEWAY_CLASS}
  # Propagated to the generated LoadBalancer Service; the gw-ext
  # CiliumLoadBalancerIPPool selects on it. The NLB annotation is consumed
  # only where a cloud controller provisions the Service (AWS — Classic ELB
  # otherwise); inert on-prem, where LB-IPAM assigns the address.
  infrastructure:
    labels:
      lb-pool: gw-ext
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  listeners:
    - name: https
      hostname: "*.ext.${DOMAIN}"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-ext-tls
      allowedRoutes:
        namespaces:
          from: All
