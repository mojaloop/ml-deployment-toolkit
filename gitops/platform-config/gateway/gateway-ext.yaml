# External Gateway for DFSP-facing services (MCM, Keycloak)
# SIMPLE TLS termination — mTLS for FSPIOP APIs is handled by CiliumEnvoyConfig
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-ext
  namespace: platform-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # What external-dns publishes for every attached route: the wan side of the
    # border DNAT when cluster.lb_ipam.pools.gw-ext.wan is set, the lan IP otherwise.
    external-dns.alpha.kubernetes.io/target: "${gw_ext_dns_target}"
spec:
  gatewayClassName: ${gateway_class_name}
  # Propagated to the generated LoadBalancer Service; the gw-ext
  # CiliumLoadBalancerIPPool selects on it.
  infrastructure:
    labels:
      lb-pool: gw-ext
  listeners:
    - name: https
      hostname: "*.ext.${domain}"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-ext-tls
      allowedRoutes:
        namespaces:
          from: All
