apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "goldilocks.int.${domain}"
  rules:
    - backendRefs:
        - name: goldilocks-goldilocks-dashboard
          port: 80
