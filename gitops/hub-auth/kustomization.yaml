apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vault/vault.yaml
  - vault/vault-backup.yaml
  - vault/backup-s3-credentials.yaml
  - vault/secretstore.yaml
  - vault/vault-pki-issuer.yaml
  - ory/kratos-email-templates.yaml
  - ory/externalsecret-kratos.yaml
  - ory/externalsecret-keto.yaml
  - ory/externalsecret-hydra.yaml
  - ory/helmrelease-kratos.yaml
  - ory/helmrelease-oathkeeper.yaml
  - ory/helmrelease-keto.yaml
  - ory/keto-opl.yaml
  - ory/helmrelease-hydra.yaml
  - ory/keto-metrics-service.yaml
  - ory/helmrelease-selfservice-ui.yaml
  - ory/helmrelease-bof.yaml
  - routes/auth-httproute.yaml
  - routes/vault-httproute.yaml
  - routes/mcm-httproute.yaml
  - routes/finance-portal-httproute.yaml
  - routes/referenceGrants.yaml

# Distribution values for each HelmRelease in this kustomization.
# Rendered into ConfigMaps that the HelmRelease references first in valuesFrom;
# the adopter's <release>-values-override is merged after them and wins.
configMapGenerator:
  - name: bof-values
    namespace: flux-system
    files:
      - values.yaml=ory/bof-values.yaml
  - name: hydra-values
    namespace: flux-system
    files:
      - values.yaml=ory/hydra-values.yaml
  - name: keto-values
    namespace: flux-system
    files:
      - values.yaml=ory/keto-values.yaml
  - name: kratos-values
    namespace: flux-system
    files:
      - values.yaml=ory/kratos-values.yaml
  - name: kratos-selfservice-ui-values
    namespace: flux-system
    files:
      - values.yaml=ory/kratos-selfservice-ui-values.yaml
  - name: oathkeeper-values
    namespace: flux-system
    files:
      - values.yaml=ory/oathkeeper-values.yaml
generatorOptions:
  disableNameSuffixHash: true
