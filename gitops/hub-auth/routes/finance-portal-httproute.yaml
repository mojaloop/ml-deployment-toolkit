# Finance-portal routing — replicates sw002 Istio VirtualService pattern.
# Shell, UIs, and Kratos proxy go directly to backend services.
# API routes go through Oathkeeper proxy for auth enforcement.
#
# The route lives in finance-portal, beside the workloads it fronts, exactly as the MCM
# route lives in mcm. UI and shell backendRefs are therefore local and need no grant; the
# refs that now cross a namespace boundary point INTO ory (kratos-public, oathkeeper-proxy)
# and are covered by allow-finance-portal-httproute-ref there. Attaching to gw-int across
# namespaces needs no grant — that listener is allowedRoutes.namespaces.from: All.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: finance-portal
  namespace: finance-portal
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "finance-portal.int.${domain}"
  rules:
    # --- Kratos proxy (no auth) ---
    # Logout browser flow
    - matches:
        - path:
            type: PathPrefix
            value: /kratos/self-service/logout/browser
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /self-service/logout/browser
      backendRefs:
        - name: kratos-public
          namespace: ory
          port: 80
    # Sessions whoami
    - matches:
        - path:
            type: PathPrefix
            value: /kratos/sessions/whoami
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /sessions/whoami
      backendRefs:
        - name: kratos-public
          namespace: ory
          port: 80

    # --- API routes through Oathkeeper (auth required) ---
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
    - matches:
        - path:
            type: PathPrefix
            value: /central-admin/
      backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
    - matches:
        - path:
            type: PathPrefix
            value: /settlementWindows
      backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
    - matches:
        - path:
            type: PathPrefix
            value: /settlements
      backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
    - matches:
        - path:
            type: PathPrefix
            value: /users
      backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
    - matches:
        - path:
            type: PathPrefix
            value: /participants
      backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
    - matches:
        - path:
            type: PathPrefix
            value: /roles
      backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455

    # --- UI micro-frontends (direct, no auth, strip prefix) ---
    - matches:
        - path:
            type: PathPrefix
            value: /uis/iam
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: fin-portal-reporting-hub-bop-role-ui
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /uis/transfers
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: fin-portal-reporting-hub-bop-trx-ui
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /uis/settlements
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: fin-portal-reporting-hub-bop-settlements-ui
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /uis/positions
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: fin-portal-reporting-hub-bop-positions-ui
          port: 80

    # --- Shell catch-all (direct, no auth) ---
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: "default-src 'self'; form-action 'self' https://auth.int.${domain}/kratos/ https://keycloak.int.${domain}/realms/hub-operators/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://auth.int.${domain}; img-src 'self' data: https://mojaloop.io"
      backendRefs:
        - name: fin-portal-reporting-hub-bop-shell
          port: 80
