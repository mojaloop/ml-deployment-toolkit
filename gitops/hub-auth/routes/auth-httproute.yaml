# Auth routes — matches sw002 pattern:
#   /kratos/* → Kratos public API (prefix stripped)
#   /ui/*     → Self-service UI (prefix stripped)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: ory
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "auth.int.${domain}"
  rules:
    # Kratos public API — strip /kratos prefix
    - matches:
        - path:
            type: PathPrefix
            value: /kratos
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: kratos-public
          port: 80
    # Self-service UI — strip /ui prefix
    - matches:
        - path:
            type: PathPrefix
            value: /ui
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: kratos-ui
          port: 80
