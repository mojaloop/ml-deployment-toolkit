# ClusterSecretStore: lets External Secrets Operator (ESO) read from Vault.
# WHY version v1: the secret/ mount uses KV-v1 (see vault.yaml for rationale).
# ESO uses this version to know how to parse Vault's response:
#   v1 → data is flat at .data.property
#   v2 → data is nested at .data.data.property
# ExternalSecret keys use KV-v1 paths: "secret/X" (not "secret/data/X").
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "http://vault.vault:8200"
      path: "secret"
      version: "v1"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets-external-secrets"
            namespace: "external-secrets"
