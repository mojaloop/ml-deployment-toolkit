apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mojaloop-charts
  namespace: flux-system
spec:
  interval: 24h
  url: https://mojaloop.github.io/charts/repo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bof
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: bof
      version: "5.1.6"
      sourceRef:
        kind: HelmRepository
        name: mojaloop-charts
      interval: 12h
  targetNamespace: ory
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: bof-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: ory-bof-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: ory-bof-values-override
      valuesKey: values.yaml
      optional: true
