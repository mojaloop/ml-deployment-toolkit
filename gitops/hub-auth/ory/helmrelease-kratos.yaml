apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ory
  namespace: flux-system
spec:
  interval: 24h
  url: https://k8s.ory.sh/helm/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kratos
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kratos
      version: "0.62.1"
      sourceRef:
        kind: HelmRepository
        name: ory
      interval: 12h
  targetNamespace: ory
  timeout: 15m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: kratos-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: ory-kratos-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: ory-kratos-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: ory-kratos-values-override
      valuesKey: values.yaml
      optional: true
