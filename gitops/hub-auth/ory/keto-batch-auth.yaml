# Keto batch authorization proxy — provides batch /relation-tuples/batch/check
# for authorization checks that Keto's standard API doesn't directly support.
# Replicated from sw002 reference implementation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keto-batch-auth
  namespace: ory
data:
  server.js: |
    #!/usr/bin/env node

    import { createServer } from 'node:http';
    import { URL } from 'node:url';

    const KETO_READ_URL = process.env.KETO_READ_URL || 'http://keto-read.ory.svc.cluster.local';
    const PORT = process.env.PORT || 3000;

    const server = createServer(async (req, res) => {
        if (req.url === '/health') {
            res.writeHead(200, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ status: 'ok' }));
            return;
        }

        if (req.method !== 'POST') {
            res.writeHead(405, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ error: 'Method not allowed' }));
            return;
        }

        try {
            const chunks = [];
            for await (const chunk of req) {
                chunks.push(chunk);
            }
            const body = Buffer.concat(chunks).toString();
            const requestData = JSON.parse(body);

            const ketoResponse = await fetch(`$${KETO_READ_URL}/relation-tuples/batch/check`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestData),
            });

            const ketoData = await ketoResponse.json();
            const results = ketoData.results || [];
            const hasAllowed = results.some(result => result.allowed === true);

            if (hasAllowed) {
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ authorized: true, results }));
            } else {
                res.writeHead(403, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ authorized: false, results }));
            }

        } catch (error) {
            console.error('Proxy error:', error);
            res.writeHead(500, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ error: 'Internal server error' }));
        }
    });

    server.listen(PORT, () => {
        console.log(`Keto auth proxy listening on port $${PORT}`);
        console.log(`Proxying to: $${KETO_READ_URL}`);
    });

    process.on('SIGINT', () => {
        console.log('\nShutting down gracefully...');
        server.close(() => {
            process.exit(0);
        });
    });

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keto-batch-auth
  namespace: ory
  annotations:
    configmap.reloader.stakater.com/reload: keto-batch-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keto-batch-auth
  template:
    metadata:
      labels:
        app: keto-batch-auth
    spec:
      containers:
      - name: server
        image: node:24-alpine
        workingDir: /app
        command: ['node', 'server.js']
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: KETO_READ_URL
          value: "http://keto-read.ory.svc.cluster.local:80"
        volumeMounts:
        - name: app
          mountPath: /app
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: app
        configMap:
          name: keto-batch-auth

---
apiVersion: v1
kind: Service
metadata:
  name: keto-batch-auth
  namespace: ory
spec:
  selector:
    app: keto-batch-auth
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
