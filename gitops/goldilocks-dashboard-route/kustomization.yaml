apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The Goldilocks chart renders the dashboard route from the values a hub
# supplies in goldilocks-dashboard-route-values (gitops/hub-app). The chart's
# route takes no filters, so the IAM check is added to its rule after rendering.
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: goldilocks
      namespace: flux-system
    path: helmrelease-patch.yaml
