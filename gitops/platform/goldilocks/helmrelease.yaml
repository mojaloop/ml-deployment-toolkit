apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: flux-system
spec:
  dependsOn:
    - name: vpa
  interval: 30m
  chart:
    spec:
      chart: goldilocks
      version: "9.x"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
      interval: 12h
  targetNamespace: goldilocks
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: goldilocks-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: goldilocks-values-override
      valuesKey: values.yaml
      optional: true
