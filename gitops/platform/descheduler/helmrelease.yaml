apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: descheduler
      version: "0.36.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
      interval: 12h
  targetNamespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: descheduler-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: kube-system-descheduler-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: kube-system-descheduler-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: kube-system-descheduler-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: kube-system-descheduler-values-override
      valuesKey: values.yaml
      optional: true
