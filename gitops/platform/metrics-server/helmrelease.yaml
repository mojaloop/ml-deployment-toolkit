apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/metrics-server/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      version: "3.13.1"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      interval: 12h
  targetNamespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: metrics-server-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: kube-system-metrics-server-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: kube-system-metrics-server-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: kube-system-metrics-server-values-override
      valuesKey: values.yaml
      optional: true
