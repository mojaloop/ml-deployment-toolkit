apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - observability-namespace.yaml
  - external-dns-namespace.yaml
  - metrics-server/helmrelease.yaml
  # - descheduler/helmrelease.yaml  # disabled: 50/60 LowNodeUtilization policy caused steady-state eviction churn on ml-lab0-sw (evicted migration Jobs, vault, kafka, pxc) -- rework policy before re-enabling; see _/docs/operations/known-issues.md
  - cert-manager/helmrelease.yaml
  - external-dns/helmrelease.yaml
  - external-secrets/helmrelease.yaml
  - vpa/helmrelease.yaml
  - goldilocks/helmrelease.yaml
  - reloader/helmrelease.yaml
  - opentelemetry-operator/helmrelease.yaml

# Distribution values for each HelmRelease in this kustomization.
# Rendered into ConfigMaps that the HelmRelease references first in valuesFrom;
# the adopter's <release>-values-override is merged after them and wins.
configMapGenerator:
  # - name: descheduler-values  # disabled with descheduler/helmrelease.yaml above
  #   namespace: flux-system
  #   files:
  #     - values.yaml=values/kube-system/descheduler.yaml
  - name: cert-manager-values
    namespace: flux-system
    files:
      - values.yaml=values/cert-manager/cert-manager.yaml
  - name: external-dns-values
    namespace: flux-system
    files:
      - values.yaml=values/external-dns/external-dns.yaml
  - name: external-secrets-values
    namespace: flux-system
    files:
      - values.yaml=values/external-secrets/external-secrets.yaml
  - name: goldilocks-values
    namespace: flux-system
    files:
      - values.yaml=values/goldilocks/goldilocks.yaml
  - name: metrics-server-values
    namespace: flux-system
    files:
      - values.yaml=values/kube-system/metrics-server.yaml
  - name: reloader-values
    namespace: flux-system
    files:
      - values.yaml=values/platform-system/reloader.yaml
  - name: vpa-values
    namespace: flux-system
    files:
      - values.yaml=values/vpa/vpa.yaml
  - name: opentelemetry-operator-values
    namespace: flux-system
    files:
      - values.yaml=values/platform-system/opentelemetry-operator.yaml
generatorOptions:
  disableNameSuffixHash: true
