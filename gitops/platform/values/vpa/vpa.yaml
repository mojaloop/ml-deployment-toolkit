# Distribution values for the vpa HelmRelease.
# Adopter overrides go in environments/<env>/values/vpa.yaml,
# which is merged after this file and therefore wins.
recommender:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 256Mi
updater:
  enabled: false
admissionController:
  enabled: false
