# Distribution values for the goldilocks HelmRelease.
# Adopter overrides go in environments/<env>/values/goldilocks.yaml,
# which is merged after this file and therefore wins.
dashboard:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
controller:
  flags:
    on-by-default: "true"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
