apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds-stable
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.fairwinds.com/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vpa
      version: "4.12.4"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
      interval: 12h
  targetNamespace: vpa
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: vpa-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: vpa-vpa-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: vpa-vpa-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: vpa-vpa-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: vpa-vpa-values-override
      valuesKey: values.yaml
      optional: true
