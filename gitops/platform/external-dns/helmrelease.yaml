apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.20.0"  # 1.21+/v0.20 removed the in-tree digitalocean provider; needs webhook migration first
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 12h
  targetNamespace: external-dns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Provider-specific values (provider name, credential env vars) come from the
  # dns/{provider} kustomization — stays unready until that ConfigMap exists.
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: external-dns-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: external-dns-provider-values
    - kind: ConfigMap
      name: external-dns-external-dns-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: external-dns-external-dns-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: external-dns-external-dns-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: external-dns-external-dns-values-override
      valuesKey: values.yaml
      optional: true
