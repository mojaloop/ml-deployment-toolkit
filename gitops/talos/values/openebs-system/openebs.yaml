# Distribution values for the openebs HelmRelease.
# Adopter overrides go in environments/<env>/values/openebs.yaml,
# which is merged after this file and therefore wins.
# Only enable localpv hostpath provisioner.
# basePath sits on the dedicated XFS user volume Talos mounts at
# /var/mnt/openebs (patch-openebs.yaml) — never on the OS disk's EPHEMERAL.
localpv-provisioner:
  enabled: true
  localpv:
    basePath: /var/mnt/openebs/local
  hostpathClass:
    enabled: true
    isDefaultClass: true
    basePath: /var/mnt/openebs/local

# Disable all other engines and sub-charts
engines:
  local:
    lvm:
      enabled: false
    zfs:
      enabled: false
  replicated:
    mayastor:
      enabled: false
openebs-crds:
  csi:
    volumeSnapshots:
      enabled: false
loki:
  enabled: false
minio:
  enabled: false
alloy:
  enabled: false
