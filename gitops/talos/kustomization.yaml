apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - gateway-api/crds.yaml
  - cilium/helmrelease.yaml
  - lb-ipam/lb-ipam.yaml
  - openebs/helmrelease.yaml
  # hubble-httproute moved to hub-app/routes (hub-only): the tooling cluster
  # has no IAM to gate it behind — operators use kubectl port-forward there.

# Distribution values for each HelmRelease in this kustomization.
# Rendered into ConfigMaps that the HelmRelease references first in valuesFrom;
# the adopter's <release>-values-override is merged after them and wins.
configMapGenerator:
  - name: cilium-values
    namespace: flux-system
    files:
      - values.yaml=values/cilium/cilium.yaml
  - name: openebs-values
    namespace: flux-system
    files:
      - values.yaml=values/openebs-system/openebs.yaml
generatorOptions:
  disableNameSuffixHash: true
