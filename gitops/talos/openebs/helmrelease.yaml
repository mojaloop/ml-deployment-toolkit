apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs
  namespace: flux-system
spec:
  interval: 24h
  url: https://openebs.github.io/openebs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: openebs
      version: "4.5.1"
      sourceRef:
        kind: HelmRepository
        name: openebs
      interval: 12h
  targetNamespace: openebs-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: openebs-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: openebs-values-override
      valuesKey: values.yaml
      optional: true
