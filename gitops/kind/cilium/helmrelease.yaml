apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 12h
  targetNamespace: cilium
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: cilium-cilium-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: cilium-cilium-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: cilium-cilium-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: cilium-cilium-values-override
      valuesKey: values.yaml
      optional: true

