apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thanos
  namespace: observability
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "thanos.int.${domain}"
  rules:
    # Remote write from Alloy → Thanos Receive
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/receive
      backendRefs:
        - name: thanos-receive
          port: 19291
    # OTLP/HTTP push (e.g. Proxmox metric server) → Thanos Receive
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/otlp
      backendRefs:
        - name: thanos-receive
          port: 19291
    # All other requests (Grafana queries) → Thanos Query
    - backendRefs:
        - name: thanos-query
          port: 9090
