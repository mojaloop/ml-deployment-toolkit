# Default StorageClass — EBS CSI gp3. P_STORAGE_CLASS stays empty on this
# provider (workloads rely on the cluster default, same rule as Talos), so
# the default annotation here is what routes every PVC.
#
# EKS ships a legacy in-tree `gp2` class on some versions; its provisioner
# was removed from Kubernetes, so it cannot bind PVCs, and since 1.28 the
# most recently created default wins ties — this class, created after the
# cluster, is the effective default either way.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
