apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - gateway-api/crds.yaml
  - cilium/helmrelease.yaml
  - storageclass/gp3.yaml
  # No lb-ipam (cloud LBs address the gateways) and no openebs (EBS CSI is
  # installed as a managed addon by aws-bootstrap; gp3.yaml is its default
  # class) — the two on-prem gap fillers this vendor layer does not need.

# Distribution values for each HelmRelease in this kustomization.
# Rendered into ConfigMaps that the HelmRelease references first in valuesFrom;
# the adopter's <release>-values-override is merged after them and wins.
configMapGenerator:
  - name: cilium-values
    namespace: flux-system
    files:
      - values.yaml=values/cilium/cilium.yaml
generatorOptions:
  disableNameSuffixHash: true
