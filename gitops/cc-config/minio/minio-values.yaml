# Distribution values for the minio HelmRelease.
# Adopter overrides go in environments/<env>/values/minio.yaml,
# which is merged after this file and therefore wins.
mode: standalone
replicas: ${minio_replicas}
persistence:
  enabled: true
  size: ${minio_storage}
resources:
  requests:
    memory: 256Mi
# System buckets. When object_storage.buckets declares extra buckets, the
# deployer-rendered minio-buckets-values Secret replaces this list with the
# union (Helm merges lists by replacement) — keep the two in sync with
# minio_system_buckets in src/modules/flux-config/main.tf.
buckets:
  - name: harbor
    policy: none
  - name: backups
    policy: none
  - name: thanos
    policy: none
  - name: loki
    policy: none
  - name: tempo
    policy: none
consoleIngress:
  enabled: false
