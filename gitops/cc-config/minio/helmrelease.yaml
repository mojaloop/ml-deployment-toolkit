apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: minio
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.min.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: minio
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: minio
      interval: 12h
  releaseName: minio
  targetNamespace: minio
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: vault-operator
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: minio-values
      valuesKey: values.yaml
    - kind: Secret
      name: minio-credentials
      valuesKey: rootUser
      targetPath: rootUser
    - kind: Secret
      name: minio-credentials
      valuesKey: rootPassword
      targetPath: rootPassword
    - kind: ConfigMap
      name: minio-values-override
      valuesKey: values.yaml
      optional: true
