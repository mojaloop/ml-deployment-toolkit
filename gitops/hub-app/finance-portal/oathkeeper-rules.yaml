# API: IAM / role-assignment-service (strip /api/iam -> /)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: fp-api-iam
  namespace: ory
spec:
  match:
    url: <http|https>://finance-portal.int.${DOMAIN}/api/iam/<.*>
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
  authenticators:
    - handler: jwt
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    stripPath: /api/iam
    url: http://fin-portal-role-assignment-service.finance-portal.svc.cluster.local:80
