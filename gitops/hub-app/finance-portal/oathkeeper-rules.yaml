# Oathkeeper Rule CRDs for finance-portal API routes (auth required).
# Only API routes come through oathkeeper-proxy (via HTTPRoute).
# Shell, UIs, and Kratos are routed directly by the HTTPRoute.
#
# Auth: cookie_session + jwt for API endpoints.
# Authz: remote_json (Keto RBAC) — per-action permission checks.
# Permissions are provisioned via MojaloopRole CRDs in ory-rbac-role-permissions.yaml.
---
# API: transfers (reporting-hub-bop-api-svc)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: fp-transfer-api
  namespace: ory
spec:
  match:
    url: <http|https>://finance-portal.int.${DOMAIN}/api/transfers
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
  authenticators:
    - handler: jwt
    - handler: cookie_session
  authorizer:
    handler: remote_json
    config:
      remote: http://keto-read.ory.svc.cluster.local:80/relation-tuples/check
      payload: |
        {
          "namespace": "permission",
          "object": "transferApi",
          "relation": "granted",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://fin-portal-reporting-hub-bop-api-svc.finance-portal.svc.cluster.local:80
---
