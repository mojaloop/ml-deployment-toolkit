apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: finance-portal
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: finance-portal
      version: "5.1.4"
      sourceRef:
        kind: HelmRepository
        name: mojaloop-charts
      interval: 12h
  releaseName: fin-portal
  targetNamespace: mojaloop
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: finance-portal-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: finance-portal-values-override
      valuesKey: values.yaml
      optional: true
