apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: finance-portal
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: mojaloop/finance-portal
      sourceRef:
        kind: GitRepository
        name: mojaloop-charts-git
      interval: 12h
  releaseName: fin-portal
  # Dedicated namespace, as MCM has. releaseName is pinned above and must stay pinned:
  # without it helm-controller derives the release name from targetNamespace, so moving
  # namespaces would silently rename the release too. Changing targetNamespace on an
  # installed release does not move it — helm-controller uninstalls and reinstalls. That
  # is safe here because the chart carries no PVCs; all state is in MySQL, Mongo and Kafka.
  targetNamespace: finance-portal
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: finance-portal-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: finance-portal-finance-portal-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: finance-portal-finance-portal-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: finance-portal-finance-portal-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: finance-portal-finance-portal-values-override
      valuesKey: values.yaml
      optional: true
