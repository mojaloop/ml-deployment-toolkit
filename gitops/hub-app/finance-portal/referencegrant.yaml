# Allow HTTPRoutes in the finance-portal namespace to reference Services in ory.
# Required for the finance-portal HTTPRoute to route to kratos-public and oathkeeper-proxy.
#
# This is the mirror image of the pre-split grant, which lived in mojaloop and allowed
# ory -> mojaloop. Now that the route sits beside its own backends, the only cross-namespace
# backendRefs left point INTO ory, so the grant belongs there. Same shape as mcm/referencegrant.yaml.
#
# Note this grant is genuinely load-bearing, unlike the "to: Gateway" grants elsewhere in
# this repo: ReferenceGrant governs backendRefs. Route-to-Gateway attachment is governed by
# the listener's allowedRoutes (gw-int is `from: All`), which is why no grant is needed for that.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-finance-portal-httproute-ref
  namespace: ory
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: finance-portal
  to:
    - group: ""
      kind: Service
