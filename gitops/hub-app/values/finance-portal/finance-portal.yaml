# Distribution values for the finance-portal HelmRelease.
# Adopter overrides go in environments/<env>/values/finance-portal.yaml,
# which is merged after this file and therefore wins.
global:
  # FQDNs, not bare service names: this release runs in the finance-portal namespace and
  # these two services live in mojaloop. The chart interpolates these verbatim into
  # CENTRAL_ADMIN_URL on experience-api-svc, so a bare name resolves only in-namespace.
  adminApiSvc:
    host: moja-centralledger-service.mojaloop.svc.cluster.local
    port: 80
  settlementSvc:
    host: moja-centralsettlement-service.mojaloop.svc.cluster.local
    port: 80
  reportingDB:
    host: "${MYSQL_HOST}"
    port: ${MYSQL_PORT}
    user: central_ledger
    database: central_ledger
    secret:
      name: mysqldb
      key: mysql-password
  reportingEventsDB:
    host: "${MONGODB_HOST}"
    port: ${MONGODB_PORT}
    user: reporting
    database: reporting_events
    secret:
      name: reporting-events-db-secret
      key: mongodb-password

  # The shell renders its remote manifest from these portal blocks; hosts and
  # permissions match the service registry the iam release composes
  authz:
    - name: reporting-hub-bop-role-ui
      url:
        host: portal-iam.int.${DOMAIN}
      portal:
        path: /iam
        label: Roles
        scope: reporting_hub_bop_role_ui
    - name: reporting-hub-bop-trx-ui
      url:
        host: portal-transfers.int.${DOMAIN}
      portal:
        path: /transfers
        label: Transfers
        scope: reporting_hub_bop_trx_ui
    - name: reporting-hub-bop-settlements-ui
      url:
        host: portal-settlements.int.${DOMAIN}
      portal:
        path: /settlements
        label: Settlements
        scope: reporting_hub_bop_settlements_ui
    - name: reporting-hub-bop-positions-ui
      url:
        host: portal-positions.int.${DOMAIN}
      portal:
        path: /positions
        label: Financial Positions
        scope: reporting_hub_bop_positions_ui

role-assignment-service:
  enabled: true
  image:
    registry: docker.io
    repository: kirgene/role-assignment-service
    tag: iam-document-authz
  # Users come from Kratos, roles and assignments from Keto, and the authz
  # model from the IAM that composed it
  configFiles:
    default.json: {
        "PORT": 3008,
        "HOST": "0.0.0.0",
        "INSPECT": { "DEPTH": 4, "SHOW_HIDDEN": false, "COLOR": true },
        "ENDPOINT_CACHE_CONFIG": { "expiresIn": 180000, "generateTimeout": 30000 },
        "CENTRAL_SERVICE_ADMIN_URL": "http://moja-centralledger-service.mojaloop.svc.cluster.local",
        "ORY_KETO_READ_SERVICE_URL": "http://keto-read.ory.svc.cluster.local",
        "ORY_KETO_WRITE_SERVICE_URL": "http://keto-write.ory.svc.cluster.local",
        "ORY_KRATOS_ADMIN_SERVICE_URL": "http://kratos-admin.ory.svc.cluster.local",
        "IAM_SERVICE_URL": "http://iam-ml-iam-services-provisioning.ory.svc.cluster.local",
        "AUTHZ_MODELS_DIR": "http://iam-ml-iam-services-provisioning.ory.svc.cluster.local/keto-namespaces.ts",
        "SCOPE_SIZE_ALARM": 1000,
        "ERROR_HANDLING": { "includeCauseExtension": true, "truncateExtensions": true },
        "INSTRUMENTATION": {
          "METRICS": {
            "DISABLED": false,
            "labels": { "eventId": "*" },
            "config": {
              "timeout": 5000,
              "prefix": "moja_ra_api",
              "defaultLabels": { "serviceName": "role-assignment-service" }
            }
          }
        },
        "CORS_WHITELIST": ["https://portal.int.${DOMAIN}", "https://portal-iam.int.${DOMAIN}"],
        "ALLOW_CREDENTIALS": false
      }
  gateway:
    enabled: true
    host: iam-api.int.${DOMAIN}
    parentRefs:
      - name: gw-int
        namespace: platform-system
    oathkeeper:
      serviceNamespace: ory

