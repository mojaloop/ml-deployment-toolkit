# The ledger surface: proxies the switch's admin API
reporting-hub-bop-experience-api-svc:
  enabled: true
  image:
    registry: docker.io
    repository: kirgene/reporting-hub-bop-experience-api-svc
    tag: iam-document-authz
  configOverride:
    .EVENT_SDKrc:
      AUDIT: kafka
      KAFKA:
        PRODUCER:
          EVENT:
            AUDIT:
              config:
                options:
                  messageCharset: utf8
                  sync: true
                rdkafkaConf:
                  client.id: producer-event-audit
                  compression.type: lz4
                  dr_cb: false
                  event_cb: true
                  metadata.broker.list: "${KAFKA_HOST}:${KAFKA_PORT}"
                  queue.buffering.max.messages: 10000000
                  socket.keepalive.enable: true
                topicConf:
                  partitioner: murmur2_random
                  request.required.acks: all
            LOG:
              config:
                options:
                  messageCharset: utf8
                  sync: true
                rdkafkaConf:
                  client.id: producer-event-log
                  compression.type: lz4
                  dr_cb: false
                  event_cb: true
                  metadata.broker.list: "${KAFKA_HOST}:${KAFKA_PORT}"
                  queue.buffering.max.messages: 10000000
                  socket.keepalive.enable: true
                topicConf:
                  partitioner: murmur2_random
                  request.required.acks: all
            TRACE:
              config:
                options:
                  messageCharset: utf8
                  sync: true
                rdkafkaConf:
                  client.id: producer-event-trace
                  compression.type: lz4
                  dr_cb: false
                  event_cb: true
                  metadata.broker.list: "${KAFKA_HOST}:${KAFKA_PORT}"
                  queue.buffering.max.messages: 10000000
                  socket.keepalive.enable: true
                topicConf:
                  partitioner: murmur2_random
                  request.required.acks: all
      LOG: 'off'
      TRACE: 'off'
  gateway:
    enabled: true
    host: portal-api.int.${DOMAIN}
    parentRefs:
      - name: gw-int
        namespace: platform-system
    oathkeeper:
      serviceNamespace: ory

