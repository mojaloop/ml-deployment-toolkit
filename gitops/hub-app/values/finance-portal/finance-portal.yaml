# Distribution values for the finance-portal HelmRelease.
# Adopter overrides go in environments/<env>/values/finance-portal.yaml,
# which is merged after this file and therefore wins.
global:
  # FQDNs, not bare service names: this release runs in the finance-portal namespace and
  # these two services live in mojaloop. The chart interpolates these verbatim into
  # CENTRAL_ADMIN_URL on experience-api-svc, so a bare name resolves only in-namespace.
  adminApiSvc:
    host: moja-centralledger-service.mojaloop.svc.cluster.local
    port: 80
  settlementSvc:
    host: moja-centralsettlement-service.mojaloop.svc.cluster.local
    port: 80
  reportingDB:
    host: "${MYSQL_HOST}"
    port: ${MYSQL_PORT}
    user: central_ledger
    database: central_ledger
    secret:
      name: mysqldb
      key: mysql-password
  reportingEventsDB:
    host: "${MONGODB_HOST}"
    port: ${MONGODB_PORT}
    user: reporting
    database: reporting_events
    secret:
      name: reporting-events-db-secret
      key: mongodb-password

  # The micro-frontends the shell loads, one menu entry each; hosts match
  # each UI's gateway.host below, and each is offered when the caller holds
  # the permission that opens it, its authz.service below with `view`
  portalRemotes:
    - host: portal-iam.int.${DOMAIN}
      path: /iam
      label: Roles
      scope: reporting_hub_bop_role_ui
      permission: portalRoles.view
    - host: portal-transfers.int.${DOMAIN}
      path: /transfers
      label: Transfers
      scope: reporting_hub_bop_trx_ui
      permission: portalTransfers.view
    - host: portal-settlements.int.${DOMAIN}
      path: /settlements
      label: Settlements
      scope: reporting_hub_bop_settlements_ui
      permission: portalSettlements.view
    - host: portal-positions.int.${DOMAIN}
      path: /positions
      label: Financial Positions
      scope: reporting_hub_bop_positions_ui
      permission: portalPositions.view

  # The portal's routes key their backends for the IAM and carry its
  # ExternalAuth filter
  iam:
    enabled: true

reporting-hub-bop-shell:
  enabled: true
  image:
    registry: docker.io
    repository: kirgene/reporting-hub-bop-shell
    tag: iam-document-authz.3
  configFiles:
    config.json:
      # Header branding — TITLE uses Flux substitution so each
      # environment automatically displays its own cluster name.
      TITLE: "${CLUSTER_NAME}"
      SUBTITLE: "Finance Portal"
      TITLE_IMAGE: "https://mojaloop.io/wp-content/uploads/2020/07/mojaloop-foundation-orange.svg"
      TITLE_BAR_COLOR: "#0C1C8C"
      AUTH_ENABLED: "true"
      AUTH_TOKEN_URL: "https://kratos.int.${DOMAIN}/sessions/whoami"
      LOGIN_URL: "https://kratos.int.${DOMAIN}/self-service/login/browser"
      LOGOUT_URL: "https://kratos.int.${DOMAIN}/self-service/logout/browser"
      REMOTE_API_BASE_URL: "/"
      # The session endpoint above is absolute, so the client prefixes it with
      # nothing. Left unset, the shell prefixes the string "undefined".
      AUTH_API_BASE_URL: ""
  gateway:
    enabled: true
    host: portal.int.${DOMAIN}
    parentRefs:
      - name: gw-int
        namespace: platform-system
    oathkeeper:
      serviceNamespace: ory
  authz:
    service: portalShell

reporting-hub-bop-role-ui:
  enabled: true
  image:
    registry: docker.io
    repository: kirgene/reporting-hub-bop-role-ui
    tag: iam-document-authz.3
  configFiles:
    runtime-env.js: |
      window.roleEnv = {
        REACT_APP_API_BASE_URL: 'https://iam-api.int.${DOMAIN}',
        REACT_APP_IAM_SERVICE: 'iam'
      };
  gateway:
    enabled: true
    host: portal-iam.int.${DOMAIN}
    parentRefs:
      - name: gw-int
        namespace: platform-system
    oathkeeper:
      serviceNamespace: ory
  authz:
