        namespace: platform-system
    oathkeeper:
      serviceNamespace: ory

reporting-events-processor-svc:
  enabled: true
  image:
    tag: v3.5.2
  kafka:
    host: "${KAFKA_HOST}"
    port: ${KAFKA_PORT}
    topicEvent: topic-event-audit
    consumerGroup: reporting_events_processor_consumer_group
    clientId: reporting_events_processor_consumer
  configFiles:
    default.json:
      KAFKA:
        TOPIC_EVENT: "topic-event-audit"
        CONSUMER:
          EVENT:
            config:
              options:
                mode: 2
                batchSize: 50
                pollFrequency: 10
                recursiveTimeout: 100
                messageCharset: "utf8"
                messageAsJSON: true
                sync: true
                consumeTimeout: 10
              rdkafkaConf:
                clientId: "reporting_events_processor_consumer"
                groupId: "reporting_events_processor_consumer_group"
                metadataBrokerList: "${KAFKA_HOST}:${KAFKA_PORT}"
                socketKeepaliveEnable: true
                allowAutoCreateTopics: true
                partitionAssignmentStrategy: ""
                enableAutoCommit: false
              topicConf:
                autoOffsetReset: "earliest"

reporting-legacy-api:
  enabled: true
  image:
    registry: docker.io
    repository: kirgene/reporting
    tag: iam-document-authz.2
  containerSecurityContext:
    enabled: false
  # Load-bearing: this is the Helm `condition` on the reporting-k8s-templates
  # dependency, and those templates ARE the report routes. reporting-legacy-api
  # registers no routes of its own — src/operator.js watches MojaloopReport CRs
  # and builds its handler map from them. With this false the subchart is
  # skipped, no CRs are created, and every report URL the finance-portal
  # UIs link to returns a bare 404. The CRD itself still installs (Helm applies a
  # subchart's crds/ even when its condition is false), so `kubectl get crd`
  # looks healthy while `get mojaloopreports -A` is empty.
  install-templates: true
  auth: false
  config:
    env:
      VALIDATION_RETRY_COUNT: "10"
      VALIDATION_RETRY_INTERVAL_MS: "5000"
  reporting-k8s-templates:
    # Enumerated in full, matching the subchart's own defaults: an unlisted key
    # falls through to the subchart default of true, so a partial list reads as
    # a curated set while silently enabling everything. Turning a report off
    # means setting it false here, not deleting the line. All 16 validate
    # against the central_ledger schema this distribution ships.
    templates:
      bilateralSettlement: true
      bilateralSettlementExternalParticipants: true
      dfspSettlement: true
      dfspSettlementDetail: true
      dfspSettlementDetailExternalParticipant: true
      dfspSettlementExternalParticipant: true
      dfspSettlementStatement: true
      multilateralSettlement: true
      reconciliationAmount: true
      settlement: true
      settlementAudit: true
      settlementInitiation: true
      settlementWindow: true
      transaction: true
      transactionDetail: true
      transactionReconciliation: true
  gateway:
    enabled: true
    host: reports-api.int.${DOMAIN}
    parentRefs:
      - name: gw-int
        namespace: platform-system
    oathkeeper:
      serviceNamespace: ory

reporting-aggregator-svc:
  # Disabled during the 2026-07-02 perf campaign: its transfer/quote
  # aggregation query averaged 28s/execution on grown data (1884 DB-seconds,
  # see perf/RESULTS.md) and starved PXC. That was perf-scale data; at normal
  # volumes it is harmless, and without it the Mongo `transaction` collection
  # is never built, so the Transfers UI is empty on every fresh cluster.
  # Perf environments should disable it via adopter override until the
  # index/query fix lands.
  enabled: true
  image:
    tag: v0.0.9

reporting-nifi-processor-svc:
  resources:
    limits:
      cpu: 1
