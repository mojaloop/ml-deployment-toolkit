# Distribution values for the mcm HelmRelease.
# Adopter overrides go in environments/<env>/values/mcm.yaml,
# which is merged after this file and therefore wins.
global:
  iam:
    hydra:
      adminUrl: http://hydra-admin.ory.svc.cluster.local
      publicUrl: http://hydra-public.ory.svc.cluster.local
    kratos:
      adminUrl: http://kratos-admin.ory.svc.cluster.local
      publicUrl: http://kratos-public.ory.svc.cluster.local
    provisioningUrl: http://iam-ml-iam-services-provisioning.ory.svc.cluster.local

iam:
  enabled: true
  # DFSP onboarding: each DFSP is recorded as a Participant, the invited
  # admin operates it, the machine client speaks for it
  dfspResourceName: Participant
  dfspAdminRole: dfsp-operator
  dfspClientRole: dfsp-client

db:
  user: mcm
  passwordSecret: mcm-db-secret
  passwordSecretKey: mysql-password
  host: "${MYSQL_HOST}"
  port: ${MYSQL_PORT}
  schema: mcm

api:
  image:
    name: kirgene/connection-manager-api
    version: iam-document-authz
  url: "https://mcm-api.ext.${DOMAIN}"
  clientUrl: "https://mcm.int.${DOMAIN}/"
  switchFQDN: "${DOMAIN}"
  switchId: "${HUB_PARTICIPANT_NAME}"

  certManager:
    enabled: true
    serverCertSecretName: extapi-tls
    serverCertSecretNamespace: mojaloop

  vault:
    auth:
      k8s:
        enabled: true
        token: /var/run/secrets/kubernetes.io/serviceaccount/token
        role: mcm
        mountPoint: kubernetes
    endpoint: "http://vault.vault.svc.cluster.local:8200"
    mounts:
      pki: pki
      kv: secret/mcm
      dfspClientCertBundle: secret/onboarding_pm4mls
      dfspInternalIPWhitelistBundle: secret/whitelist_pm4mls
      dfspExternalIPWhitelistBundle: secret/whitelist_fsps
    pkiServerRole: server-cert-role
    pkiClientRole: client-cert-role
    signExpiryHours: 43800
    keyLength: 4096

  serviceAccount:
    name: connection-manager-api
    externallyManaged: false

ui:
  authEnabled: true
  image:
    name: kirgene/connection-manager-ui
    version: iam-document-authz
  checkSessionUrl: "https://kratos.int.${DOMAIN}/sessions/whoami"
  loginUrl: "https://kratos.int.${DOMAIN}/self-service/login/browser"
  loginProvider: kratos
  logoutUrl: "https://kratos.int.${DOMAIN}/self-service/logout/browser"

gateway:
  enabled: true
  oathkeeper:
    serviceNamespace: ory
    serviceName: oathkeeper-api
    servicePort: 4456
  # The API host serves DFSP machines and the UI's browser calls; the tier
  # is which gateway the name attaches to
  api:
    hosts:
      - "mcm-api.ext.${DOMAIN}"
    parentRefs:
      - name: gw-ext
        namespace: platform-system
    cors:
      allowOrigins:
        - "https://mcm.int.${DOMAIN}"
      allowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowHeaders:
        - content-type
        - authorization
      allowCredentials: true
  ui:
    hosts:
      - "mcm.int.${DOMAIN}"
    parentRefs:
      - name: gw-int
        namespace: platform-system

# The migration job's vault and switch env comes from api.vault/api.switchId
# through the chart
migrations:
  enabled: true
  deletePolicy: before-hook-creation

ingress:
  enabled: false
