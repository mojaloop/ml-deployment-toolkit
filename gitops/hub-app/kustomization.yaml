apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mojaloop/helmrelease.yaml
  # Secret half of the mojaloop distribution values (credential keys)
  - mojaloop/values-secret.yaml
  - mojaloop/switch-jws-cert.yaml
  - mojaloop/switch-jws-pubkey-job.yaml
  - mcm/helmrelease.yaml
  - mcm/secrets.yaml
  - mcm/rbac.yaml
  - mcm/vault-agent-configmap.yaml
  - mcm/vault-agent-deployment.yaml
  - mcm/vault-agent-rbac.yaml
  - finance-portal/helmrelease.yaml
  - finance-portal/externalsecret-reporting-events-db.yaml
  # gw-ext routes (DFSP-facing — SIMPLE TLS via Cilium Gateway)
  - routes/referencegrant-ext.yaml
  # hub-only LB pools (gw-extapi + gw-intapi; gw-int/gw-ext live in the talos layer)
  - routes/lb-ipam-pools.yaml
  # extapi mTLS (DFSP-facing — mutual TLS via standalone Envoy Deployment)
  - routes/extapi-service.yaml
  - routes/extapi-cert.yaml
  - routes/extapi-envoy-config.yaml
  - routes/extapi-envoy-deployment.yaml
  - observability/trace-bridge.yaml
  - observability/instrumentation.yaml
  # gw-intapi (operator-tool machine APIs behind oauth2 — dedicated gateway
  # and IP; the route and its authorization come from the iam release)
  - routes/gateway-intapi.yaml

# Distribution values for each HelmRelease in this kustomization.
# Rendered into ConfigMaps that the HelmRelease references first in valuesFrom;
# the adopter's <release>-values-override is merged after them and wins.
configMapGenerator:
  - name: finance-portal-values
    namespace: flux-system
    files:
      - values.yaml=values/finance-portal/finance-portal.yaml
  - name: mcm-values
    namespace: flux-system
    files:
      - values.yaml=values/mcm/mcm.yaml
  - name: mojaloop-values
    namespace: flux-system
    files:
      - values.yaml=values/mojaloop/mojaloop.yaml
generatorOptions:
  disableNameSuffixHash: true
