# Secret half of the mojaloop distribution values: every credential-bearing
# key, split out of values/mojaloop/mojaloop.yaml so no secret token ever
# passes through a ConfigMap (check-secret-placement covers generator inputs
# too). stringData, not a secretGenerator: kustomize generators base64-encode
# file content, which would hide the substitution tokens from Flux's post-build
# substitution. Merged by the HelmRelease directly after the distribution
# ConfigMap, so template and environment overrides still win.
apiVersion: v1
kind: Secret
metadata:
  name: mojaloop-values-secret
  namespace: flux-system
type: Opaque
stringData:
  values.yaml: |
    centralledger:
      centralledger-service:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralledger-handler-transfer-prepare:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralledger-handler-transfer-position:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralledger-handler-transfer-position-batch:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralledger-handler-transfer-get:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralledger-handler-transfer-fulfil:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralledger-handler-timeout:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralledger-handler-admin-transfer:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
    quoting-service:
      quoting-service:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      quoting-service-handler:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
    centralsettlement:
      centralsettlement-service:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralsettlement-handler-deferredsettlement:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralsettlement-handler-grosssettlement:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
      centralsettlement-handler-rules:
        config:
          db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
    account-lookup-service:
      account-lookup-service:
        config:
          db_password: "${MYSQL_ACCOUNT_LOOKUP_PASSWORD}"
      account-lookup-service-admin:
        config:
          db_password: "${MYSQL_ACCOUNT_LOOKUP_PASSWORD}"
    als-msisdn-oracle:
      config:
        db_password: "${MYSQL_ORACLE_MSISDN_PASSWORD}"
    mojaloop-bulk:
      config:
        mongo_password: "${MONGODB_APP_PASSWORD}"
      bulk-api-adapter:
        bulk-api-adapter-service:
          config:
            mongo_password: "${MONGODB_APP_PASSWORD}"
            mongodb:
              password: "${MONGODB_APP_PASSWORD}"
      bulk-centralledger:
        cl-handler-bulk-transfer-prepare:
          config:
            mongo_password: "${MONGODB_APP_PASSWORD}"
            db_password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
    ml-testing-toolkit:
      config:
        mongodb:
          password: "${MONGODB_APP_PASSWORD}"
      ml-testing-toolkit-backend:
        config:
          mongodb:
            password: "${MONGODB_APP_PASSWORD}"
