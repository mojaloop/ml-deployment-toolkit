apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mojaloop
  namespace: flux-system
spec:
  interval: 24h
  url: https://mojaloop.github.io/helm/repo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mojaloop
  namespace: flux-system
spec:
  interval: 10m
  timeout: 30m
  chart:
    spec:
      chart: mojaloop
      version: "17.2.0"
      sourceRef:
        kind: HelmRepository
        name: mojaloop
      interval: 12h
  releaseName: moja
  targetNamespace: mojaloop
  storageNamespace: mojaloop
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      # rollback, NOT uninstall: an upgrade timeout on 2026-07-02 triggered a
      # full uninstall/reinstall that wiped ALS oracle registrations (see
      # perf/RESULTS.md and the oracle-durability task)
      retries: 3
      strategy: rollback
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: mojaloop-values
      valuesKey: values.yaml
    # Secret half of the distribution values (credential-bearing keys) —
    # merged right after them; template/environment overrides still win.
    - kind: Secret
      name: mojaloop-values-secret
      valuesKey: values.yaml
    - kind: ConfigMap
      name: mojaloop-mojaloop-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: mojaloop-mojaloop-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: mojaloop-mojaloop-values-override
      valuesKey: values.yaml
      optional: true
  # The chart's common.topologySpread template hardcodes maxSkew=1/DoNotSchedule
  # on hostname. With default nodeTaintsPolicy (Ignore), the tainted control
  # plane counts as a 0-pod domain, capping replicas at one per worker.
  # Honor excludes tainted nodes from skew domains so replicas > worker count
  # can schedule while keeping even spread.
  # Targets are enumerated (not a kind-wide wildcard) because several release
  # members (bulk adapters, testing-toolkit frontend) render without
  # topologySpreadConstraints and a JSON6902 add would fail the whole render.
  # Names verified against chart 17.2.0 — re-verify on chart version bumps.
  # Remove this block once the fix lands upstream in the common chart.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: Deployment, name: moja-account-lookup-service}
            patch: &honorTaints |
              - op: add
                path: /spec/template/spec/topologySpreadConstraints/0/nodeTaintsPolicy
                value: Honor
          - target: {kind: Deployment, name: moja-account-lookup-service-admin}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-als-msisdn-oracle}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-quoting-service}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-quoting-service-handler}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralledger-service}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-prepare}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-position}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-handler-pos-batch}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-fulfil}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-get}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralledger-handler-timeout}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralledger-handler-admin-transfer}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralsettlement-service}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralsettlement-handler-deferredsettlement}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-centralsettlement-handler-rules}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-transaction-requests-service}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-ml-api-adapter-service}
            patch: *honorTaints
          - target: {kind: Deployment, name: moja-ml-api-adapter-handler-notification}
            patch: *honorTaints
          # Kafka-consumer handlers report unhealthy (isAssigned=false) while
          # group rebalances are in progress; at failureThreshold=3/period=15s
          # the probe kills pods mid-rebalance, triggering another rebalance —
          # the death spiral of 2026-07-02 (perf/RESULTS.md). 8×15s = 2min
          # tolerance lets rebalances complete. Upstream fix candidates: health
          # endpoint tolerating transitional assignment, or cooperative-sticky.
          - target: {kind: Deployment, name: moja-quoting-service-handler}
            patch: &relaxProbe |
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
                value: 8
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-prepare}
            patch: *relaxProbe
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-position}
            patch: *relaxProbe
          - target: {kind: Deployment, name: moja-handler-pos-batch}
            patch: *relaxProbe
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-fulfil}
            patch: *relaxProbe
          - target: {kind: Deployment, name: moja-ml-api-adapter-handler-notification}
            patch: *relaxProbe
          # Consumer-loop tuning (perf campaign): notification handling is
          # fast (~35ms/msg) but topic-notification-event accumulates the
          # largest lag at 5 TPS — the batchSize:1/consumeTimeout:1000 poll
          # cycle is the cost, not the work. node-config merges the
          # NODE_CONFIG env var with highest precedence (a config/local.json
          # file mount is impossible: runc cannot bind a file inside the
          # read-only configmap volume at /opt/app/config).
          - target: {kind: Deployment, name: moja-ml-api-adapter-handler-notification}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: NODE_CONFIG
                  value: '{"KAFKA":{"CONSUMER":{"NOTIFICATION":{"EVENT":{"config":{"options":{"batchSize":10,"consumeTimeout":5}}}}}}}'
          # Same consumer-loop tuning for the two stages that took over the
          # lag lead at sustained 5 TPS (prepare 350, quotes-post 326 peak).
          # central-ledger and quoting read rc-style env (CLEDG_/QUOTE_, __
          # nesting) — same channel their charts already use for DB config.
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-prepare}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: CLEDG_KAFKA__CONSUMER__TRANSFER__PREPARE__config__options__batchSize, value: "10"}
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: CLEDG_KAFKA__CONSUMER__TRANSFER__PREPARE__config__options__consumeTimeout, value: "5"}
          - target: {kind: Deployment, name: moja-quoting-service-handler}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: QUOTE_KAFKA__CONSUMER__QUOTE__POST__config__options__batchSize, value: "10"}
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: QUOTE_KAFKA__CONSUMER__QUOTE__POST__config__options__consumeTimeout, value: "5"}
          # V8 young-gen enlargement (whitepaper-derived, ml-perf-whitepaper-ws):
          # short-lived per-message objects (parsed payloads, log/audit events,
          # OTel spans) overflow the default 16MB semi-space and get promoted to
          # old-space, causing major-GC event-loop freezes that inflate every
          # in-flight span. 64MB lets them die young in cheap scavenges. Costs
          # up to ~128MB RSS per pod. NODE_OPTIONS is read by the node binary at
          # startup — no chart values key exists for it, hence the env patch.
          - target: {kind: Deployment, name: moja-centralledger-service}
            patch: &nodeGcEnv |
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: NODE_OPTIONS, value: "--max-semi-space-size=64"}
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-prepare}
            patch: *nodeGcEnv
          - target: {kind: Deployment, name: moja-centralledger-handler-transfer-fulfil}
            patch: *nodeGcEnv
          - target: {kind: Deployment, name: moja-handler-pos-batch}
            patch: *nodeGcEnv
          - target: {kind: Deployment, name: moja-ml-api-adapter-service}
            patch: *nodeGcEnv
          - target: {kind: Deployment, name: moja-ml-api-adapter-handler-notification}
            patch: *nodeGcEnv
          - target: {kind: Deployment, name: moja-quoting-service}
            patch: *nodeGcEnv
          - target: {kind: Deployment, name: moja-quoting-service-handler}
            patch: *nodeGcEnv
          - target: {kind: Deployment, name: moja-account-lookup-service}
            patch: *nodeGcEnv
