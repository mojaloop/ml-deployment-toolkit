# Role → permission mapping for gw-intapi machine clients. The BOF operator
# writes permission:intapiApi#granted@(role:intapi#member); an operator
# admits a machine client by creating its Hydra client (client_credentials)
# and adding role:intapi#member@<client_id>.
apiVersion: mojaloop.io/v1
kind: MojaloopRole
metadata:
  name: intapi
  namespace: ory
spec:
  role: intapi
  permissions:
    - intapiApi
