# Oathkeeper rules for gw-intapi — operator-tool machine APIs behind oauth2
# (todo #20). jwt-only: callers present a Hydra client-credentials token
# (POST https://hydra.ext.<domain>/oauth2/token), no human sessions here.
#
# Authorization: every rule checks permission:intapiApi#granted in Keto.
# The permission is granted through the intapi MojaloopRole; an operator
# admits a machine client by creating the Hydra client and writing
#   role:intapi#member@<client_id>
# (same flow as DFSP machine clients on MCM, scoped by Keto — a DFSP's
# MCM client has no intapi grant and is refused here).
#
# The FSPIOP mirror prefixes (participants/parties/quotes/transfers/...)
# are KEPT behind oauth2 for now — whether the mirror shrinks to
# admin-only surfaces is still open (todo #17); trimming is a rule
# deletion, not a redesign.
---
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: intapi-account-lookup
  namespace: ory
spec:
  match:
    url: "<http|https>://intapi.int.${DOMAIN}/<(participants|parties)(/.*)?>"
    methods: [GET, POST, PUT, DELETE, PATCH]
  authenticators:
    - handler: jwt
  authorizer:
    handler: remote_json
    config:
      remote: http://keto-read.ory.svc.cluster.local:80/relation-tuples/check
      payload: |
        {
          "namespace": "permission",
          "object": "intapiApi",
          "relation": "granted",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://moja-account-lookup-service.mojaloop.svc.cluster.local:80
