---
# Settlement joins intapi as a path prefix (its standalone settlement.int
# gw-int route is gone). The Finance Portal is unaffected: it reaches
# central-settlement through its own fp-api-central-settlements rule on
# the finance-portal.int host.
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: intapi-settlement
  namespace: ory
spec:
  match:
    url: "<http|https>://intapi.int.${DOMAIN}/<(settlements|settlementWindows|settlementModels)(/.*)?>"
    methods: [GET, POST, PUT, DELETE, PATCH]
  authenticators:
    - handler: jwt
  authorizer:
    handler: remote_json
    config:
      remote: http://keto-read.ory.svc.cluster.local:80/relation-tuples/check
      payload: |
        {
          "namespace": "permission",
          "object": "intapiApi",
          "relation": "granted",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://moja-centralsettlement-service.mojaloop.svc.cluster.local:80
