# MCM external interface — DFSP-facing PM4ML machine API.
# DFSPs use the conventional /pm4mlapi base (ITK default). We rewrite it to /api
# and route through Oathkeeper (JWT auth + Keto authz) — the same rules as the
# internal host, matched by mcm.<?:int|ext>. Oathkeeper sees the rewritten /api
# path, so no separate ext rules are needed. Previously this bypassed Oathkeeper.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcm-ext
  namespace: mcm
spec:
  parentRefs:
    - name: gw-ext
      namespace: platform-system
  hostnames:
    - "mcm.ext.${DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pm4mlapi
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api
      backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
