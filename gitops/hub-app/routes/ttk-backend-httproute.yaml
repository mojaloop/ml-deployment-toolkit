# TTK backend + spec API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ttk-backend
  namespace: mojaloop
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "ttk-backend.int.${DOMAIN}"
  rules:
    # Through oathkeeper (cookie_session + Keto opsui permission) — the
    # matching Rule in hub-app/ops-ui/oathkeeper-rules.yaml carries the
    # upstream; this route only decides that NOTHING reaches the backend
    # without passing the proxy.
    - backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
