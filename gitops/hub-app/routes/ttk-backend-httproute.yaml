# TTK backend + spec API
#
# AUTH BYPASSED (2026-08-26, temporary): the two-host TTK layout is
# incompatible with cookie-gated auth — the UI's cross-origin XHR from
# ttk.int never carries the Kratos session cookie, so oathkeeper 401s
# every API call. Both TTK hosts are deliberately routed straight to
# their services (visibly unprotected — no cosmetic login anywhere).
# End-state: collapse TTK to a single origin (ttk.int path-split), then
# restore the oathkeeper backendRef below. The ops-ui-ttk* oathkeeper
# Rules, the ttkUi permission, and the ReferenceGrant are all left in
# place, dormant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ttk-backend
  namespace: mojaloop
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "ttk-backend.int.${DOMAIN}"
  rules:
    - backendRefs:
        # --- protected config: restore this backendRef to re-enable auth ---
        # (through oathkeeper: cookie_session + Keto opsui permission; the
        # matching Rule in hub-app/ops-ui/oathkeeper-rules.yaml carries the
        # upstream)
        # - name: oathkeeper-proxy
        #   namespace: ory
        #   port: 4455
        # --- bypass: direct to service ---
        - name: moja-ml-testing-toolkit-backend
          port: 5050
