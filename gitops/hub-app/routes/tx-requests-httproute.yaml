# Transaction Requests Service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tx-requests
  namespace: mojaloop
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "tx-requests.int.${DOMAIN}"
  rules:
    - backendRefs:
        - name: moja-transaction-requests-service
          port: 80
