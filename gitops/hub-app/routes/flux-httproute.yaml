# Hub-only: the tooling cluster has no IAM to gate this UI behind, so it
# exposes no route — operators port-forward there. Auth delegates to
# Oathkeeper against the fluxUi document (hub-iam-config).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux
  namespace: flux-system
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "flux.int.${DOMAIN}"
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oathkeeper-api
              namespace: ory
              port: 4456
            http:
              path: /decisions
              allowedHeaders:
                - cookie
                - accept
      backendRefs:
        - name: flux-operator
          port: 9080
