# Hub-only (moved from the shared layers in P4): the tooling cluster has no
# IAM to gate this UI behind, so it exposes no route — operators
# port-forward there. Here it rides oathkeeper (cookie_session + Keto).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux
  namespace: flux-system
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "flux.int.${DOMAIN}"
  rules:
    # Through oathkeeper (cookie_session + Keto opsui permission) — the
    # matching Rule in hub-app/ops-ui/oathkeeper-rules.yaml carries the
    # upstream; this route only decides that NOTHING reaches the backend
    # without passing the proxy.
    - backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
