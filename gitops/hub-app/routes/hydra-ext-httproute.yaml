# Hydra OAuth2 public endpoint — PM4ML machine client token acquisition
# Exposes /oauth2/token and /.well-known/jwks.json on the ext gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hydra-ext
  namespace: ory
spec:
  parentRefs:
    - name: gw-ext
      namespace: platform-system
  hostnames:
    - "hydra.ext.${DOMAIN}"
  rules:
    - backendRefs:
        - name: hydra-public
          port: 4444
