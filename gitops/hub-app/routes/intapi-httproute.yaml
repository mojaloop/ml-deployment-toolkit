# gw-intapi — operator-tool machine APIs behind oauth2 (Hydra
# client-credentials, verified by oathkeeper's jwt authenticator; Keto
# authorizes per client). The API surface — the FSPIOP mirror prefixes and
# the settlement paths that joined it — is defined by the Rules in
# hub-app/ops-api/oathkeeper-rules.yaml, which carry the upstreams; this
# route only decides that NOTHING on this gateway reaches a backend
# without passing the proxy. Unmatched paths die in oathkeeper with 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: intapi
  namespace: mojaloop
spec:
  parentRefs:
    - name: gw-intapi
      namespace: platform-system
  hostnames:
    - "intapi.int.${DOMAIN}"
  rules:
    - backendRefs:
        - name: oathkeeper-proxy
          namespace: ory
          port: 4455
