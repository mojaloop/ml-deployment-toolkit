# gw-intapi — operator-tool machine APIs behind oauth2 (Hydra
# client-credentials). The route carries the path dispatch to the mirror's
# services, each keyed with its own prefix over intapi-authzdocument, so a
# grant on one service's paths reaches no other's. Central settlement also
# answers on its own route under settlement with the document it serves, so
# its mount here is a prefix of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: intapi
  namespace: mojaloop
  annotations:
    iam.mojaloop.io/moja-account-lookup-service.service: lookup
    iam.mojaloop.io/moja-account-lookup-service.schema: intapi
    iam.mojaloop.io/moja-quoting-service.service: quotes
    iam.mojaloop.io/moja-quoting-service.schema: intapi
    iam.mojaloop.io/moja-ml-api-adapter-service.service: transfers
    iam.mojaloop.io/moja-ml-api-adapter-service.schema: intapi
    iam.mojaloop.io/moja-transaction-requests-service.service: transactionRequests
    iam.mojaloop.io/moja-transaction-requests-service.schema: intapi
    iam.mojaloop.io/moja-centralsettlement-service.service: intapiSettlements
    iam.mojaloop.io/moja-centralsettlement-service.schema: intapi
spec:
  parentRefs:
    - name: gw-intapi
      namespace: platform-system
  hostnames:
    - "intapi.int.${DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /participants
        - path:
            type: PathPrefix
            value: /parties
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oathkeeper-api
              namespace: ory
              port: 4456
            http:
              path: /decisions
              allowedHeaders:
                - authorization
                - accept
      backendRefs:
        - name: moja-account-lookup-service
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /quotes
        - path:
            type: PathPrefix
            value: /fxQuotes
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oathkeeper-api
              namespace: ory
              port: 4456
            http:
              path: /decisions
              allowedHeaders:
                - authorization
                - accept
      backendRefs:
        - name: moja-quoting-service
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /transfers
        - path:
            type: PathPrefix
            value: /fxTransfers
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oathkeeper-api
              namespace: ory
              port: 4456
            http:
              path: /decisions
              allowedHeaders:
                - authorization
                - accept
      backendRefs:
        - name: moja-ml-api-adapter-service
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /transactionRequests
        - path:
            type: PathPrefix
            value: /authorizations
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oathkeeper-api
              namespace: ory
              port: 4456
            http:
              path: /decisions
              allowedHeaders:
                - authorization
                - accept
      backendRefs:
        - name: moja-transaction-requests-service
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /settlements
        - path:
            type: PathPrefix
            value: /settlementWindows
        - path:
            type: PathPrefix
            value: /settlementModels
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oathkeeper-api
              namespace: ory
              port: 4456
            http:
              path: /decisions
              allowedHeaders:
                - authorization
                - accept
      backendRefs:
        - name: moja-centralsettlement-service
          port: 80
