# Dedicated Gateway for the FSPIOP internal API mirror. It shares gw-int's
# wildcard cert but owns its own IP, so the no-mTLS FSPIOP surface can be
# firewalled independently of the ops UIs on gw-int.
# NO cert-manager annotation here: gw-int is the sole annotated owner of
# wildcard-int-tls — a second annotated Gateway would fight over the secret.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-intapi
  namespace: platform-system
  annotations:
    # What external-dns publishes for every attached route: pool wan when
    # cluster.lb_ipam.pools.gw-ext.wan is set (1:1 DNAT or shared SNI proxy),
    # the lan IP otherwise.
    external-dns.alpha.kubernetes.io/target: "${GW_INTAPI_DNS_TARGET}"
spec:
  gatewayClassName: ${P_GATEWAY_CLASS}
  # Propagated to the generated LoadBalancer Service; the gw-intapi
  # CiliumLoadBalancerIPPool selects on it. The NLB annotation is consumed
  # only where a cloud controller provisions the Service (AWS — Classic ELB
  # otherwise); inert on-prem, where LB-IPAM assigns the address.
  infrastructure:
    labels:
      lb-pool: gw-intapi
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  listeners:
    - name: https
      hostname: "intapi.int.${DOMAIN}"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-int-tls
      allowedRoutes:
        namespaces:
          from: All
