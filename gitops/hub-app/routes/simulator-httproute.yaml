# Simulators
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: simulator
  namespace: mojaloop
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "simulator.int.${DOMAIN}"
  rules:
    - backendRefs:
        - name: moja-simulator
          port: 8444
