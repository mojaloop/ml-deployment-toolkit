# Hub-only: the tooling cluster has no IAM to gate this UI behind, so it
# exposes no route — operators port-forward there. Auth delegates to
# Oathkeeper, which checks the goldilocksUi permissions of
# goldilocks-authzdocument.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
  namespace: goldilocks
  annotations:
    iam.mojaloop.io/goldilocks-goldilocks-dashboard.service: goldilocksUi
    iam.mojaloop.io/goldilocks-goldilocks-dashboard.schema: goldilocks-ui
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "goldilocks.int.${DOMAIN}"
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oathkeeper-api
              namespace: ory
              port: 4456
            http:
              path: /decisions
              allowedHeaders:
                - cookie
                - accept
      backendRefs:
        - name: goldilocks-goldilocks-dashboard
          port: 80
