# Central Settlement
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: settlement
  namespace: mojaloop
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "settlement.int.${DOMAIN}"
  rules:
    - backendRefs:
        - name: moja-centralsettlement-service
          port: 80
