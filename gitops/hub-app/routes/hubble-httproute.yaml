# Moved here from the shared layers (P4 of the security baseline): only hub
# clusters expose this UI on gw-int — the tooling cluster has no IAM to gate
# it behind, so operators port-forward there. Next step (P5) routes this
# through oathkeeper instead of straight to the backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: cilium
spec:
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hostnames:
    - "hubble.int.${DOMAIN}"
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
