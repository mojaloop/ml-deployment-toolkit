# OTel auto-instrumentation for Mojaloop services.
#
# WHY: Mojaloop v17.x images already contain semconv-compliant OTel tracing in
# @mojaloop/central-services-stream (Kafka PRODUCER/CONSUMER spans, traceparent
# propagation across topics) but ship only @opentelemetry/api — no SDK — so the
# NoopTracerProvider discards every span. The operator injects an SDK, which
# registers a global TracerProvider and activates that dormant instrumentation.
# node-rdkafka has no OTel auto-instrumentation, so those in-image Kafka spans
# are the ONLY way to get cross-topic propagation; auto-instrumentation supplies
# the HTTP/hapi/MySQL spans around them. Both halves are needed.
#
# ACTIVATION is per-workload and NOT set here — a pod opts in with:
#   instrumentation.opentelemetry.io/inject-nodejs: "true"
# on its pod template. Nothing is instrumented until a pod carries that.
#
# Runs in PARALLEL with the Event SDK path (TRACE: kafka -> trace-bridge).
# Both produce independent traces with different trace IDs. Watch for
# traceparent/tracestate contention on FSPIOP callbacks: both systems write
# those headers, and if OTel wins, existing Event SDK traces may stop
# stitching. That is the third check in the pilot.
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: mojaloop-nodejs
  namespace: mojaloop
spec:
  # Alloy is the collector — not an OpenTelemetryCollector CR.
  # See gitops/hub-observability-agent/alloy-values.yaml.
  exporter:
    endpoint: http://alloy.observability.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    # Head sampling from the outset. Unsampled spans are never created, so this
    # is far cheaper than dropping them downstream, and it is the mitigation for
    # the trace-volume problem that has blocked OTel adoption upstream
    # (design-authority-project#121). Raise toward 1.0 for a diagnosis window.
    type: parentbased_traceidratio
    # 1.0 is DELIBERATE and COUPLED to otelcol.processor.tail_sampling in
    # gitops/hub-observability-agent/alloy-values.yaml. Sampling now happens at
    # the tail, where the whole trace is visible, so every error and every
    # >1000ms (SLO-breaching) trace is kept and only the boring 90% is dropped.
    # Head sampling at 0.1 would discard rare failures before Alloy ever saw
    # them, which is exactly the traces you most want.
    # COST: all spans cross the network to Alloy (in-cluster, cheap); only the
    # sampled subset is shipped to Tempo across the cc boundary (expensive).
    # If you lower this, lower it knowing tail sampling degrades proportionally.
    argument: "1.0"
  resource:
    addK8sUIDAttributes: true
    resourceAttributes:
      # Mirrors the cluster_name external_label Alloy adds to metrics, so
      # traces, metrics and logs correlate on the same cluster identifier.
      cluster.name: ${cluster_name}
  nodejs:
    resourceRequirements:
      # The injected SDK adds RSS to every instrumented pod. These nodes have
      # run memory-bound (62-77%) and Alloy has OOM-looped, so keep this tight
      # and watch node memory before widening the annotation beyond one service.
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    # The operator defaults ALL THREE signals to the otlp exporter, but the
    # Alloy receiver only wires `traces` in its output block, so /v1/metrics
    # and /v1/logs return 404. Without these the SDK retries a failing metrics
    # export every 60s and logs a stack trace each time. Turn them off until
    # Alloy actually consumes those signals from here (metrics already arrive
    # via prometheus scrape; logs via loki.source.kubernetes.pods).
    - name: OTEL_METRICS_EXPORTER
      value: none
    - name: OTEL_LOGS_EXPORTER
      value: none
    # NOTE: set OTEL_LOG_LEVEL=debug to diagnose. It prints which
    # instrumentations loaded ("Loading instrumentation for
    # @opentelemetry/instrumentation-hapi") and any export failures — both are
    # completely silent at the default level, which makes a broken pipeline
    # look identical to an idle one. It is very noisy; leave it off normally.
    # Explicit ALLOWLIST, not a denylist. Unconstrained
    # getNodeAutoInstrumentations() spans every fs/dns/net call and is the main
    # driver of the "huge volume of data" objection upstream. These are the
    # instrumentations that answer actual questions about this stack: FSPIOP
    # callbacks (http), route handling (hapi), and the DB path (mysql/knex).
    - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
      value: "http,hapi,mysql,mysql2,knex,ioredis"
