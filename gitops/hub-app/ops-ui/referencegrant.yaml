# Allow the ops-UI HTTPRoutes to backendRef oathkeeper-proxy in ory.
# Load-bearing (backendRefs), unlike the "to: Gateway" grants — see
# finance-portal/referencegrant.yaml for the distinction. One grant covers
# every namespace that owns an ops-UI route.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-ops-ui-httproute-ref
  namespace: ory
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: mojaloop
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: flux-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: goldilocks
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: cilium
  to:
    - group: ""
      kind: Service
