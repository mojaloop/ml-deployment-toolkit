# Oathkeeper rules for the operations UIs (ttk, ttk-backend, flux,
# goldilocks, hubble). One catch-all rule per host: these are browser UIs,
# not per-action APIs — authentication is the boundary, and a single Keto
# permission per UI (granted through the opsui MojaloopRole) decides access.
#
# Auth: cookie_session only — machines have no business here. An
# unauthenticated browser is sent to the Kratos login page by the redirect
# error handler each rule declares (per-rule errors — this oathkeeper only
# consults handlers listed on the rule; the global config carries their
# `when`); XHR calls keep getting 401 JSON through the fallback.
#
# TTK note: the frontend talks to the backend over socket.io (websockets).
# Oathkeeper's reverse proxy passes connection upgrades through; verify the
# TTK UI updates live on a fresh install (P5 checklist).
---
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: ops-ui-ttk
  namespace: ory
spec:
  match:
    url: "<http|https>://ttk.int.${DOMAIN}<(/.*)?>"
    methods: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
    config:
      remote: http://keto-read.ory.svc.cluster.local:80/relation-tuples/check
      payload: |
        {
          "namespace": "permission",
          "object": "ttkUi",
          "relation": "granted",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
  # Consulted PER RULE in this oathkeeper (rl.Errors) — the global
  # errors.handlers config only supplies the handler's `when` (unauthorized +
  # Accept: text/html) and the json fallback. Without this stanza no rule
  # ever redirects.
  errors:
    - handler: redirect
  upstream:
    preserveHost: false
    url: http://moja-ml-testing-toolkit-frontend.mojaloop.svc.cluster.local:6060
