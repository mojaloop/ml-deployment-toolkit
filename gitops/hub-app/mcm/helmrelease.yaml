apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcm
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: connection-manager
      version: "17.2.0"
      sourceRef:
        kind: HelmRepository
        name: mojaloop
      interval: 12h
  releaseName: mcm
  targetNamespace: mcm
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      strategy: uninstall
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: mcm-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: mcm-values-override
      valuesKey: values.yaml
      optional: true
