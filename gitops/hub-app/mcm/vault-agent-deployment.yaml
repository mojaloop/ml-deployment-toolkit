apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-agent
  namespace: mcm
  labels:
    app: vault-agent
  annotations:
    # Re-render on template changes: the agent reads vault-agent-config only at
    # startup, so a shipped ConfigMap edit is inert until the pod restarts.
    configmap.reloader.stakater.com/reload: vault-agent-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-agent
  template:
    metadata:
      labels:
        app: vault-agent
    spec:
      serviceAccountName: vault-agent

      initContainers:
        # 1. Download kubectl binary (reuses already-cached vault image)
        - name: install-kubectl
          image: hashicorp/vault:1.21.4
          command: ["/bin/sh", "-c", "wget -qO /tools/kubectl 'https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl' && chmod +x /tools/kubectl"]
          volumeMounts:
            - name: tools
              mountPath: /tools

        # 2. Bootstrap whitelist secrets in Vault if missing
        - name: vault-agent-init
          image: hashicorp/vault:1.21.4
          command: ["vault", "agent", "-config=/etc/vault/init-config.hcl"]
          volumeMounts:
            - name: config
              mountPath: /etc/vault
            - name: vault-token
              mountPath: /home/vault
            - name: tmp
              mountPath: /vault/secrets/tmp
            - name: tools
              mountPath: /tools

      containers:
        # Main agent: watches Vault, templates + applies K8s resources
        - name: vault-agent
          image: hashicorp/vault:1.21.4
          command: ["/bin/sh", "-c", "export PATH=/tools:$PATH && vault agent -config=/etc/vault/config.hcl"]
          volumeMounts:
            - name: config
              mountPath: /etc/vault
            - name: vault-token
              mountPath: /home/vault
            - name: tmp
              mountPath: /vault/secrets/tmp
            - name: tools
              mountPath: /tools

      volumes:
        - name: config
          configMap:
            name: vault-agent-config
        - name: vault-token
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: tools
          emptyDir: {}
