# MCM database credentials
apiVersion: v1
kind: Secret
metadata:
  name: mcm-db-secret
  namespace: mcm
type: Opaque
stringData:
  mysql-password: "${mcm_db_password}"
---
# MCM OIDC client secret (Keycloak dfsps realm)
apiVersion: v1
kind: Secret
metadata:
  name: mcm-oidc-client-secret
  namespace: mcm
type: Opaque
stringData:
  secret: "${mcm_oidc_client_secret}"
---
# MCM dummy secret (workaround: Flux Helm controller silently skips this hook)
apiVersion: v1
kind: Secret
metadata:
  name: mcm-secret
  namespace: mcm
type: Opaque
data:
  dummy: RFVNTVk=
