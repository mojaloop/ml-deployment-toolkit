# MCM database credentials
apiVersion: v1
kind: Secret
metadata:
  name: mcm-db-secret
  namespace: mcm
type: Opaque
stringData:
  mysql-password: "${MCM_DB_PASSWORD}"
---
# MCM dummy secret (workaround: Flux Helm controller silently skips this hook)
apiVersion: v1
kind: Secret
metadata:
  name: mcm-secret
  namespace: mcm
type: Opaque
data:
  dummy: RFVNTVk=
