# MCM Oathkeeper rules — the route→permission contract for connection-manager-api
# PR#202. Ported verbatim from the image's permissions/oathkeeper-rules.yml into
# Oathkeeper Rule CRDs.
#
# Host is matched non-capturing across BOTH gateways so capture-group indices
# match PR#202 (group 1 = dfspId):
#   mcm.int.${DOMAIN}  internal ops (humans, cookie_session)
#   mcm.ext.${DOMAIN}  DFSP-facing PM4ML machines (jwt)
# Every route accepts cookie_session OR jwt; Keto scopes the caller (a machine
# client is only ever a Dfsp member). Identity headers come from the global
# header mutator (see helmrelease-oathkeeper.yaml).
---
# DFSP list: any authenticated caller; the API scopes rows by X-Roles
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: mcm-api-dfsps-list
  namespace: ory
spec:
  match:
    url: "<http|https>://mcm.<?:int|ext>.${DOMAIN}/api/dfsps<$>"
    methods: [GET]
  authenticators:
    - handler: cookie_session
    - handler: jwt
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://mcm-connection-manager-api.mcm.svc.cluster.local:3001
---
# DFSP create: Hub.dfspManage
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: mcm-api-dfsps-create
  namespace: ory
spec:
  match:
    url: "<http|https>://mcm.<?:int|ext>.${DOMAIN}/api/dfsps<$>"
    methods: [POST]
  authenticators:
    - handler: cookie_session
    - handler: jwt
  authorizer:
    handler: remote_json
    config:
      remote: http://keto-read.ory.svc.cluster.local:80/relation-tuples/check
      payload: |
        {
          "namespace": "Hub",
          "object": "${HUB_PARTICIPANT_NAME}",
          "relation": "dfspManage",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://mcm-connection-manager-api.mcm.svc.cluster.local:3001
---
