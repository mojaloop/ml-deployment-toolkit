# Hub endpoints read: Hub.endpointsView
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: mcm-api-hub-read
  namespace: ory
spec:
  match:
    url: "<http|https>://mcm.<?:int|ext>.${DOMAIN}/api/hub/<.*>"
    methods: [GET]
  authenticators:
    - handler: cookie_session
    - handler: jwt
  # Hub CA / server certs / endpoints are shared connection info that every
  # PM4ML DFSP must read to self-configure (the agent calls /hub/ca,
  # /hub/servercerts, /hub/endpoints). PR#202's OPL gates Hub.endpointsView to
  # hub admins only, which 403s DFSPs — so open reads to any authenticated
  # caller, matching the legacy `dfsp` role's hubEndpointsView. Writes stay admin.
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://mcm-connection-manager-api.mcm.svc.cluster.local:3001
---
