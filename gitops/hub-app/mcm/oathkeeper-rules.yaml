# All DFSPs JWS certs: Hub.jwsCertsView
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: mcm-api-dfsps-jwscerts
  namespace: ory
spec:
  match:
    url: "<http|https>://mcm.<?:int|ext>.${DOMAIN}/api/dfsps/jwscerts<$>"
    methods: [GET]
  authenticators:
    - handler: cookie_session
    - handler: jwt
  # Every DFSP needs all peers' JWS public certs to validate inbound signatures
  # (the agent calls GET /dfsps/jwscerts). Legacy `dfsp` role had dfspJwsCertsView;
  # PR#202 restricts it to hub admins. Open to any authenticated caller (public certs).
  authorizer:
    handler: allow
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://mcm-connection-manager-api.mcm.svc.cluster.local:3001
---
