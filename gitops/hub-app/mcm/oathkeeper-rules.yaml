# Single DFSP read/update: Dfsp.view (member or hub admin)
apiVersion: oathkeeper.ory.sh/v1alpha1
kind: Rule
metadata:
  name: mcm-api-dfsp-view
  namespace: ory
spec:
  match:
    url: "<http|https>://mcm.<?:int|ext>.${DOMAIN}/api/dfsps/<?!jwscerts|servercerts|states-status|endpoints><[^/]+><$>"
    methods: [GET, PUT]
  authenticators:
    - handler: cookie_session
    - handler: jwt
  authorizer:
    handler: remote_json
    config:
      remote: http://keto-read.ory.svc.cluster.local:80/relation-tuples/check
      payload: |
        {
          "namespace": "Dfsp",
          "object": "{{ printIndex .MatchContext.RegexpCaptureGroups 1 }}",
          "relation": "view",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
  upstream:
    preserveHost: false
    url: http://mcm-connection-manager-api.mcm.svc.cluster.local:3001
