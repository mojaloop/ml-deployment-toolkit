# Leaves nothing open. It never mints a DFSP's client credentials: those
# belong to whoever operates that DFSP.
apiVersion: iam.mojaloop.io/v1
kind: AuthzRole
metadata:
  name: hub-admin
  namespace: ory
spec:
  title: Hub administrator
  description: Runs the hub, every portal surface and the operations UIs
  grants:
