# Leaves participant open: MCM assigns it to the machine client it creates for
# a DFSP at onboarding, naming that DFSP.
apiVersion: iam.mojaloop.io/v1
kind: AuthzRole
metadata:
  name: dfsp-client
  namespace: ory
spec:
  title: DFSP machine client
  description: What a DFSP's own systems call MCM and settlement with
  grants:
    - permission: mcm.getAllDfspJWSCerts
    - permission: mcm.createDfspExternalJWSCerts
    - permission: mcm.getHubEndpoints
    - permission: mcm.getHubIngressIps
    - permission: mcm.getHubIngressIpEndpoint
    - permission: mcm.getHubIngressUrls
    - permission: mcm.getHubIngressUrlEndpoint
    - permission: mcm.getHubEgressIps
    - permission: mcm.getHubEgressIpEndpoint
    - permission: mcm.getHubEndpoint
    - permission: mcm.getHubServerCerts
    - permission: mcm.getHubCA
    - permission: mcm.getHubJWSCerts
    - permission: mcm.getDFSPca
    - permission: mcm.setDFSPca
    - permission: mcm.getDFSPInboundEnrollments
    - permission: mcm.createDFSPInboundEnrollment
    - permission: mcm.getDFSPInboundEnrollment
    - permission: mcm.signDFSPInboundEnrollment
    - permission: mcm.getDFSPOutboundEnrollments
    - permission: mcm.createCSRAndDFSPOutboundEnrollment
    - permission: mcm.onboardDFSP
    - permission: mcm.getDFSPOutboundEnrollment
    - permission: mcm.addDFSPOutboundEnrollmentCertificate
    - permission: mcm.validateDFSPOutboundEnrollmentCertificate
    - permission: mcm.getDFSPEndpoints
    - permission: mcm.getUnprocessedDfspItems
    - permission: mcm.getDFSPIngress
    - permission: mcm.createDFSPIngress
    - permission: mcm.getDFSPIngressIps
    - permission: mcm.createDFSPIngressIp
    - permission: mcm.getDFSPIngressIpEndpoint
    - permission: mcm.updateDFSPIngressIpEndpoint
    - permission: mcm.deleteDFSPIngressIpEndpoint
    - permission: mcm.getDFSPIngressUrls
    - permission: mcm.createDFSPIngressUrl
    - permission: mcm.getDFSPIngressUrlEndpoint
    - permission: mcm.updateDFSPIngressUrlEndpoint
    - permission: mcm.deleteDFSPIngressUrlEndpoint
    - permission: mcm.getDFSPEgress
    - permission: mcm.createDFSPEgress
    - permission: mcm.getDFSPEgressIps
    - permission: mcm.createDFSPEgressIp
    - permission: mcm.getDFSPEgressIpEndpoint
    - permission: mcm.updateDFSPEgressIpEndpoint
    - permission: mcm.deleteDFSPEgressIpEndpoint
    - permission: mcm.getDFSPEndpoint
    - permission: mcm.updateDFSPEndpoint
    - permission: mcm.deleteDFSPEndpoint
    - permission: mcm.confirmEndpointItem
    - permission: mcm.getDfspServerCerts
    - permission: mcm.updateDfspServerCerts
    - permission: mcm.createDfspServerCerts
    - permission: mcm.deleteDfspServerCerts
    - permission: mcm.getDfspJWSCerts
    - permission: mcm.createDfspJWSCerts
    - permission: mcm.deleteDfspJWSCerts
    - permission: mcm.getDfspStatus
    - permission: mcm.uploadDfspStatesStatus
    - permission: settlement.getSettlementWindowById
    - permission: settlement.getSettlementWindowsByParams
    - permission: settlement.getSettlementsByParams
    - permission: settlement.getSettlementById
    - permission: settlement.getSettlementBySettlementParticipant
    - permission: settlement.updateSettlementBySettlementParticipant
    - permission: settlement.getSettlementBySettlementParticipantAccount
    - permission: settlement.updateSettlementBySettlementParticipantAccount
