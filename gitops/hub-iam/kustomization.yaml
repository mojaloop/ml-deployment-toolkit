apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - iam/sources.yaml
  - iam/externalsecret-kratos.yaml
  - iam/externalsecret-keto.yaml
  - iam/externalsecret-hydra.yaml
  - iam/roles.yaml
  - iam/helmrelease.yaml
  - routes/referenceGrants.yaml

# Distribution values for the iam HelmRelease, rendered into a ConfigMap it
# references first in valuesFrom; the adopter's override is merged after and
# wins.
configMapGenerator:
  - name: iam-values
    namespace: flux-system
    files:
      - values.yaml=values/iam.yaml
generatorOptions:
  disableNameSuffixHash: true
