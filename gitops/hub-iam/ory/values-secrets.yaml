# Secret half of the Ory distribution values: the DSNs, split out of
# values/ory/{hydra,keto,kratos}.yaml so no secret token ever passes through
# a ConfigMap. stringData, not a secretGenerator — kustomize generators
# base64-encode, hiding the substitution tokens from Flux's post-build substitution.
# Each is merged by its HelmRelease directly after the distribution
# ConfigMap, so template and environment overrides still win.
apiVersion: v1
kind: Secret
metadata:
  name: hydra-values-secret
  namespace: flux-system
type: Opaque
stringData:
  values.yaml: |
    hydra:
      config:
        dsn: "mysql://hydra:${HYDRA_DB_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/hydra?max_conns=20&max_idle_conns=4"
---
apiVersion: v1
kind: Secret
metadata:
  name: keto-values-secret
  namespace: flux-system
type: Opaque
stringData:
  values.yaml: |
    keto:
      config:
        dsn: "mysql://keto:${KETO_DB_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/keto?max_conns=20&max_idle_conns=4"
---
apiVersion: v1
kind: Secret
metadata:
  name: kratos-values-secret
  namespace: flux-system
type: Opaque
stringData:
  values.yaml: |
    kratos:
      config:
        dsn: "mysql://kratos:${KRATOS_DB_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/kratos?max_conns=20&max_idle_conns=4"
        courier:
          smtp:
            from_address: "${SMTP_USER}"
