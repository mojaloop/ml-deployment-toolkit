# Unified Keto OPL (Ory Permission Language) for the whole hub.
#
# Keto loads ONE namespace model. Two apps share this cluster:
#   * MCM (connection-manager-api PR#202) — needs computed permissions
#     (Hub.dfspManage, Dfsp.view = members OR parent-hub admin). These are
#     verbatim from the image's permissions/mcm.keto.ts.
#   * Finance Portal / BOF — needs the legacy role/permission RBAC, where the
#     security-role-perm-operator writes:
#       permission:<perm>#granted@(role:<role>#member)
#       role:<role>#member@<subjectId>
#     A check on the `granted` relation expands the role subject-set natively;
#     no permit rewrite is required for it.
#
# Namespace names MUST match the tuples already stored: User/Hub/Dfsp and the
# lowercase role/permission/participant.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keto-opl
  namespace: ory
data:
  mcm.keto.ts: |
    import { Namespace, SubjectSet, Context } from "@ory/keto-namespace-types"

    // ── Shared subject ────────────────────────────────────────────────
    class User implements Namespace {}

    // ── MCM model (verbatim from connection-manager-api/permissions/mcm.keto.ts)
    class Hub implements Namespace {
      related: {
        admins: User[]
      }

      permits = {
        admin:             (ctx: Context): boolean => this.related.admins.includes(ctx.subject),
        dfspList:          (ctx: Context): boolean => this.permits.admin(ctx),
        dfspManage:        (ctx: Context): boolean => this.permits.admin(ctx),
        monetaryZonesView: (ctx: Context): boolean => this.permits.admin(ctx),
        jwsCertsView:      (ctx: Context): boolean => this.permits.admin(ctx),
        serverCertsView:   (ctx: Context): boolean => this.permits.admin(ctx),
        endpointsView:     (ctx: Context): boolean => this.permits.admin(ctx),
        endpointsManage:   (ctx: Context): boolean => this.permits.admin(ctx),
      }
    }

    class Dfsp implements Namespace {
      related: {
        parent: Hub[]
        members: User[]
      }

      permits = {
        view: (ctx: Context): boolean =>
          this.related.members.includes(ctx.subject) ||
          this.related.parent.traverse((h) => h.permits.admin(ctx)),

        manage: (ctx: Context): boolean =>
          this.related.members.includes(ctx.subject) ||
          this.related.parent.traverse((h) => h.permits.admin(ctx)),

        memberAccess: (ctx: Context): boolean =>
          this.related.members.includes(ctx.subject),

        credentialsAccess: (ctx: Context): boolean =>
          this.related.members.includes(ctx.subject),
      }
    }

    // ── Finance Portal / BOF RBAC ─────────────────────────────────────
    // `member` and `granted` are plain relations; Keto expands the
    // role subject-set when checking `permission:<x>#granted`.
    class role implements Namespace {
      related: {
        member: User[]
      }
    }

    class permission implements Namespace {
      related: {
        granted: (User | SubjectSet<role, "member">)[]
      }
    }

    class participant implements Namespace {
      related: {
        member: User[]
      }
    }
