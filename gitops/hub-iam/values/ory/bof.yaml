# Distribution values for the bof HelmRelease.
# Adopter overrides go in environments/<env>/values/bof.yaml,
# which is merged after this file and therefore wins.
global:
  keto:
    readURL: "http://keto-read:80"
    writeURL: "http://keto-write:80"
  rolePermOperator:
    mojaloopRole: {}
    mojaloopPermissionExclusion: {}
    apiSvc: {}

security-role-perm-operator-svc:
  enabled: true
  ingress:
    enabled: false

security-hub-bop-api-svc:
  enabled: false
security-hub-bop-kratos-svc:
  enabled: false
security-hub-bop-shell-svc:
  enabled: false
