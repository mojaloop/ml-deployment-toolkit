          issuer: https://hydra.ext.${DOMAIN}

# Browsers (accept text/html) get the Kratos login redirect, machines the
# json 401
oathkeeper:
  oathkeeper:
    config:
      authorizers:
        remote_json:
          config:
            remote: http://iam-ml-iam-services-decision/
      errors:
        fallback:
          - redirect
          - json
        handlers:
          redirect:
            enabled: true
            config:
              to: https://kratos.int.${DOMAIN}/self-service/login/browser
              return_to_query_param: return_to

# Kratos self-service UI at auth.<domain>, the browser talks to kratos.<domain>
kratos-ui:
  enabled: true
  kratosPublicUrl: http://kratos-public
  kratosBrowserUrl: https://kratos.int.${DOMAIN}
  projectName: Mojaloop Hub
  config:
    csrfCookieName: hub_csrf_token

# IdP surfaces: humans on the internal gateway, hydra (machine tokens) on
# the external one; these routes authenticate so they bypass Oathkeeper
gateway:
  enabled: true
  parentRefs:
    - name: gw-int
      namespace: platform-system
  hosts:
    kratos: kratos.int.${DOMAIN}
    auth: auth.int.${DOMAIN}
    # Renders only where the mail catcher is enabled (dev templates)
    mailpit: mailpit.int.${DOMAIN}
    hydra:
      host: hydra.ext.${DOMAIN}
      parentRefs:
        - name: gw-ext
          namespace: platform-system
  # Every namespace whose HTTPRoutes delegate auth to Oathkeeper through the
  # ExternalAuth filter
  oathkeeperConsumerNamespaces:
    - mcm
    - finance-portal
    - mojaloop
    - flux-system
    - goldilocks
    - cilium
