# Who may reach the provisioning process.
#
# It holds the platform's only Keto write URL and Kratos admin credentials, and
# its API carries role assignment, so reachability is the whole of its access
# control: it authenticates nothing and is fronted by no gateway. Its callers —
# the role administration service that fronts it for operators, and a service
# naming a resource it has created — carry iam.mojaloop.io/provisioning-client
# on their pods, set by their charts, and run in a namespace the deployment
# labels the same, so both the workload and the deployment consent.
#
# Admin tier, so no namespaced NetworkPolicy can widen this. The callers Pass
# rather than Accept: Accept would end evaluation here and stop a service's own
# chart from narrowing them further, while Pass hands them to the NetworkPolicy
# tier with that option intact. Everything else is denied in the one tier
# nothing overrides.
apiVersion: policy.networking.k8s.io/v1alpha2
kind: ClusterNetworkPolicy
metadata:
  name: iam-provisioning-callers
spec:
  tier: Admin
  priority: 10
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ory
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ml-iam-services
          app.kubernetes.io/component: provisioning
  ingress:
    - name: provisioning-clients
      action: Pass
      from:
        - pods:
            namespaceSelector:
              matchLabels:
                iam.mojaloop.io/provisioning-client: "true"
            podSelector:
              matchLabels:
                iam.mojaloop.io/provisioning-client: "true"
    - name: nothing-else
      action: Deny
      from:
        - namespaces: {}
