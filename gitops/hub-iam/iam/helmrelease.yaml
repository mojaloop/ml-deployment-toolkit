apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: iam
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: mojaloop-iam
      sourceRef:
        kind: GitRepository
        name: mojaloop-helm-git
      reconcileStrategy: Revision
      interval: 2m
  releaseName: iam
  targetNamespace: ory
  timeout: 20m
  # The AuthzDocument CRD ships in the chart's crds/, which Helm leaves alone
  # on upgrade; the release owns its schema
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
      strategy: uninstall
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: iam-values
      valuesKey: values.yaml
    # The deployment's role document
    - kind: ConfigMap
      name: iam-roles-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: ory-iam-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: ory-iam-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: ory-iam-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: ory-iam-values-override
      valuesKey: values.yaml
      optional: true
