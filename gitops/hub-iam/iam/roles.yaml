# The deployment's role document, fed to the iam HelmRelease as a values
# fragment. The provisioning service validates every permission id here
# against the catalog the rollout composed, so a typo or a permission no
# service offers stops the install.
#
# hub-admin runs the hub, every portal surface and the operations UIs, but
# never mints a DFSP's client credentials: those belong to whoever operates
# that DFSP.
# dfsp-operator and dfsp-client take a dfspId, which binds their grants to one
# participant; a DFSP's creation instantiates them for that participant.
# intapi-client is what an operator-tool machine client holds: create its
# Hydra client, then assign this role to the client id.
apiVersion: v1
kind: ConfigMap
metadata:
  name: iam-roles-values
  namespace: flux-system
data:
  values.yaml: |
    global:
      iamRoles:
        roles:
          hub-admin:
            grants:
              - { permission: mcm.getHubEndpoints }
              - { permission: mcm.getHubIngressIps }
              - { permission: mcm.createHubIngressIp }
              - { permission: mcm.getHubIngressIpEndpoint }
