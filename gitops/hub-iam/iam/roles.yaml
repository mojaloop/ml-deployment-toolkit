# The deployment's role document, fed to the iam HelmRelease as a values
# fragment. The provisioning service validates every permission id here
# against the catalog the rollout composed, so a typo or a permission no
# service offers stops the install.
#
# A grant either names the resources of a scoped resource name
# (resources: { Participant: all }) or leaves the name open, and every open
# one is the assignment's to name.
# hub-admin leaves nothing open; it runs the hub, every portal surface and
# the operations UIs, but never mints a DFSP's client credentials: those
# belong to whoever operates that DFSP.
# dfsp-operator and dfsp-client leave Participant open, so each assignment
# names the one DFSP the instance is about; MCM makes those assignments at
# onboarding with the resource name and role names it was configured with.
# intapi-client is what an operator-tool machine client holds: create its
# Hydra client, then assign this role to the client id.
apiVersion: v1
kind: ConfigMap
metadata:
  name: iam-roles-values
  namespace: flux-system
data:
  values.yaml: |
