# Chart sources for the platform.
#
# The two charts this work still changes are built from their branches, so a
# chart fix reaches a cluster on the next reconcile instead of a publish. What
# runs is then a commit rather than a version: both revert to the published
# repositories below, pinned by version, once the charts settle.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mojaloop-charts-git
  namespace: flux-system
spec:
  interval: 2m
  url: https://github.com/mojaloop/charts.git
  ref:
    branch: feat/iam-document-authz
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mojaloop-helm-git
  namespace: flux-system
spec:
  interval: 2m
  url: https://github.com/mojaloop/helm.git
  ref:
    branch: feat/iam-document-authz
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mojaloop
  namespace: flux-system
spec:
  interval: 12h
  url: https://mojaloop.github.io/helm/repo
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mojaloop-charts
  namespace: flux-system
spec:
  interval: 12h
  url: https://mojaloop.github.io/charts/repo
