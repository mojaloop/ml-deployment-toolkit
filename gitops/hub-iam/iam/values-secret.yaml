# Secret half of the iam distribution values: every credential-bearing key,
# split out of values/ory/iam.yaml so no secret token ever passes through a
# ConfigMap (check-secret-placement covers generator inputs too). stringData,
# not a secretGenerator: kustomize generators base64-encode file content,
# which would hide the substitution tokens from Flux's post-build
# substitution. Merged by the HelmRelease directly after the distribution
# ConfigMaps, so template and environment overrides still win.
apiVersion: v1
kind: Secret
metadata:
  name: iam-values-secret
  namespace: flux-system
type: Opaque
stringData:
  values.yaml: |
    kratos:
      kratos:
        config:
          courier:
            smtp:
              from_address: "${SMTP_USER}"
