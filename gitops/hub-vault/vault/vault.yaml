apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
# RBAC: allow vault SA to manage secrets in vault ns (for unseal keys)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-secrets
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-secrets
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: Role
  name: vault-secrets
  apiGroup: rbac.authorization.k8s.io
---
# RBAC: allow vault SA to review tokens (for Kubernetes auth method)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
  namespace: vault
spec:
  size: 3
  image: hashicorp/vault:1.21.4
  bankVaultsImage: ghcr.io/bank-vaults/bank-vaults:v1.31.3

  serviceType: ClusterIP
  serviceAccount: vault

  # Auto-unseal using K8s secret (operator stores unseal keys automatically)
  unsealConfig:
    options:
      preFlightChecks: true
    kubernetes:
      secretNamespace: vault

  # Vault server configuration
  config:
    # Required explicitly since Vault 1.20 (fresh starts refuse to boot without it).
    # True is correct on k8s: no IPC_LOCK cap needed; Talos nodes run swapless.
    disable_mlock: true
    storage:
      raft:
        path: "/vault/file"
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_disable: true
    telemetry:
      statsd_address: localhost:9125
    api_addr: http://vault.vault:8200
    cluster_addr: "http://$${.Env.POD_NAME}:8201"
    ui: true
    serviceRegistrationEnabled: true

  # Declarative Vault configuration (applied by bank-vaults sidecar after unseal)
  externalConfig:
    policies:
      - name: pki-sign-server
        rules: |
          path "pki/sign/server-cert-role" {
            capabilities = ["create", "update"]
          }
      - name: mcm-policy
        # WHY KV-v1 paths (secret/X) instead of KV-v2 (secret/data/X):
        # MCM API v2.x uses node-vault which writes directly to secret/mcm/... paths.
        # It does NOT prepend "data/" as KV-v2 requires. Using KV-v2 causes 403 errors
        # on DFSP creation (the API writes to secret/mcm/dfsp-outbound-enrollment/...).
        # The secret/ mount is therefore configured as KV-v1 below to match MCM's behavior.
        # The vault-agent templates also use KV-v1 paths for the same reason.
        rules: |
          path "pki/*" {
            capabilities = ["create", "read", "update", "delete", "list", "sudo"]
          }
          path "secret/mcm/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "secret/whitelist*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "secret/onboarding_pm4mls*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
      - name: allow_secrets
        rules: |
          path "secret/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
      - name: raft-snapshot
        rules: |
          path "sys/storage/raft/snapshot" {
            capabilities = ["read"]
          }

    auth:
      - type: kubernetes
        roles:
          - name: vault-backup
            bound_service_account_names:
              - vault-backup
            bound_service_account_namespaces:
              - vault
            policies: raft-snapshot
            ttl: 15m
          - name: mcm
            bound_service_account_names:
              - mcm
              - connection-manager-api
              - mcm-connection-manager-api
              - vault-agent
            bound_service_account_namespaces:
              - mcm
            policies: mcm-policy
            ttl: 768h
          - name: cert-manager-vault-issuer
            bound_service_account_names:
              - vault-pki-issuer
            bound_service_account_namespaces:
              - cert-manager
            policies: pki-sign-server
            ttl: 1h
          - name: external-secrets
            bound_service_account_names:
              - external-secrets-external-secrets
            bound_service_account_namespaces:
              - external-secrets
            policies: allow_secrets
            ttl: 1h

    secrets:
      # WHY KV-v1 (not KV-v2): MCM API v2.x uses node-vault which calls
      # vault.write("secret/mcm/...") — the KV-v1 convention. KV-v2 requires
      # "secret/data/..." paths which MCM doesn't generate. Using KV-v2 causes
      # permission denied (403) errors on every DFSP creation.
      # Both MCM API and the vault-agent templates use KV-v1 paths accordingly.
      - path: secret
        type: kv
        description: "KV-v1 secret store (MCM API requires v1 paths)"
        options:
          version: 1
      - path: pki
        type: pki
        description: "MCM PKI for DFSP certificates"
        config:
          max_lease_ttl: 87600h
        configuration:
          config:
            - name: urls
              issuing_certificates: "http://vault.vault:8200/v1/pki/ca"
              crl_distribution_points: "http://vault.vault:8200/v1/pki/crl"
          root/generate:
            - name: internal
              common_name: "Mojaloop Hub CA"
              key_type: rsa
              key_bits: 4096
              ttl: 87600h
              organization: "Mojaloop"
              exclude_cn_from_sans: true
              create_only: true
          roles:
            - name: server-cert-role
              allowed_domains:
                - "${DOMAIN}"
              allow_subdomains: true
              max_ttl: 43800h
              key_type: rsa
              key_bits: 4096
            - name: client-cert-role
              allow_any_name: true
              max_ttl: 43800h
              client_flag: true
              server_flag: false
              key_type: rsa
              key_bits: 4096

    # startupSecrets: seeded by bank-vaults on first boot.
    # WHY secret/X (not secret/data/X): KV-v1 paths — no "data/" prefix in the path.
    # WHY nested data.data: bank-vaults' internal decoder always expects the "data:" wrapper
    # around the actual key-value pairs, regardless of KV version. This is a bank-vaults
    # convention, not a Vault API requirement. Without it, the decoder rejects the keys
    # as "invalid" (it only recognizes well-known fields like "data" and "options" at top level).
    startupSecrets:
      - type: kv
        path: secret/kratos
        data:
          data:
            dsn: "mysql://kratos:${KRATOS_DB_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/kratos?max_conns=20&max_idle_conns=4"
            secretsCipher: "${KRATOS_SECRETS_CIPHER}"
            secretsCookie: "${KRATOS_SECRETS_COOKIE}"
            secretsCSRFCookie: "${KRATOS_SECRETS_CSRF_COOKIE}"
            secretsDefault: "${KRATOS_SECRETS_DEFAULT}"
            # Defaults keep the URI well-formed with no relay configured:
            # kratos boots and courier fails per-delivery instead.
            smtpConnectionURI: "smtp://${SMTP_USER:-mail}:${SMTP_PASSWORD:-mail}@${SMTP_HOST:-localhost}:${SMTP_PORT:-25}/?skip_ssl_verify=true"
      - type: kv
        path: secret/keto
        data:
          data:
            dsn: "mysql://keto:${KETO_DB_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/keto?max_conns=20&max_idle_conns=4"
      - type: kv
        path: secret/hydra
        data:
          data:
            dsn: "mysql://hydra:${HYDRA_DB_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/hydra?max_conns=20&max_idle_conns=4"
            secretsSystem: "${HYDRA_SECRETS_SYSTEM}"
            secretsCookie: "${HYDRA_SECRETS_COOKIE}"
      - type: kv
        path: secret/finance-portal
        data:
          data:
            role_assign_svc_secret: "${ROLE_ASSIGN_SVC_SECRET}"
            mongodb_app_password: "${MONGODB_APP_PASSWORD}"

  # Persistent storage for Vault data (Raft integrated storage)
  volumeMounts:
    - name: vault-raft
      mountPath: /vault/file

  volumeClaimTemplates:
    - metadata:
        name: vault-raft
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
