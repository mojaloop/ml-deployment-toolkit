apiVersion: v1
kind: Secret
metadata:
  name: mojaloop-db-secrets
  namespace: data
type: Opaque
stringData:
  root: "${MYSQL_ROOT_PASSWORD}"
  xtrabackup: "${MYSQL_ROOT_PASSWORD}"
  monitor: "${MYSQL_ROOT_PASSWORD}"
  operator: "${MYSQL_ROOT_PASSWORD}"
  replication: "${MYSQL_ROOT_PASSWORD}"
---
# Per-database app passwords. Lives in the data ns for PXC spec.users[].passwordSecretRef
# (operator only reads secrets in its own namespace) and is mirrored into every namespace
# whose pods reference db_secret.name: mysqldb — mojaloop (ALS, oracle-msisdn) and
# finance-portal (the reporting APIs).
#
# There is no mirroring controller: each copy below is a separate manifest interpolating
# the same substitution variable, so the source of truth is the variable, not any one copy.
# Keep every copy HERE. A mysqldb copy declared next to its consumer is a copy nobody finds
# when the password rotates. A release needing its OWN MySQL user (MCM) is a different case
# and rightly owns its secret beside its HelmRelease.
apiVersion: v1
kind: Secret
metadata:
  name: mysqldb
  namespace: data
type: Opaque
stringData:
  mysql-password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
  mysql-als-password: "${MYSQL_ACCOUNT_LOOKUP_PASSWORD}"
  mysql-oracle-password: "${MYSQL_ORACLE_MSISDN_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: mysqldb
  namespace: mojaloop
type: Opaque
stringData:
  mysql-password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
  mysql-als-password: "${MYSQL_ACCOUNT_LOOKUP_PASSWORD}"
  mysql-oracle-password: "${MYSQL_ORACLE_MSISDN_PASSWORD}"
---
# Finance Portal reads the central_ledger database directly (reporting-legacy-api,
# reporting-hub-bop-api-svc, reporting-aggregator-svc) through global.reportingDB.secret.
# Only mysql-password is mirrored: it never touches the account_lookup or oracle_msisdn
# databases, so copying those keys here would widen the blast radius for no consumer.
apiVersion: v1
kind: Secret
metadata:
  name: mysqldb
  namespace: finance-portal
type: Opaque
stringData:
  mysql-password: "${MYSQL_CENTRAL_LEDGER_PASSWORD}"
---
# Auth database application user passwords (referenced by PXC spec.users[].passwordSecretRef)
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-app-secrets
  namespace: data
type: Opaque
stringData:
  kratos-password: "${KRATOS_DB_PASSWORD}"
  keto-password: "${KETO_DB_PASSWORD}"
  hydra-password: "${HYDRA_DB_PASSWORD}"
  mcm-password: "${MCM_DB_PASSWORD}"
