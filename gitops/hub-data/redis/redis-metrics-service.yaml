apiVersion: v1
kind: Service
metadata:
  name: ttk-redis-metrics
  namespace: data
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
    prometheus.io/path: "/metrics"
spec:
  clusterIP: None
  selector:
    app: ttk-redis
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121
      protocol: TCP
