# htpasswd for the obs-ingest front, rendered from the credential pair the
# environment's .env seeds into Vault (secret/data/obs-ingest, see
# tooling-config/vault/vault.yaml). sprig's htpasswd emits a bcrypt entry —
# the nginx image is Debian-based (libxcrypt), which verifies bcrypt; an
# Alpine/musl nginx would not.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obs-ingest-htpasswd
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: obs-ingest-htpasswd
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        htpasswd: '{{ htpasswd .username .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/obs-ingest
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/obs-ingest
        property: password
