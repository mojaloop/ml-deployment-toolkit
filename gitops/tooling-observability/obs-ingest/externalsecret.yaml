# htpasswd for the obs-ingest front: one entry per ingest account declared
# under observability.ingest_users, from the base64 JSON the cluster seeds
# into Vault (secret/data/obs-ingest, see tooling-config/vault/vault.yaml).
# No accounts declared renders an empty htpasswd — nginx then denies every
# request, fail-closed. sprig's htpasswd emits a bcrypt entry — the nginx
# image is Debian-based (libxcrypt), which verifies bcrypt; an Alpine/musl
# nginx would not.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obs-ingest-htpasswd
  namespace: t7y-backend
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: obs-ingest-htpasswd
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        htpasswd: '{{ range .users | b64dec | mustFromJson }}{{ htpasswd .name .password "bcrypt" }}{{ "\n" }}{{ end }}'
  data:
    - secretKey: users
      remoteRef:
        key: secret/data/obs-ingest
        property: usersJson
