# nginx server config for the obs-ingest front. Mounted over the image's
# conf.d/ so the stock default server is replaced; the image's main nginx.conf
# (pid and temp paths under /tmp — the unprivileged variant) stays in charge.
apiVersion: v1
kind: ConfigMap
metadata:
  name: obs-ingest-nginx
  namespace: t7y-backend
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        # Remote-write / push bodies arrive snappy- or gzip-compressed but can
        # still be MB-sized under load-test burst. Bounded, not unlimited.
        client_max_body_size 64m;

        auth_basic "observability ingest";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kubelet probes only — never routed from a gateway.
        location = /healthz {
            auth_basic off;
            access_log off;
            return 200;
        }

        # Ingest paths ONLY. Query APIs (thanos-query, tempo :3200, loki reads)
        # are deliberately absent: Grafana queries in-cluster, nothing outside
        # the tooling cluster reads telemetry back.
        location /api/v1/receive {
            proxy_pass http://thanos-receive.t7y-backend.svc.cluster.local:19291;
        }
        location /api/v1/otlp {
            proxy_pass http://thanos-receive.t7y-backend.svc.cluster.local:19291;
        }
        location /loki/api/v1/push {
            proxy_pass http://loki-gateway.t7y-backend.svc.cluster.local:80;
        }
        location /v1/traces {
            proxy_pass http://tempo.t7y-backend.svc.cluster.local:4318;
        }

        location / {
            return 404;
        }
    }
