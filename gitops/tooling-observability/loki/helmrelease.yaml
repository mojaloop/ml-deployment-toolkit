apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "7.2.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 12h
  releaseName: loki
  targetNamespace: t7y-backend
  install:
    createNamespace: false
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
    - name: minio
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: loki-values
      valuesKey: values.yaml
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: accessKey
      targetPath: loki.storage.s3.accessKeyId
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: secretKey
      targetPath: loki.storage.s3.secretAccessKey
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: accessKey
      targetPath: loki.structuredConfig.storage_config.aws.access_key_id
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: secretKey
      targetPath: loki.structuredConfig.storage_config.aws.secret_access_key
    - kind: ConfigMap
      name: t7y-backend-loki-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: t7y-backend-loki-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: t7y-backend-loki-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: t7y-backend-loki-values-override
      valuesKey: values.yaml
      optional: true
