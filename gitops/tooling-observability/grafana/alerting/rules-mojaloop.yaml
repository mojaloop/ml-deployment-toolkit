apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules-mojaloop
  namespace: t7y-backend
  labels:
    grafana_alert: "1"
data:
  rules-mojaloop.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: mojaloop
        folder: Alerts
        interval: 1m
        rules:
          - uid: transfer-p99-slo
            title: Transfer E2E p99 above 1s SLO
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: thanos
                model:
                  expr: histogram_quantile(0.99, sum by (cluster_name, le) (rate(moja_tx_transfer_bucket[5m])))
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  refId: C
                  conditions:
                    - evaluator: { type: gt, params: [1] }
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: 'E2E transfer p99 latency in {{ $labels.cluster_name }} above the 1s SLO for 10m.'
          - uid: transfer-failures
            title: Transfers failing
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: thanos
                model:
                  expr: sum by (cluster_name) (rate(moja_tx_transfer_count{success="false"}[5m]))
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  refId: C
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Transfers are failing in {{ $labels.cluster_name }} (sustained 5m).'
          - uid: kafka-consumer-lag
            title: Kafka consumer lag high
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: thanos
                model:
                  expr: max by (cluster_name, consumergroup) (kafka_consumergroup_lag)
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  refId: C
                  conditions:
                    - evaluator: { type: gt, params: [1000] }
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'Consumer group {{ $labels.consumergroup }} in {{ $labels.cluster_name }} lag above 1000 for 10m — transfers are queueing.'
