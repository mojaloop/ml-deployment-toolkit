apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 12h
  releaseName: grafana
  targetNamespace: observability
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  dependsOn:
    - name: loki
    - name: tempo
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: grafana-values
      valuesKey: values.yaml
    # Secret half of the distribution values (credential-bearing keys) —
    # merged right after them; template/environment overrides still win.
    - kind: Secret
      name: grafana-values-secret
      valuesKey: values.yaml
    - kind: ConfigMap
      name: observability-grafana-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: observability-grafana-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: observability-grafana-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: observability-grafana-values-override
      valuesKey: values.yaml
      optional: true
