apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-kubernetes-cluster
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Infrastructure"
data:
  kubernetes-cluster.json: |
    {
      "uid": "infra-k8s-cluster",
      "title": "Kubernetes Cluster",
      "description": "Cluster-wide health: node conditions, pod phases, resource allocation, PVC usage",
      "tags": ["infrastructure", "kubernetes"],
      "timezone": "utc",
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "cluster_name",
            "type": "query",
            "datasource": { "uid": "thanos" },
            "query": "label_values(kube_node_info, cluster_name)",
            "refresh": 2,
            "includeAll": false,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "title": "Nodes Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum(kube_node_status_condition{cluster_name=\"$cluster_name\", condition=\"Ready\", status=\"true\"})",
              "legendFormat": "ready"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Nodes NotReady",
          "type": "stat",
          "gridPos": { "h": 4, "w": 3, "x": 3, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_node_info{cluster_name=\"$cluster_name\"}) - sum(kube_node_status_condition{cluster_name=\"$cluster_name\", condition=\"Ready\", status=\"true\"})",
              "legendFormat": "not ready"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Pods Running",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 6, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "green" } } },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{cluster_name=\"$cluster_name\", phase=\"Running\"})",
              "legendFormat": "running"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Pods Pending",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 10, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{cluster_name=\"$cluster_name\", phase=\"Pending\"}) or vector(0)",
              "legendFormat": "pending"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Pods Failed",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 14, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{cluster_name=\"$cluster_name\", phase=\"Failed\"}) or vector(0)",
              "legendFormat": "failed"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Container Restarts ($__range)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 3, "x": 18, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 20 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{cluster_name=\"$cluster_name\"}[$__range]))",
              "legendFormat": "restarts"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "OOM Kills ($__range)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 3, "x": 21, "y": 0 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(increase(container_oom_events_total{cluster_name=\"$cluster_name\"}[$__range])) or vector(0)",
              "legendFormat": "OOMKilled"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none" }
        },
        {
          "title": "Cluster CPU Allocation",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "uid": "thanos" },
          "description": "CPU requests and limits vs allocatable capacity",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "sum(kube_node_status_allocatable{cluster_name=\"$cluster_name\", resource=\"cpu\"})",
              "legendFormat": "allocatable"
            },
            {
              "expr": "sum(kube_pod_container_resource_requests{cluster_name=\"$cluster_name\", resource=\"cpu\"})",
              "legendFormat": "requests"
            },
            {
              "expr": "sum(kube_pod_container_resource_limits{cluster_name=\"$cluster_name\", resource=\"cpu\"})",
              "legendFormat": "limits"
            },
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{cluster_name=\"$cluster_name\", image!=\"\"}[$__rate_interval]))",
              "legendFormat": "actual usage"
            }
          ]
        },
        {
          "title": "Cluster Memory Allocation",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "uid": "thanos" },
          "description": "Memory requests and limits vs allocatable capacity",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "sum(kube_node_status_allocatable{cluster_name=\"$cluster_name\", resource=\"memory\"})",
              "legendFormat": "allocatable"
            },
            {
              "expr": "sum(kube_pod_container_resource_requests{cluster_name=\"$cluster_name\", resource=\"memory\"})",
              "legendFormat": "requests"
            },
            {
              "expr": "sum(kube_pod_container_resource_limits{cluster_name=\"$cluster_name\", resource=\"memory\"})",
              "legendFormat": "limits"
            },
            {
              "expr": "sum(container_memory_working_set_bytes{cluster_name=\"$cluster_name\", image!=\"\"})",
              "legendFormat": "actual usage"
            }
          ]
        },
        {
          "title": "Container Restarts Over Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 10, "drawStyle": "bars" }
            }
          },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{cluster_name=\"$cluster_name\"}[$__rate_interval]) > 0",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "title": "PVC Utilization",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "uid": "thanos" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.7 },
                  { "color": "red", "value": 0.85 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "kubelet_volume_stats_used_bytes{cluster_name=\"$cluster_name\"} / kubelet_volume_stats_capacity_bytes{cluster_name=\"$cluster_name\"}",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"
            }
          ]
        },
        {
          "title": "Node Conditions",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "uid": "thanos" },
          "targets": [
            {
              "expr": "kube_node_status_condition{cluster_name=\"$cluster_name\", condition=~\"Ready|MemoryPressure|DiskPressure|PIDPressure\", status=\"true\"} == 1",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true, "cluster_name": true, "job": true, "service": true, "instance": true, "status": true, "Value": true },
                "renameByName": { "node": "Node", "condition": "Condition" }
              }
            }
          ]
        }
      ],
      "schemaVersion": 39
    }
