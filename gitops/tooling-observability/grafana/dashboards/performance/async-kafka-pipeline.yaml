# Async & Kafka Pipeline — is the latency execution, or waiting?
#
# THIS IS THE BLIND SPOT IN EVERY SPAN-BASED VIEW. A span measures how long a
# handler ran once it was given a message. It cannot see the message sitting
# in a partition waiting to be picked up. If the stage durations on Hub
# Latency Breakdown sum to far less than the hub legs on Transfer SLO, the
# missing time is here.
#
# THE PANEL THAT MATTERS is "Estimated queue wait": consumer lag divided by
# the consume rate, which converts a message count into the seconds a message
# will sit before being handled. Lag alone is not a latency — 500 messages
# behind at 500 msg/s is one second; at 5 msg/s it is a hundred.
#
# CARDINALITY. kafka_consumergroup_lag is per topic AND per partition, and
# this cluster carries ~67k kafka series. Every panel here aggregates to
# topic+consumergroup using the pre-summed _sum variants where they exist.
# Per-partition detail is confined to one panel, gated behind $topic, because
# that is where partition skew shows up and nowhere else. Do not remove the
# $topic filter from it.
#
# Audit and trace topics (topic-event-*) are excluded from the transfer-path
# panels: they carry the Event SDK's own traffic, dominate message volume and
# tell you nothing about transfer latency.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-perf-async-kafka-pipeline
  namespace: t7y-backend
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Performance"
data:
  async-kafka-pipeline.json: |
    {
      "uid": "perf-async",
      "title": "Async & Kafka Pipeline",
      "description": "Queue time between hub hops: consumer lag translated into seconds of wait, produce vs consume balance, partition skew and broker health. The half of hub latency that span metrics structurally cannot measure.",
      "tags": ["performance", "kafka", "mojaloop"],
      "timezone": "utc",
      "editable": true,
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "hub",
            "label": "Hub cluster",
            "type": "query",
            "datasource": { "uid": "thanos" },
            "query": "label_values(kafka_consumergroup_lag, cluster_name)",
            "refresh": 2,
            "includeAll": false,
            "current": {}
          },
          {
            "name": "topic",
            "label": "Topic (partition detail)",
            "type": "query",
            "datasource": { "uid": "thanos" },
            "query": "label_values(kafka_consumergroup_lag{cluster_name=\"$hub\"}, topic)",
            "refresh": 2,
            "includeAll": false,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "title": "Worst queue wait",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": { "uid": "thanos" },
          "description": "The longest estimated wait across all transfer-path consumer groups. This is time a transfer spends doing nothing. Compare directly against the SLO — if this alone exceeds it, no amount of handler tuning will help.",
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.25 }, { "color": "red", "value": 1 } ] } } },
          "targets": [
            {
              "expr": "max(sum by (topic, consumergroup) (kafka_consumergroup_lag_sum{cluster_name=\"$hub\", topic!~\"topic-event-.*\"}) / clamp_min(sum by (topic, consumergroup) (rate(kafka_consumergroup_current_offset_sum{cluster_name=\"$hub\", topic!~\"topic-event-.*\"}[$__rate_interval])), 0.001))",
              "legendFormat": "worst wait"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Total lag (transfer path)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "datasource": { "uid": "thanos" },
          "description": "Messages waiting across all transfer-path topics. A raw count — read it together with the queue wait panel, which converts it into time.",
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 100 }, { "color": "red", "value": 1000 } ] } } },
          "targets": [
            {
              "expr": "sum(kafka_consumergroup_lag_sum{cluster_name=\"$hub\", topic!~\"topic-event-.*\"})",
              "legendFormat": "messages waiting"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Under-replicated partitions",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "datasource": { "uid": "thanos" },
          "description": "Non-zero means the cluster is replicating rather than serving, which shows up as produce latency. Almost always the first thing to check after a broker restart or a node eviction.",
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } },
          "targets": [
            { "expr": "sum(kafka_cluster_partition_underreplicated{cluster_name=\"$hub\"}) or vector(0)", "legendFormat": "under-replicated" }
          ],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Brokers up",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "datasource": { "uid": "thanos" },
          "description": "Broker count. A drop here explains almost any latency anomaly on this dashboard.",
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } } },
          "targets": [
            { "expr": "max(kafka_brokers{cluster_name=\"$hub\"})", "legendFormat": "brokers" }
          ],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Estimated queue wait by topic",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 5 },
          "datasource": { "uid": "thanos" },
          "description": "Lag divided by consume rate — how long a message arriving now will wait before a handler touches it. Add these along the transfer path (prepare -> position-batch -> fulfil -> notification) to get the queueing component of hub latency. Spikes to very large values when a consumer group stalls and the consume rate approaches zero; that is a stall, read it as such.",
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3, "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "sum by (topic, consumergroup) (kafka_consumergroup_lag_sum{cluster_name=\"$hub\", topic!~\"topic-event-.*\"}) / clamp_min(sum by (topic, consumergroup) (rate(kafka_consumergroup_current_offset_sum{cluster_name=\"$hub\", topic!~\"topic-event-.*\"}[$__rate_interval])), 0.001) > 0",
              "legendFormat": "{{topic}} / {{consumergroup}}"
            }
          ]
        },
        {
          "title": "Consumer lag by topic",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 5 },
          "datasource": { "uid": "thanos" },
          "description": "Messages outstanding per topic and consumer group, aggregated across partitions. Sawtooth is normal batching; a line that climbs and does not come back down is a consumer that cannot keep up.",
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "sum by (topic, consumergroup) (kafka_consumergroup_lag_sum{cluster_name=\"$hub\", topic!~\"topic-event-.*\"}) > 0",
              "legendFormat": "{{topic}} / {{consumergroup}}"
            }
          ]
        },
        {
          "title": "Produce vs consume rate by topic",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 15 },
          "datasource": { "uid": "thanos" },
          "description": "Messages written to each topic against messages committed by its consumers. Sustained divergence is the definition of a backlog forming; they should track each other closely at steady state.",
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 2, "custom": { "fillOpacity": 6 } } },
          "targets": [
            { "expr": "sum by (topic) (rate(kafka_topic_partition_current_offset{cluster_name=\"$hub\", topic!~\"topic-event-.*\"}[$__rate_interval])) > 0", "legendFormat": "produced — {{topic}}" },
            { "expr": "sum by (topic) (rate(kafka_consumergroup_current_offset_sum{cluster_name=\"$hub\", topic!~\"topic-event-.*\"}[$__rate_interval])) > 0", "legendFormat": "consumed — {{topic}}" }
          ]
        },
        {
          "title": "Partition skew — $topic",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 15 },
          "datasource": { "uid": "thanos" },
          "description": "Lag per partition for the selected topic. Even partitions mean the partition key is distributing well; one hot partition means a key that does not vary (or fewer consumers than partitions) and caps throughput no matter how many replicas you add. Gated behind $topic on purpose — unfiltered, this is thousands of series.",
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "sum by (partition, consumergroup) (kafka_consumergroup_lag{cluster_name=\"$hub\", topic=\"$topic\"})",
              "legendFormat": "p{{partition}} / {{consumergroup}}"
            }
          ]
        },
        {
          "title": "Consumer group members",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": { "uid": "thanos" },
          "description": "Members per group. A step change is a rebalance — during one, consumption pauses entirely, which appears downstream as a latency spike with no corresponding CPU or database activity. Correlate timing with pod restarts on Service Runtime Saturation.",
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "custom": { "fillOpacity": 10, "lineInterpolation": "stepAfter" } } },
          "targets": [
            {
              "expr": "sum by (consumergroup) (kafka_consumergroup_members{cluster_name=\"$hub\"})",
              "legendFormat": "{{consumergroup}}"
            }
          ]
        },
        {
          "title": "Kafka produce latency by topic (SEND spans)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "uid": "thanos" },
          "description": "p99 time for a producer to hand a message to the broker, from OTel span metrics. This is acknowledgement time only, not the wait before consumption — the queue wait panels above cover that. Rising here points at the brokers or the network, not at the handlers.",
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 1, "custom": { "fillOpacity": 6 } } },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (span_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{cluster_name=\"$hub\", span_kind=\"SPAN_KIND_PRODUCER\", span_name!~\"SEND:topic-event-.*\"}[$__rate_interval])))",
              "legendFormat": "{{span_name}}"
            }
          ]
        },
        {
          "title": "Broker throughput",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "datasource": { "uid": "thanos" },
          "description": "Bytes in and out at the broker. Establishes whether a latency change coincides with a real load change or happened at constant load — the second case points at the hub, the first at capacity.",
          "fieldConfig": { "defaults": { "unit": "Bps", "decimals": 0, "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum(rate(kafka_server_brokertopicmetrics_bytesin_total{cluster_name=\"$hub\"}[$__rate_interval]))", "legendFormat": "bytes in" },
            { "expr": "sum(rate(kafka_server_brokertopicmetrics_bytesout_total{cluster_name=\"$hub\"}[$__rate_interval]))", "legendFormat": "bytes out" }
          ]
        },
        {
          "title": "Broker errors and ISR churn",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "datasource": { "uid": "thanos" },
          "description": "Failed produce and fetch requests, plus in-sync-replica expansions and shrinks. ISR churn means replicas are falling behind and rejoining, which stalls acknowledged writes and shows up as produce latency.",
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 3, "custom": { "fillOpacity": 20 } } },
          "targets": [
            { "expr": "sum(rate(kafka_server_brokertopicmetrics_failedproducerequests_total{cluster_name=\"$hub\"}[$__rate_interval])) > 0", "legendFormat": "failed produce" },
            { "expr": "sum(rate(kafka_server_brokertopicmetrics_failedfetchrequests_total{cluster_name=\"$hub\"}[$__rate_interval])) > 0", "legendFormat": "failed fetch" },
            { "expr": "sum(rate(kafka_server_replicamanager_isrshrinks_total{cluster_name=\"$hub\"}[$__rate_interval])) > 0", "legendFormat": "ISR shrinks" },
            { "expr": "sum(rate(kafka_server_replicamanager_isrexpands_total{cluster_name=\"$hub\"}[$__rate_interval])) > 0", "legendFormat": "ISR expands" }
          ]
        },
        {
          "title": "Drill-down",
          "type": "text",
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 40 },
          "options": {
            "mode": "markdown",
            "content": "Lag growing at constant produce rate → the consumer is the problem: [Service Runtime Saturation](/d/perf-runtime?var-hub=$hub) for event-loop and CPU, [Data Layer Under Load](/d/perf-datalayer?var-hub=$hub) if its model calls are slow. Lag growing because produce rate rose → capacity: [Capacity & Headroom](/d/perf-capacity?var-hub=$hub). One hot partition → partition key or consumer count, not scaling. Back to [Transfer SLO](/d/perf-slo?var-hub=$hub) · [Hub Latency Breakdown](/d/perf-hub-stages?var-hub=$hub)."
          }
        }
      ]
    }
