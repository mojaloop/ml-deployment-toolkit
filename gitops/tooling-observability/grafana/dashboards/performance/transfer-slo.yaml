# Transfer SLO — L1 entry point for the Performance folder.
#
# Answers one question: are transfers meeting the latency mandate, and if not,
# is the time being spent inside the hub or outside it.
#
# SLO ARITHMETIC. Compliance is a bucket-exact ratio, not an interpolated
# percentile: count(<= threshold) / count(total), where the threshold is an
# EXACT histogram bucket boundary. histogram_quantile() on these histograms
# interpolates linearly inside a bucket, and every family here has a single
# bucket spanning 500ms..1s — so a "p99" near the SLO is invented, not
# measured. p99 appears on this dashboard as a TREND only; the gate is the
# ratio. Window is $__range (the dashboard time picker), so the compliance
# number always describes exactly the period on screen.
#
# THE le REGEX IS LOAD-BEARING. Bucket boundaries are serialised differently
# per exporter:
#   mojaloop_connector_* (SDK)  -> le="1"    le="5"
#   moja_*               (hub)  -> le="1.0"  le="5.0"
# A literal le="1" silently matches the DFSP histograms and MISSES every hub
# histogram — an empty result renders as 0% compliance, which reads as a total
# outage. $slo_latency therefore holds a REGEX matched with le=~ , covering
# both spellings. Do not "simplify" it to a literal.
#
# $dfsp is sourced from the hub-side `dest` label, so it enumerates every DFSP
# the hub serves whether or not that DFSP ships telemetry. Panels fed by
# mojaloop_connector_* (the DFSP's own SDK metrics) are therefore EMPTY for
# DFSPs with no observability agent. Empty means NOT REPORTING, never zero.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-perf-transfer-slo
  namespace: t7y-backend
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Performance"
data:
  transfer-slo.json: |
    {
      "uid": "perf-slo",
      "title": "Transfer SLO",
      "description": "Latency compliance for transfers, measured as a bucket-exact ratio over the selected time range, plus attribution of mean transfer time between the hub, the DFSPs and the network. Entry point for the Performance folder.",
      "tags": ["performance", "slo", "mojaloop"],
      "timezone": "utc",
      "editable": true,
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "hub",
            "label": "Hub cluster",
            "type": "query",
            "datasource": { "uid": "thanos" },
            "query": "label_values(moja_nodejs_eventloop_lag_seconds, cluster_name)",
            "refresh": 2,
            "includeAll": false,
            "current": {}
          },
          {
            "name": "dfsp",
            "label": "DFSP",
            "type": "query",
            "datasource": { "uid": "thanos" },
            "query": "label_values(moja_notification_event_delivery_count{cluster_name=\"$hub\"}, dest)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {}
          },
          {
            "name": "slo_target",
            "label": "Target success %",
            "type": "textbox",
            "query": "99",
            "current": { "text": "99", "value": "99" }
          },
          {
            "name": "slo_latency",
            "label": "Max latency",
            "type": "custom",
            "description": "Regex over the le label. Only exact bucket boundaries are offered; arbitrary values would require interpolation.",
            "query": "10ms : 0\\.01, 50ms : 0\\.05, 100ms : 0\\.1, 500ms : 0\\.5, 1s : 1(\\.0+)?, 5s : 5(\\.0+)?",
            "includeAll": false,
            "current": { "text": "1s", "value": "1(\\.0+)?" }
          }
        ]
      },
      "panels": [
        {
          "title": "Transfers within SLO (DFSP-observed)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 0, "y": 0 },
          "datasource": { "uid": "thanos" },
          "description": "Share of transfers completing within the selected max latency, as measured by the payer DFSP's own SDK, over the dashboard time range. Bucket-exact — no interpolation. Empty if no selected DFSP ships telemetry.",
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.95 }, { "color": "green", "value": 0.99 } ] } } },
          "targets": [
            {
              "expr": "sum(increase(mojaloop_connector_outbound_transfer_latency_bucket{cluster_name=~\"$dfsp\", le=~\"$slo_latency\"}[$__range])) / sum(increase(mojaloop_connector_outbound_transfer_latency_count{cluster_name=~\"$dfsp\"}[$__range]))",
              "legendFormat": "within SLO",
              "instant": true
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Error budget remaining",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 5, "y": 0 },
          "datasource": { "uid": "thanos" },
          "description": "Fraction of the allowed breach budget still unspent over the dashboard time range, against the $slo_target target. Negative means the budget is exhausted.",
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 2, "max": 1, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 0 }, { "color": "yellow", "value": 0.25 }, { "color": "green", "value": 0.5 } ] } } },
          "targets": [
            {
              "expr": "1 - ((1 - (sum(increase(mojaloop_connector_outbound_transfer_latency_bucket{cluster_name=~\"$dfsp\", le=~\"$slo_latency\"}[$__range])) / sum(increase(mojaloop_connector_outbound_transfer_latency_count{cluster_name=~\"$dfsp\"}[$__range])))) / (1 - $slo_target / 100))",
              "legendFormat": "budget left",
              "instant": true
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "p99 (trend only — not the gate)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 10, "y": 0 },
          "datasource": { "uid": "thanos" },
          "description": "Interpolated inside a coarse bucket, so treat as a direction of travel, not a number to quote. The compliance ratio to the left is the measured value.",
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3, "color": { "mode": "fixed", "fixedColor": "text" } } },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(mojaloop_connector_outbound_transfer_latency_bucket{cluster_name=~\"$dfsp\"}[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ],
          "options": { "colorMode": "none", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Transfer rate",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 14, "y": 0 },
          "datasource": { "uid": "thanos" },
          "description": "Hub-side completed transfer notifications. Uses the hub so it stays populated regardless of DFSP instrumentation.",
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 2 } },
          "targets": [
            {
              "expr": "sum(rate(moja_tx_transfer_fulfil_count{cluster_name=\"$hub\"}[$__rate_interval])) or vector(0)",
              "legendFormat": "transfers/s"
            }
          ],
          "options": { "colorMode": "none", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Callback delivery failures",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 19, "y": 0 },
          "datasource": { "uid": "thanos" },
          "description": "Share of hub -> DFSP callback deliveries reported unsuccessful. Independent of DFSP instrumentation.",
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.001 }, { "color": "red", "value": 0.01 } ] } } },
          "targets": [
            {
              "expr": "(sum(rate(moja_notification_event_delivery_count{cluster_name=\"$hub\", dest=~\"$dfsp\", success=\"false\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(moja_notification_event_delivery_count{cluster_name=\"$hub\", dest=~\"$dfsp\"}[$__rate_interval])), 0.0000001)",
              "legendFormat": "failed"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Where the time goes — hub vs outside the hub",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 5 },
          "datasource": { "uid": "thanos" },
          "description": "Mean transfer time decomposed. Hub prepare leg = payer POST /transfers received -> prepare callback dispatched to payee. Hub fulfil leg = payee PUT /transfers/{ID} received -> final notification dispatched. Outside the hub = payer-observed total minus those two, i.e. payee think time plus both network crossings. MEANS ARE USED DELIBERATELY: means are additive, quantiles are not, so this decomposition is arithmetically valid where a stacked p99 would be nonsense. Both hub legs are measured entirely inside the hub and so are unaffected by DFSP-side tracestate handling.",
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3, "custom": { "fillOpacity": 25, "stacking": { "mode": "normal" }, "lineWidth": 1 } } },
          "targets": [
            {
              "expr": "sum(rate(moja_tx_transfer_prepare_sum{cluster_name=\"$hub\"}[$__rate_interval])) / clamp_min(sum(rate(moja_tx_transfer_prepare_count{cluster_name=\"$hub\"}[$__rate_interval])), 0.0000001)",
              "legendFormat": "hub — prepare leg"
            },
            {
              "expr": "sum(rate(moja_tx_transfer_fulfil_sum{cluster_name=\"$hub\"}[$__rate_interval])) / clamp_min(sum(rate(moja_tx_transfer_fulfil_count{cluster_name=\"$hub\"}[$__rate_interval])), 0.0000001)",
              "legendFormat": "hub — fulfil leg"
            },
            {
              "expr": "clamp_min((sum(rate(mojaloop_connector_outbound_transfer_latency_sum{cluster_name=~\"$dfsp\"}[$__rate_interval])) / clamp_min(sum(rate(mojaloop_connector_outbound_transfer_latency_count{cluster_name=~\"$dfsp\"}[$__rate_interval])), 0.0000001)) - (sum(rate(moja_tx_transfer_prepare_sum{cluster_name=\"$hub\"}[$__rate_interval])) / clamp_min(sum(rate(moja_tx_transfer_prepare_count{cluster_name=\"$hub\"}[$__rate_interval])), 0.0000001)) - (sum(rate(moja_tx_transfer_fulfil_sum{cluster_name=\"$hub\"}[$__rate_interval])) / clamp_min(sum(rate(moja_tx_transfer_fulfil_count{cluster_name=\"$hub\"}[$__rate_interval])), 0.0000001)), 0)",
              "legendFormat": "outside the hub (DFSP + network)"
            }
          ]
        },
        {
          "title": "Payer-observed transfer latency",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 5 },
          "datasource": { "uid": "thanos" },
          "description": "From the payer SDK's outbound API: request in to final response out. The closest thing to what a core banking system actually experiences. Percentiles are interpolated; the SLO line marks the exact bucket boundary the compliance ratio uses.",
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3, "custom": { "fillOpacity": 8, "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "transparent", "value": null }, { "color": "red", "value": 1 } ] } } },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(mojaloop_connector_outbound_transfer_latency_bucket{cluster_name=~\"$dfsp\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.9, sum by (le) (rate(mojaloop_connector_outbound_transfer_latency_bucket{cluster_name=~\"$dfsp\"}[$__rate_interval])))",
              "legendFormat": "p90"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(mojaloop_connector_outbound_transfer_latency_bucket{cluster_name=~\"$dfsp\"}[$__rate_interval])))",
              "legendFormat": "p99"
            },
            {
              "expr": "sum(rate(mojaloop_connector_outbound_transfer_latency_sum{cluster_name=~\"$dfsp\"}[$__rate_interval])) / clamp_min(sum(rate(mojaloop_connector_outbound_transfer_latency_count{cluster_name=~\"$dfsp\"}[$__rate_interval])), 0.0000001)",
              "legendFormat": "mean"
            }
          ]
        },
        {
          "title": "Compliance by DFSP — payer-observed",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "datasource": { "uid": "thanos" },
          "description": "Per-DFSP share of transfers within the SLO, from each DFSP's own SDK. Only DFSPs running an observability agent appear here — compare against the hub-side panel to the right, which covers every DFSP.",
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.95 }, { "color": "green", "value": 0.99 } ] } } },
          "targets": [
            {
              "expr": "sum by (cluster_name) (increase(mojaloop_connector_outbound_transfer_latency_bucket{cluster_name=~\"$dfsp\", le=~\"$slo_latency\"}[$__range])) / sum by (cluster_name) (increase(mojaloop_connector_outbound_transfer_latency_count{cluster_name=~\"$dfsp\"}[$__range]))",
              "legendFormat": "{{cluster_name}}",
              "instant": true
            }
          ],
          "options": { "displayMode": "gradient", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Callback delivery within SLO, by DFSP — hub-observed",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "datasource": { "uid": "thanos" },
          "description": "How quickly the hub can deliver a callback to each DFSP, split by action. Sourced entirely from the hub, so EVERY DFSP appears here regardless of whether it ships telemetry. A DFSP that is slow here is slow to accept callbacks — that is DFSP or network time, not hub time.",
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.95 }, { "color": "green", "value": 0.99 } ] } } },
          "targets": [
            {
              "expr": "sum by (dest, action) (increase(moja_notification_event_delivery_bucket{cluster_name=\"$hub\", dest=~\"$dfsp\", le=~\"$slo_latency\"}[$__range])) / sum by (dest, action) (increase(moja_notification_event_delivery_count{cluster_name=\"$hub\", dest=~\"$dfsp\"}[$__range]))",
              "legendFormat": "{{dest}} — {{action}}",
              "instant": true
            }
          ],
          "options": { "displayMode": "gradient", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Throughput and failures",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "datasource": { "uid": "thanos" },
          "description": "Hub-side transfer flow. A widening gap between prepare and fulfil is transfers entering the switch and not completing.",
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 2, "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum(rate(moja_tx_transfer_prepare_count{cluster_name=\"$hub\"}[$__rate_interval])) or vector(0)", "legendFormat": "prepare leg completed/s" },
            { "expr": "sum(rate(moja_tx_transfer_fulfil_count{cluster_name=\"$hub\"}[$__rate_interval])) or vector(0)", "legendFormat": "fulfil leg completed/s" },
            { "expr": "sum(rate(moja_notification_event_delivery_count{cluster_name=\"$hub\", dest=~\"$dfsp\", success=\"false\"}[$__rate_interval])) or vector(0)", "legendFormat": "callback delivery failures/s" }
          ]
        },
        {
          "title": "SLO breaches over time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "datasource": { "uid": "thanos" },
          "description": "Absolute count of transfers exceeding the selected max latency, per interval. Exact — derived by subtracting the SLO bucket from the total count, with no interpolation. This is the number that consumes error budget.",
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "custom": { "fillOpacity": 30, "drawStyle": "bars", "lineWidth": 0 }, "color": { "mode": "fixed", "fixedColor": "red" } } },
          "targets": [
            {
              "expr": "clamp_min(sum(increase(mojaloop_connector_outbound_transfer_latency_count{cluster_name=~\"$dfsp\"}[$__interval])) - sum(increase(mojaloop_connector_outbound_transfer_latency_bucket{cluster_name=~\"$dfsp\", le=~\"$slo_latency\"}[$__interval])), 0)",
              "legendFormat": "breaches (payer-observed)"
            }
          ]
        },
        {
          "title": "Drill-down",
          "type": "text",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 30 },
          "options": {
            "mode": "markdown",
            "content": "**Time is inside the hub** → [Hub Latency Breakdown](/d/perf-hub-stages?var-hub=$hub) · queueing? [Async & Kafka Pipeline](/d/perf-async?var-hub=$hub) · process-bound? [Service Runtime Saturation](/d/perf-runtime?var-hub=$hub) · database? [Data Layer Under Load](/d/perf-datalayer?var-hub=$hub)\n\n**Time is outside the hub** → [DFSP Latency](/d/perf-dfsp?var-hub=$hub) · transport? [Edge & Network Path](/d/perf-edge?var-hub=$hub)\n\n**Characterising or verifying a fix** → [Load Test Runs](/d/perf-loadtest) · [Capacity & Headroom](/d/perf-capacity?var-hub=$hub)\n\n---\n*Empty DFSP panels mean that DFSP is not reporting, not that it recorded zero. Hub-sourced panels cover every DFSP.*"
          }
        }
      ]
    }
