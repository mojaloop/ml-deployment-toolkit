# Secret half of the grafana distribution values: the admin password, split
# out of values/t7y-backend/grafana.yaml so no secret token ever passes
# through a ConfigMap. stringData, not a secretGenerator — kustomize
# generators base64-encode, hiding the substitution token from Flux's post-build
# substitution. Merged by the HelmRelease directly after the distribution
# ConfigMap, so template and environment overrides still win.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-values-secret
  namespace: flux-system
type: Opaque
stringData:
  values.yaml: |
    adminPassword: "${GRAFANA_ADMIN_PASSWORD}"
