# SMTP credentials for Grafana alert email delivery.
# Consumed by the chart's smtp.existingSecret mechanism (GF_SMTP_USER /
# GF_SMTP_PASSWORD env vars) — the chart refuses inline smtp.password in
# grafana.ini (assertNoLeakedSecrets).
apiVersion: v1
kind: Secret
metadata:
  name: grafana-smtp-credentials
  namespace: t7y-backend
stringData:
  user: "${SMTP_USER}"
  password: "${SMTP_PASSWORD}"
