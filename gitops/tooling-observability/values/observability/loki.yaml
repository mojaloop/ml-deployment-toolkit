# Distribution values for the loki HelmRelease.
# Adopter overrides go in environments/<env>/values/loki.yaml,
# which is merged after this file and therefore wins.
# Deployment mode: single binary (simpler for small scale)
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  # S3 storage configuration
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: minio.minio:9000
      insecure: true
      s3ForcePathStyle: true

  # Schema configuration
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Limits and retention
  limits_config:
    retention_period: 168h  # 7 days
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 10MB

  # Compactor for retention enforcement
  compactor:
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    # Use S3 for delete request durability (survives pod restarts)
    delete_request_store: s3

# Single binary deployment
singleBinary:
  replicas: 1
  # Sizing revised 2026-08-02 after repeated OOMKills (exit 137, 3 restarts).
  # The old values were requests == limits == 588Mi with steady usage at
  # 574Mi — 97.6% of the ceiling, so every flush/compaction spike was fatal.
  #
  # request 1Gi  : real steady demand plus room for 7-day retention upkeep.
  # limit  1.5Gi : DELIBERATELY above the request. requests == limits gives
  #   Guaranteed QoS, which sounds safer but means Loki can never exceed its
  #   request — that is exactly what killed it. The 50% gap absorbs spikes.
  #   Trade-off accepted: Burstable QoS is more evictable under node pressure,
  #   which is the right trade for a component whose data lives in S3.
  resources:
    requests:
      cpu: 163m
      memory: 1Gi
    limits:
      memory: 1.5Gi
  # GOMEMLIMIT is the lever that lets Loki SURVIVE rather than die predictably:
  # a soft ceiling making Go's GC progressively more aggressive as it nears the
  # value, so Loki sheds memory instead of being OOMKilled. ~90% of the limit,
  # leaving headroom for non-heap (stacks, mmap'd chunks). Same pattern applied
  # to Tempo in tooling-observability/values/observability/tempo.yaml.
  extraEnv:
    - name: GOMEMLIMIT
      value: "1350MiB"
  persistence:
    enabled: true
    size: 5Gi

# The rules sidecar ran unbounded (using ~70Mi) — a hole in the node's memory
# accounting on a cluster that is already oversubscribed on limits.
sidecar:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Disable all individual components (using SingleBinary instead)
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
ingester:
  replicas: 0
distributor:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
ruler:
  enabled: false

# Gateway for query access
gateway:
  enabled: true
  replicas: 1
  # chart 7.x defaults to REQUIRED pod anti-affinity, which deadlocks
  # rolling updates on single-node clusters — soften it
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: gateway
            topologyKey: kubernetes.io/hostname
  # chart 7.x nginx container ships without a seccompProfile; required by
  # the namespace's restricted PodSecurity level
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Results cache - reduce memory footprint for small deployment
resultsCache:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

# Chunks cache - disable for minimal footprint (using S3 direct)
chunksCache:
  enabled: false

# Monitoring
monitoring:
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# Test pod
test:
  enabled: false
