apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 12h
  releaseName: tempo
  targetNamespace: observability
  install:
    createNamespace: false
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
    - name: minio
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: tempo-values
      valuesKey: values.yaml
    - kind: Secret
      name: tempo-s3-credentials
      valuesKey: accessKey
      targetPath: tempo.storage.trace.s3.access_key
    - kind: Secret
      name: tempo-s3-credentials
      valuesKey: secretKey
      targetPath: tempo.storage.trace.s3.secret_key
    - kind: ConfigMap
      name: observability-tempo-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: observability-tempo-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: observability-tempo-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: observability-tempo-values-override
      valuesKey: values.yaml
      optional: true
