# Provider-specific values merged into the shared external-dns HelmRelease
# (gitops/platform/external-dns/) via valuesFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-provider-values
  namespace: flux-system
data:
  values.yaml: |
    provider:
      name: aws
    # The deployment domain is a child of the account's hosted zone, and the
    # zone lookup honors the domain filter — parent matching lets records land
    # in the zone that actually holds the domain
    extraArgs:
      - --aws-zone-match-parent
    env:
      - name: AWS_DEFAULT_REGION
        value: "${AWS_REGION}"
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: dns-provider-credentials
            key: access-key-id
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: dns-provider-credentials
            key: secret-access-key
