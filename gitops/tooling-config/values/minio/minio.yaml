# Distribution values for the minio HelmRelease.
# Adopter overrides go in environments/<env>/values/minio.yaml,
# which is merged after this file and therefore wins.

# TRANSITION SOLUTION (2026-10-15) — PGSTY Silo stands in for the discontinued
# MinIO community edition; see gitops/tooling-config/minio/helmrelease.yaml.
# nameOverride keeps every name and label the old chart produced (Service
# minio.minio:9000, minio-console, PVC minio, selector app=minio): consumers
# need no change and existing MinIO volumes upgrade in place. Without it the
# chart renders minio-silo / app=silo and the Deployment selector cannot change.
nameOverride: minio
# Published Silo release stack, pinned by multi-arch index digest. Keep the
# tags in step with the GitRepository tag in helmrelease.yaml.
image:
  repository: pgsty/silo
  tag: RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
mcImage:
  repository: pgsty/mc
  tag: RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
mode: standalone
replicas: 1
persistence:
  enabled: true
  size: 32Gi
resources:
  requests:
    memory: 256Mi
# System buckets. When object_storage.buckets declares extra buckets, the
# deployer-rendered minio-buckets-values Secret replaces this list with the
# union (Helm merges lists by replacement) — keep the two in sync with
# minio_system_buckets in src/engine/flux-config/main.tf.
buckets:
  - name: harbor
    policy: none
  - name: backups
    policy: none
  - name: thanos
    policy: none
  - name: loki
    policy: none
  - name: tempo
    policy: none
consoleIngress:
  enabled: false
