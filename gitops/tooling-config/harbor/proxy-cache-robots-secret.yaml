# Robot-account provisioning payload for the proxy-cache setup Job.
# ${harbor_robots_json} is base64(JSON [{name, secret}, ...]) rendered by
# Terraform (flux-config) into cluster-secrets — substituted into data:
# directly so the JSON never fights YAML quoting. Mounted, the file is the
# decoded plain JSON.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-robots
  namespace: harbor
type: Opaque
data:
  robots.json: "${harbor_robots_json}"
