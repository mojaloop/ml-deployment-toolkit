apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-proxy-cache-setup
  namespace: harbor
  labels:
    app.kubernetes.io/part-of: mojaloop
    mojaloop.io/layer: tooling
  annotations:
    # Jobs are immutable — let Flux delete-and-recreate on spec change so the
    # robots-hash annotation below re-runs the setup.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-proxy-cache-setup
      annotations:
        # Changes whenever a robot account or its secret changes.
        mojaloop.io/robots-hash: "${harbor_robots_hash}"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: alpine:3
          command: ["/bin/sh", "/scripts/setup.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: admin-secret
              mountPath: /secrets
              readOnly: true
            - name: oci-secret
              mountPath: /oci-secrets
              readOnly: true
            - name: robots-secret
              mountPath: /robot-secrets
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: harbor-proxy-cache-setup
            defaultMode: 0755
        - name: admin-secret
          secret:
            secretName: harbor-admin
        - name: oci-secret
          secret:
            secretName: oci-credentials
        - name: robots-secret
          secret:
            secretName: harbor-robots
