apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: harbor
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: harbor
      version: "1.19.1"
      sourceRef:
        kind: HelmRepository
        name: harbor
      interval: 12h
  releaseName: harbor
  targetNamespace: harbor
  install:
    createNamespace: false
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
    - name: minio
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: harbor-values
      valuesKey: values.yaml
    - kind: Secret
      name: harbor-credentials
      valuesKey: adminPassword
      targetPath: harborAdminPassword
    - kind: ConfigMap
      name: harbor-harbor-values-provider
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: harbor-harbor-values-template
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: harbor-harbor-values-override
      valuesKey: values.yaml
      optional: true
    - kind: Secret
      name: harbor-harbor-values-override
      valuesKey: values.yaml
      optional: true
