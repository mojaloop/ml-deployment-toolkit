apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vault/vault.yaml
  - vault/secretstore.yaml
  - minio/externalsecret.yaml
  - minio/helmrelease.yaml
  - harbor/externalsecret.yaml
  - harbor/helmrelease.yaml
  - harbor/proxy-cache-externalsecret.yaml
  - harbor/proxy-cache-oci-secret.yaml
  - harbor/proxy-cache-robots-secret.yaml
  - harbor/proxy-cache-job.yaml

# Distribution values for each HelmRelease in this kustomization.
# Rendered into ConfigMaps that the HelmRelease references first in valuesFrom;
# the adopter's <release>-values-override is merged after them and wins.
configMapGenerator:
  # Hash-suffixed (the values ConfigMaps below opt out individually — a global
  # disableNameSuffixHash would win over per-generator options): a script
  # change renames the ConfigMap, which rewrites the Job's volume reference —
  # a spec change — and the Job's force annotation lets Flux recreate it, so
  # edits re-run the otherwise-immutable setup Job.
  - name: harbor-proxy-cache-setup
    namespace: harbor
    files:
      - setup.sh=harbor/proxy-cache-setup.sh
  # Stable names: HelmReleases reference these by name in valuesFrom.
  - name: harbor-values
    namespace: flux-system
    files:
      - values.yaml=values/harbor/harbor.yaml
    options:
      disableNameSuffixHash: true
  - name: minio-values
    namespace: flux-system
    files:
      - values.yaml=values/minio/minio.yaml
    options:
      disableNameSuffixHash: true
