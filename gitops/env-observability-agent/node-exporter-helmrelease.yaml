apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.43.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  releaseName: node-exporter
  targetNamespace: observability
  install:
    createNamespace: false
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: node-exporter-values-override
      valuesKey: values.yaml
      optional: true
  values:
    # Run on all nodes including control-plane (Talos mixed-plane)
    tolerations:
      - operator: Exists

    # Host access for full visibility
    hostNetwork: true
    hostPID: true
    hostRootFsMount:
      enabled: true
      mountPropagation: HostToContainer

    # Resource limits
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

    # Disable ServiceMonitor (scraped by Alloy directly)
    prometheus:
      monitor:
        enabled: false

    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
