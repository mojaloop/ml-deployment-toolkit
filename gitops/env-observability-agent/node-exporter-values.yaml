# Distribution values for the node-exporter HelmRelease.
# Adopter overrides go in environments/<env>/values/node-exporter.yaml,
# which is merged after this file and therefore wins.
# Run on all nodes including control-plane (Talos mixed-plane)
tolerations:
  - operator: Exists

# Host access for full visibility
hostNetwork: true
hostPID: true
hostRootFsMount:
  enabled: true
  mountPropagation: HostToContainer

# Resource limits
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Disable ServiceMonitor (scraped by Alloy directly)
prometheus:
  monitor:
    enabled: false

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
