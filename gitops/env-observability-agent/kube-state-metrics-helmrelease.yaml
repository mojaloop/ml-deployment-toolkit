---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-state-metrics
      version: "5.27.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  releaseName: kube-state-metrics
  targetNamespace: observability
  install:
    createNamespace: false
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    remediation:
      retries: 3
  valuesFrom:
    # Distribution defaults. Adopter override is merged last and wins.
    - kind: ConfigMap
      name: kube-state-metrics-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: kube-state-metrics-values-override
      valuesKey: values.yaml
      optional: true
