# Distribution values for the alloy HelmRelease.
# Adopter overrides go in environments/<env>/values/alloy.yaml,
# which is merged after this file and therefore wins.
# Deploy as DaemonSet (one pod per node for log collection)
controller:
  type: deployment

# Alloy configuration using River syntax
alloy:
  # Sized from the Goldilocks/VPA recommendation (observability/goldilocks-alloy,
  # updateMode Off) measured 2026-07-30: target cpu 109m / memory 2296Mi,
  # lowerBound 1844Mi, upperBound 5917Mi.
  #
  # History: at 1536Mi the pod OOM-looped (131 kills in 15h, ~4min up / ~5min
  # CrashLoopBackOff) leaving 50% metric blind spots. The old 2Gi limit was
  # still BELOW the VPA target, and the old 512Mi request was 4.5x below it —
  # the scheduler believed this pod needed half a gig while it actually held
  # ~1.9Gi, which made node memory pressure unpredictable.
  #
  # requests == limits for memory means this pod never exceeds its memory
  # request, so it ranks last for eviction under node memory pressure. (QoS is
  # still Burstable, not Guaranteed — that would additionally require a CPU
  # limit, which we deliberately omit so scrape bursts aren't throttled.)
  # NOTE: the VPA reading predates the otelcol trace pipeline (tail_sampling
  # buffers traces in memory). Re-check goldilocks-alloy after ~24h of real
  # traffic, and before annotating many more services.
  resources:
    requests:
      cpu: 109m
      memory: 2296Mi
    limits:
      memory: 2296Mi
  # Enable clustering so DaemonSet pods shard scrape targets
  # instead of all pods scraping all targets (avoids duplicate metrics)
  clustering:
    enabled: true
  # OTLP ingress for traces from Mojaloop pods instrumented by the
  # OpenTelemetry Operator. Must be declared here so the ports land on the
  # Alloy Service — otelcol.receiver.otlp below only opens them in the pod.
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |
      /********************************************
       * LOG COLLECTION CONFIGURATION
       * Collects logs from all Kubernetes pods
       * and forwards to Loki in ml-cc cluster
       ********************************************/

      // Discover all Kubernetes pods across all namespaces
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Add useful metadata labels to logs
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Namespace label
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        // Pod name label
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        // Container name label
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // Node name label (useful for debugging)
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      // Collect logs from discovered pods
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.drop_noise.receiver]
      }

      // Drop the Event-SDK audit firehose before shipping: every Mojaloop
      // service prints full audit payloads to stdout on every message.
      // The same events already reach MongoDB via Kafka (reporting
      // pipeline), so the Loki copy is redundant — and during load tests
      // it dominated Alloy memory (~2Gi) and Loki/cc disk I/O.
      loki.process "drop_noise" {
        forward_to = [loki.write.default.receiver]

        stage.drop {
          expression = "audit: LOG_EVENT_TYPE"
        }
      }

      // Remote write logs to Loki in ml-cc cluster
      loki.write "default" {
        endpoint {
          url = "${loki_url}"

          // Skip TLS verification (both clusters in same network)
          // TODO: Remove insecure_skip_verify when proper CA trust is configured
          tls_config {
            insecure_skip_verify = true
          }
        }

        // Add cluster identifier label to all logs
        external_labels = {
          cluster_name = "${cluster_name}",
        }
      }

      /********************************************
       * METRICS COLLECTION CONFIGURATION
       * Scrapes Prometheus metrics from annotated
       * pods and services, forwards to Thanos
       ********************************************/

      // --- Pod-based discovery (Mojaloop app services, etc.) ---
      // Discovers pods with prometheus.io/scrape=true annotation
      discovery.kubernetes "annotated_pods" {
        role = "pod"
      }

      discovery.relabel "annotated_pods" {
        targets = discovery.kubernetes.annotated_pods.targets

        // Only scrape pods with prometheus.io/scrape annotation
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          action        = "keep"
          regex         = "true"
        }

        // Set scrape path from annotation (default: /metrics)
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          action        = "replace"
          target_label  = "__metrics_path__"
          regex         = "(.+)"
        }

        // Set scrape port from annotation
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          action        = "replace"
          target_label  = "__address__"
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
        }

        // Add useful metadata labels
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }
      }

      prometheus.scrape "annotated_pods" {
        targets    = discovery.relabel.annotated_pods.output
        clustering {
          enabled = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]

        scrape_interval = "30s"
        scrape_timeout  = "10s"
      }

      // --- Endpoint discovery (data layer, kube-state-metrics, etc.) ---
      // Discovers individual pod endpoints behind annotated services
      // Each pod gets its own instance label for per-pod visibility
      discovery.kubernetes "endpoints" {
        role = "endpoints"
      }

      discovery.relabel "endpoints" {
        targets = discovery.kubernetes.endpoints.targets

        // Only scrape endpoints whose service has prometheus.io/scrape annotation
        rule {
          source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
          action        = "keep"
          regex         = "true"
        }

        // Set scrape path from service annotation (default: /metrics)
        rule {
          source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
          action        = "replace"
          target_label  = "__metrics_path__"
          regex         = "(.+)"
        }

        // Set scrape port from service annotation
        rule {
          source_labels = ["__address__", "__meta_kubernetes_service_annotation_prometheus_io_port"]
          action        = "replace"
          target_label  = "__address__"
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
        }

        // Add useful metadata labels
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          target_label  = "service"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      prometheus.scrape "endpoints" {
        targets    = discovery.relabel.endpoints.output
        clustering {
          enabled = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]

        scrape_interval = "30s"
        scrape_timeout  = "10s"

        // kube-state-metrics emits the subject pod/namespace as metric
        // labels; without this they get demoted to exported_* and the
        // target labels (the KSM pod itself) win
        honor_labels = true
      }

      // --- Flux controllers (GitOps health) ---
      // Flux is bootstrapped by Terraform, so its pods carry no
      // prometheus.io annotations; scrape them by metrics port name.
      discovery.kubernetes "flux" {
        role = "pod"
        namespaces {
          names = ["flux-system"]
        }
      }

      discovery.relabel "flux" {
        targets = discovery.kubernetes.flux.targets

        // Keep only the controllers' metrics port (http-prom, 8080)
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          action        = "keep"
          regex         = "http-prom"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        // source-controller, kustomize-controller, helm-controller, ...
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "controller"
        }
      }

      prometheus.scrape "flux" {
        targets    = discovery.relabel.flux.output
        clustering {
          enabled = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]

        scrape_interval = "30s"
        scrape_timeout  = "10s"
      }

      /********************************************
       * INFRASTRUCTURE METRICS CONFIGURATION
       * Scrapes kubelet, cAdvisor, and node-exporter
       * for node and container resource metrics
       ********************************************/

      // Discover all cluster nodes (shared by kubelet + node-exporter scraping)
      discovery.kubernetes "nodes" {
        role = "node"
      }

      // Relabel nodes for kubelet scraping (port 10250)
      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets

        // Use the node's InternalIP for scraping
        rule {
          source_labels = ["__address__"]
          action        = "replace"
          target_label  = "__address__"
          regex         = "(.+?)(?::\\d+)?"
          replacement   = "$1:10250"
        }

        // Add node name label
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      // Scrape kubelet own metrics (/metrics) (clustered across Alloy pods)
      prometheus.scrape "kubelet" {
        targets    = discovery.relabel.kubelet.output
        clustering {
          enabled = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]

        scheme          = "https"
        scrape_interval = "30s"
        scrape_timeout  = "10s"
        metrics_path    = "/metrics"

        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          insecure_skip_verify = true
        }
      }

      // Scrape cAdvisor metrics from kubelet (/metrics/cadvisor) (clustered across Alloy pods)
      prometheus.scrape "cadvisor" {
        targets    = discovery.relabel.kubelet.output
        clustering {
          enabled = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]

        scheme          = "https"
        scrape_interval = "30s"
        scrape_timeout  = "10s"
        metrics_path    = "/metrics/cadvisor"

        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          insecure_skip_verify = true
        }
      }

      // Relabel nodes for node-exporter scraping (port 9100)
      discovery.relabel "node_exporter" {
        targets = discovery.kubernetes.nodes.targets

        // Use the node's InternalIP with node-exporter port
        rule {
          source_labels = ["__address__"]
          action        = "replace"
          target_label  = "__address__"
          regex         = "(.+?)(?::\\d+)?"
          replacement   = "$1:9100"
        }

        // Add node name label
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      // Scrape node-exporter metrics (clustered across Alloy pods)
      prometheus.scrape "node_exporter" {
        targets    = discovery.relabel.node_exporter.output
        clustering {
          enabled = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]

        scrape_interval = "30s"
        scrape_timeout  = "10s"
      }

      /********************************************
       * KUBERNETES API SERVER METRICS
       * Static target — apiserver is a Talos static
       * pod, not discoverable via annotations.
       ********************************************/

      prometheus.scrape "apiserver" {
        targets = [{
          __address__ = "kubernetes.default.svc:443",
        }]
        clustering {
          enabled = true
        }
        forward_to = [prometheus.remote_write.mimir.receiver]

        scheme          = "https"
        scrape_interval = "30s"
        scrape_timeout  = "10s"
        metrics_path    = "/metrics"

        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          insecure_skip_verify = true
        }
      }

      // Remote write metrics to Mimir in ml-cc cluster
      prometheus.remote_write "mimir" {
        endpoint {
          url = "${mimir_url}"

          tls_config {
            insecure_skip_verify = true
          }
        }

        // Add cluster identifier label to all metrics
        external_labels = {
          cluster_name = "${cluster_name}",
        }
      }

      /********************************************
       * TRACE COLLECTION (OTLP)
       * Receives OTLP from Mojaloop pods instrumented by the OpenTelemetry
       * Operator (see gitops/env-app/observability/instrumentation.yaml)
       * and forwards to Tempo in the cc cluster.
       *
       * Deliberately minimal: a River syntax error anywhere in this file
       * breaks the WHOLE Alloy config, taking metrics and logs down with it.
       * Retry and an in-memory sending queue are on by default, which is what
       * buffers traces while cc is unreachable.
       ********************************************/

      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          traces = [otelcol.processor.k8sattributes.default.input]
        }
      }

      // Enrich spans with namespace/pod/node/deployment so traces filter the
      // same way logs and metrics already do. The operator only injects pod
      // name/uid/node; namespace and deployment come from here.
      // NOTE: metadata list is deliberately limited to what Alloy's ClusterRole
      // can actually read (pods, namespaces, nodes, apps/replicasets). Adding
      // k8s.statefulset.name / daemonset / job / cronjob would fail RBAC.
      otelcol.processor.k8sattributes "default" {
        extract {
          metadata = [
            "k8s.namespace.name",
            "k8s.pod.name",
            "k8s.pod.uid",
            "k8s.node.name",
            "k8s.deployment.name",
            "k8s.container.name",
          ]
        }

        // Prefer the pod UID the operator already injects; fall back to the
        // source IP of the connection.
        pod_association {
          source {
            from = "resource_attribute"
            name = "k8s.pod.uid"
          }
        }

        pod_association {
          source {
            from = "connection"
          }
        }

        output {
          traces = [
            // RED metrics + topology get the FULL span stream, deliberately
            // BEFORE tail sampling — metrics computed on a sampled subset
            // would understate call counts and distort latency percentiles.
            otelcol.connector.spanmetrics.default.input,
            otelcol.connector.servicegraph.default.input,
            // Only this branch is sampled.
            otelcol.processor.tail_sampling.default.input,
          ]
        }
      }

      // Tail sampling: decide AFTER the trace is complete, so we can keep every
      // error and every slow trace and sample only the boring ones. This is why
      // the SDK head sampler is at 1.0 — a tail sampler behind a 0.1 head
      // sampler only ever sees 10% and cannot honour "keep all errors".
      // The 1000ms latency threshold is deliberately the p99<1s SLO: anything
      // that breaches the mandate is always kept.
      otelcol.processor.tail_sampling "default" {
        decision_wait = "5s"
        // Bounds memory — traces are buffered until a decision is made. This
        // pod has OOM-looped before; raise deliberately when more services are
        // annotated, and watch alloy memory when you do.
        num_traces = 5000

        policy {
          name = "keep-all-errors"
          type = "status_code"

          status_code {
            status_codes = ["ERROR"]
          }
        }

        policy {
          name = "keep-slo-breaches"
          type = "latency"

          latency {
            threshold_ms = 1000
          }
        }

        policy {
          name = "baseline-sample"
          type = "probabilistic"

          probabilistic {
            sampling_percentage = 10
          }
        }

        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      // RED metrics per service/operation, derived from spans. Works only
      // because central-services-stream sets real SpanKind PRODUCER/CONSUMER.
      otelcol.connector.spanmetrics "default" {
        namespace = "traces_span_metrics"

        histogram {
          unit = "ms"

          explicit {
            buckets = ["5ms", "10ms", "25ms", "50ms", "100ms", "250ms", "500ms", "1s", "2s", "5s", "10s"]
          }
        }

        output {
          metrics = [otelcol.exporter.prometheus.default.input]
        }
      }

      // Service topology (who calls whom) derived from PRODUCER/CONSUMER and
      // CLIENT/SERVER span pairs — the view trace-bridge could never produce,
      // because Event-SDK spans carry no span kind.
      otelcol.connector.servicegraph "default" {
        output {
          metrics = [otelcol.exporter.prometheus.default.input]
        }
      }

      // Span-derived metrics rejoin the existing metrics path to Thanos.
      // resource_to_telemetry_conversion stays OFF (default): promoting every
      // k8s resource attribute to a Prometheus label would explode cardinality.
      otelcol.exporter.prometheus "default" {
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      otelcol.processor.batch "default" {
        // Traces arrive in bursts under load; bound the batch so a spike
        // cannot balloon Alloy's heap (this pod has OOM-looped before).
        send_batch_size     = 512
        send_batch_max_size = 1024
        timeout             = "2s"

        output {
          traces = [otelcol.exporter.otlphttp.tempo.input]
        }
      }

      otelcol.exporter.otlphttp "tempo" {
        // tempo_url already ends in /v1/traces, so set traces_endpoint
        // explicitly — client.endpoint would have /v1/traces appended again.
        traces_endpoint = "${tempo_url}"

        client {
          endpoint = "${tempo_url}"

          tls {
            // Matches the existing loki/mimir posture: cc serves internal
            // certs that Alloy does not trust. Trusting the cc CA once would
            // let all three signals verify properly — worthwhile follow-up.
            insecure_skip_verify = true
          }
        }
      }

# Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Disable ServiceMonitor (no Prometheus in ml-test)
serviceMonitor:
  enabled: false
