apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: "0.9.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  releaseName: alloy
  targetNamespace: observability
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: alloy-values-override
      valuesKey: values.yaml
      optional: true
  values:
    # Deploy as DaemonSet (one pod per node for log collection)
    controller:
      type: deployment

    # Alloy configuration using River syntax
    alloy:
      # 2Gi limit is load-bearing: at 1536Mi the pod OOM-looped (131 kills in
      # 15h, ~4min up / ~5min CrashLoopBackOff) leaving 50% metric blind spots
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      # Enable clustering so DaemonSet pods shard scrape targets
      # instead of all pods scraping all targets (avoids duplicate metrics)
      clustering:
        enabled: true
      configMap:
        content: |
          /********************************************
           * LOG COLLECTION CONFIGURATION
           * Collects logs from all Kubernetes pods
           * and forwards to Loki in ml-cc cluster
           ********************************************/

          // Discover all Kubernetes pods across all namespaces
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Add useful metadata labels to logs
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            // Namespace label
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            // Pod name label
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            // Container name label
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            // Node name label (useful for debugging)
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
          }

          // Collect logs from discovered pods
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.drop_noise.receiver]
          }

          // Drop the Event-SDK audit firehose before shipping: every Mojaloop
          // service prints full audit payloads to stdout on every message.
          // The same events already reach MongoDB via Kafka (reporting
          // pipeline), so the Loki copy is redundant — and during load tests
          // it dominated Alloy memory (~2Gi) and Loki/cc disk I/O.
          loki.process "drop_noise" {
            forward_to = [loki.write.default.receiver]

            stage.drop {
              expression = "audit: LOG_EVENT_TYPE"
            }
          }

          // Remote write logs to Loki in ml-cc cluster
          loki.write "default" {
            endpoint {
              url = "${loki_url}"

              // Skip TLS verification (both clusters in same network)
              // TODO: Remove insecure_skip_verify when proper CA trust is configured
              tls_config {
                insecure_skip_verify = true
              }
            }

            // Add cluster identifier label to all logs
            external_labels = {
              cluster_name = "${cluster_name}",
            }
          }

          /********************************************
           * METRICS COLLECTION CONFIGURATION
           * Scrapes Prometheus metrics from annotated
           * pods and services, forwards to Thanos
           ********************************************/

          // --- Pod-based discovery (Mojaloop app services, etc.) ---
          // Discovers pods with prometheus.io/scrape=true annotation
          discovery.kubernetes "annotated_pods" {
            role = "pod"
          }

          discovery.relabel "annotated_pods" {
            targets = discovery.kubernetes.annotated_pods.targets

            // Only scrape pods with prometheus.io/scrape annotation
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
              action        = "keep"
              regex         = "true"
            }

            // Set scrape path from annotation (default: /metrics)
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
              action        = "replace"
              target_label  = "__metrics_path__"
              regex         = "(.+)"
            }

            // Set scrape port from annotation
            rule {
              source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
              action        = "replace"
              target_label  = "__address__"
              regex         = "([^:]+)(?::\\d+)?;(\\d+)"
              replacement   = "$1:$2"
            }

            // Add useful metadata labels
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "service"
            }
          }

          prometheus.scrape "annotated_pods" {
            targets    = discovery.relabel.annotated_pods.output
            clustering {
              enabled = true
            }
            forward_to = [prometheus.remote_write.mimir.receiver]

            scrape_interval = "30s"
            scrape_timeout  = "10s"
          }

          // --- Endpoint discovery (data layer, kube-state-metrics, etc.) ---
          // Discovers individual pod endpoints behind annotated services
          // Each pod gets its own instance label for per-pod visibility
          discovery.kubernetes "endpoints" {
            role = "endpoints"
          }

          discovery.relabel "endpoints" {
            targets = discovery.kubernetes.endpoints.targets

            // Only scrape endpoints whose service has prometheus.io/scrape annotation
            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
              action        = "keep"
              regex         = "true"
            }

            // Set scrape path from service annotation (default: /metrics)
            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
              action        = "replace"
              target_label  = "__metrics_path__"
              regex         = "(.+)"
            }

            // Set scrape port from service annotation
            rule {
              source_labels = ["__address__", "__meta_kubernetes_service_annotation_prometheus_io_port"]
              action        = "replace"
              target_label  = "__address__"
              regex         = "([^:]+)(?::\\d+)?;(\\d+)"
              replacement   = "$1:$2"
            }

            // Add useful metadata labels
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              target_label  = "service"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
          }

          prometheus.scrape "endpoints" {
            targets    = discovery.relabel.endpoints.output
            clustering {
              enabled = true
            }
            forward_to = [prometheus.remote_write.mimir.receiver]

            scrape_interval = "30s"
            scrape_timeout  = "10s"

            // kube-state-metrics emits the subject pod/namespace as metric
            // labels; without this they get demoted to exported_* and the
            // target labels (the KSM pod itself) win
            honor_labels = true
          }

          // --- Flux controllers (GitOps health) ---
          // Flux is bootstrapped by Terraform, so its pods carry no
          // prometheus.io annotations; scrape them by metrics port name.
          discovery.kubernetes "flux" {
            role = "pod"
            namespaces {
              names = ["flux-system"]
            }
          }

          discovery.relabel "flux" {
            targets = discovery.kubernetes.flux.targets

            // Keep only the controllers' metrics port (http-prom, 8080)
            rule {
              source_labels = ["__meta_kubernetes_pod_container_port_name"]
              action        = "keep"
              regex         = "http-prom"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            // source-controller, kustomize-controller, helm-controller, ...
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "controller"
            }
          }

          prometheus.scrape "flux" {
            targets    = discovery.relabel.flux.output
            clustering {
              enabled = true
            }
            forward_to = [prometheus.remote_write.mimir.receiver]

            scrape_interval = "30s"
            scrape_timeout  = "10s"
          }

          /********************************************
           * INFRASTRUCTURE METRICS CONFIGURATION
           * Scrapes kubelet, cAdvisor, and node-exporter
           * for node and container resource metrics
           ********************************************/

          // Discover all cluster nodes (shared by kubelet + node-exporter scraping)
          discovery.kubernetes "nodes" {
            role = "node"
          }

          // Relabel nodes for kubelet scraping (port 10250)
          discovery.relabel "kubelet" {
            targets = discovery.kubernetes.nodes.targets

            // Use the node's InternalIP for scraping
            rule {
              source_labels = ["__address__"]
              action        = "replace"
              target_label  = "__address__"
              regex         = "(.+?)(?::\\d+)?"
              replacement   = "$1:10250"
            }

            // Add node name label
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
          }

          // Scrape kubelet own metrics (/metrics) (clustered across Alloy pods)
          prometheus.scrape "kubelet" {
            targets    = discovery.relabel.kubelet.output
            clustering {
              enabled = true
            }
            forward_to = [prometheus.remote_write.mimir.receiver]

            scheme          = "https"
            scrape_interval = "30s"
            scrape_timeout  = "10s"
            metrics_path    = "/metrics"

            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

            tls_config {
              insecure_skip_verify = true
            }
          }

          // Scrape cAdvisor metrics from kubelet (/metrics/cadvisor) (clustered across Alloy pods)
          prometheus.scrape "cadvisor" {
            targets    = discovery.relabel.kubelet.output
            clustering {
              enabled = true
            }
            forward_to = [prometheus.remote_write.mimir.receiver]

            scheme          = "https"
            scrape_interval = "30s"
            scrape_timeout  = "10s"
            metrics_path    = "/metrics/cadvisor"

            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

            tls_config {
              insecure_skip_verify = true
            }
          }

          // Relabel nodes for node-exporter scraping (port 9100)
          discovery.relabel "node_exporter" {
            targets = discovery.kubernetes.nodes.targets

            // Use the node's InternalIP with node-exporter port
            rule {
              source_labels = ["__address__"]
              action        = "replace"
              target_label  = "__address__"
              regex         = "(.+?)(?::\\d+)?"
              replacement   = "$1:9100"
            }

            // Add node name label
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
          }

          // Scrape node-exporter metrics (clustered across Alloy pods)
          prometheus.scrape "node_exporter" {
            targets    = discovery.relabel.node_exporter.output
            clustering {
              enabled = true
            }
            forward_to = [prometheus.remote_write.mimir.receiver]

            scrape_interval = "30s"
            scrape_timeout  = "10s"
          }

          /********************************************
           * KUBERNETES API SERVER METRICS
           * Static target — apiserver is a Talos static
           * pod, not discoverable via annotations.
           ********************************************/

          prometheus.scrape "apiserver" {
            targets = [{
              __address__ = "kubernetes.default.svc:443",
            }]
            clustering {
              enabled = true
            }
            forward_to = [prometheus.remote_write.mimir.receiver]

            scheme          = "https"
            scrape_interval = "30s"
            scrape_timeout  = "10s"
            metrics_path    = "/metrics"

            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

            tls_config {
              insecure_skip_verify = true
            }
          }

          // Remote write metrics to Mimir in ml-cc cluster
          prometheus.remote_write "mimir" {
            endpoint {
              url = "${mimir_url}"

              tls_config {
                insecure_skip_verify = true
              }
            }

            // Add cluster identifier label to all metrics
            external_labels = {
              cluster_name = "${cluster_name}",
            }
          }

    # Resource requests and limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Disable ServiceMonitor (no Prometheus in ml-test)
    serviceMonitor:
      enabled: false
